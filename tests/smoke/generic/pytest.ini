# The generic runner's smoke fixture: run by `python -m pytest` in this
# directory, inside a clone of this repository (scripts/lib/testlib.sh,
# profile_input and profile_extra). This file makes this directory the rootdir,
# so pytest reads neither the repository's pyproject.toml nor a conftest.py
# above it, and needs no plugin the runtime image may not carry.
[pytest]
addopts = -p no:cacheprovider
