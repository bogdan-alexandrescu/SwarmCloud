<!doctype html>
<!--
  The acceptance suite's browser fixture (scripts/acceptance/groups/browser.sh).

  Three things on it are asserted, and none may change without changing the
  suite in the same commit:

    * the text in #known, read back through the runner's `extract` action;
    * the block #block, painted one exact colour (#12a150) over a large area,
      found in the full-page screenshot's pixels by scripts/acceptance/pngcheck.py
      -- a blank page, or any other page, does not contain it;
    * the form: `fill` #name, `click` #go, and #result then reads
      "Hello, <name>!", set by the script below. Only a real browser that ran
      the page's script can produce that text.

  Static and self-contained: no external font, image or script, so the page
  renders the same with no egress beyond this one request.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwarmCloud acceptance fixture</title>
  <style>
    body { margin: 0; padding: 24px; background: #ffffff; color: #111111; font: 16px/1.5 sans-serif; }
    #block { width: 100%; height: 320px; margin: 16px 0; background: #12a150; }
    #result { min-height: 1.5em; font-weight: bold; }
  </style>
</head>
<body>
  <h1>SwarmCloud acceptance fixture</h1>
  <p id="known">swarmcloud-acceptance-known-text-7f3a</p>
  <div id="block" aria-hidden="true"></div>
  <form id="form" onsubmit="return false;">
    <label for="name">Name</label>
    <input id="name" type="text" autocomplete="off">
    <button id="go" type="button">Greet</button>
  </form>
  <p id="result"></p>
  <script>
    document.getElementById("go").addEventListener("click", function () {
      var name = document.getElementById("name").value;
      document.getElementById("result").textContent = "Hello, " + name + "!";
    });
  </script>
</body>
</html>
