# Vulnerabilities accepted for a stated reason and a stated time.
#
# Everything here must have all four: an id, WHY it cannot simply be fixed, what
# actually protects us meanwhile, and an expiry. An entry that has expired fails
# the scan again, which is the point -- an ignore file with no expiry dates is
# just a slower way of turning the gate off.
#
# Nothing in this file is a judgement that the CVE is harmless. It is a
# judgement that we cannot fix it today and that we know what we are carrying.

vulnerabilities:
  # All three live inside the dependency trees of @anthropic-ai/claude-code and
  # @openai/codex, which are installed as published npm packages. We do not
  # resolve their transitive versions -- their own lockfiles do -- so there is
  # no version of these CLIs we can pin that carries the fixed releases. The
  # alternative would be forking the CLIs, which trades a denial-of-service risk
  # for a supply-chain one.
  #
  # What bounds them: they are reachable only from inside an agent container,
  # which is non-root with a read-only root filesystem, dropped capabilities, a
  # per-attempt workspace that is destroyed afterwards, and a NetworkPolicy that
  # denies egress to every other tenant. A DoS there fails one attempt, which
  # the platform already treats as an ordinary outcome and retries; it does not
  # reach another tenant or the control plane.
  #
  # Revisit by bumping CLAUDE_CODE_VERSION / CODEX_VERSION in
  # images/agent-runtime-base/Dockerfile and re-running `make push`.
  - id: CVE-2026-14257
    statement: "brace-expansion DoS, transitive under the agent CLIs; no fixed release we can pin."
    expired_at: 2026-12-17
  - id: CVE-2026-69152
    statement: "brace-expansion DoS bypassing the CVE-2026-14257 mitigation; same tree, same constraint."
    expired_at: 2026-12-17
  - id: CVE-2026-73566
    statement: "node-tar DoS on crafted long-path archives, transitive under the agent CLIs."
    expired_at: 2026-12-17

  # SSRF through inconsistent IP parsing. Same tree and the same constraint, but
  # noted separately because the failure mode is NOT a denial of service: a
  # request that should have been refused as internal can be made. The container
  # NetworkPolicy is what carries the weight here rather than the retry
  # behaviour, so if that policy is ever relaxed this entry must be revisited
  # before it expires, not after.
  - id: CVE-2026-69192
    statement: "ip-address SSRF, transitive under the agent CLIs; bounded by the egress NetworkPolicy."
    expired_at: 2026-12-17

  # Go standard library and golang.org/x/net net/http denial-of-service bugs,
  # disclosed 2026-10-09, found in every THIRD-PARTY Go binary our images ship:
  # docker, gcloud-crc32c, gke-gcloud-auth-plugin, gh, kubectl, terraform,
  # trivy and gopls (agent-runtime-base, -browser, -indexer, workspace-apply).
  # We do not build these: each vendor has to rebuild with Go 1.26.9 / 1.27.2
  # and x/net 0.60.0, and until they ship there is no version we can pin. Every
  # release from 2026-10-09T17:27Z was refused on these two ids alone, so
  # nothing merged after that was deployed. Accepted by the owner 2026-10-10.
  #
  # What bounds them: both are DoS against an HTTP peer, and these binaries are
  # clients run inside a non-root, read-only, capability-dropped container for
  # one attempt, under the egress NetworkPolicy. A crafted response can at worst
  # fail that attempt, which the platform already retries; it reaches no other
  # tenant and no control-plane service.
  #
  # Revisit by bumping each tool's pinned version in the image Dockerfiles as
  # vendors release rebuilt binaries. The expiry is short on purpose.
  # Extended one week, 2026-10-24 -> 2026-10-31, by the owner on 2026-10-21:
  # the same three ids below and in the next block, statements unchanged.
  - id: CVE-2026-78667
    statement: "Go stdlib net/http DoS inside vendor-built Go binaries (docker, gcloud helpers, gh, kubectl, terraform, trivy, gopls); needs vendor rebuilds."
    expired_at: 2026-10-31
  - id: CVE-2026-78669
    statement: "golang.org/x/net http2 DoS inside the same vendor-built Go binaries; needs vendor rebuilds."
    expired_at: 2026-10-31
  # Same class, added the same night (owner, 2026-10-10): the next release after
  # PR 992 was refused on this id alone, in the same vendor binaries and images,
  # fixed by the same Go 1.26.9 / 1.27.2. Same bound: a crafted TLS peer can at
  # worst fail one retried attempt in a sandboxed client container.
  - id: CVE-2026-97031
    statement: "Go stdlib crypto/tls DoS (ECH extensions) inside the same vendor-built Go binaries; needs vendor rebuilds."
    expired_at: 2026-10-31
  # Same class again (owner, 2026-10-17): golang.org/x/text's precis Nickname
  # profile can panic on an out-of-bounds slice. It is in two vendor-built
  # binaries: kubectl (agent-runtime-base, -nocodex, -browser, -indexer and
  # workspace-apply) and Google's prebuilt gke-gcloud-auth-plugin
  # (agent-runtime-base and its children), whose newest apt release, 589.0.0,
  # still carries x/text v0.40.0. Measured on 2026-10-17: `strings` over the
  # 587.0.0 and 589.0.0 plugin binaries finds x/text's secure/bidirule,
  # unicode/bidi and unicode/norm, and no secure/precis, so the plugin does
  # not link the vulnerable package at all. Fixed in x/text 0.41.0, but no kubectl release ships it:
  # 1.36.5 (pinned) carries v0.39.0 and the newest, 1.37.1, carries v0.40.0
  # (read from each binary's build info, 2026-10-17). The releases at 18:53Z and
  # 19:43Z were refused on this id alone, so nothing merged after 18:03Z deployed.
  # Same bound: a panic ends one kubectl invocation inside a non-root, read-only,
  # capability-dropped attempt, which the platform retries. Revisit by bumping
  # KUBECTL_VERSION in both Dockerfiles once a release ships x/text >= 0.41.0.
  - id: CVE-2026-56851
    statement: "golang.org/x/text precis Nickname panic inside vendor-built kubectl; no kubectl release ships x/text 0.41.0 yet."
    expired_at: 2026-12-17
  # Same class again (owner, 2026-10-21 ~08:50Z UTC): a Go standard library
  # crypto/x509 fix (CVE-2026-111943, fixed in Go 1.26.10 / 1.27.3) found in
  # every THIRD-PARTY Go binary our images ship: docker, gcloud-crc32c,
  # gke-gcloud-auth-plugin, gh, kubectl, terraform and trivy (agent-runtime-base,
  # -nocodex, -browser, -indexer). We do not build these; each vendor has to
  # rebuild with the fixed Go, and until they ship there is no version we can
  # pin. Every image build from 2026-10-21 ~08:20Z was refused on this id alone
  # (PRs 1806 and 1807 at their heads), so nothing that rebuilds an image could
  # merge or release.
  #
  # What bounds it: these binaries are clients run inside a non-root, read-only,
  # capability-dropped container for one attempt, under the egress
  # NetworkPolicy that denies every other tenant and the control plane; they
  # hold no credential beyond the attempt's own. Unlike the DoS entries above,
  # the scanner's title for this one is about certificate verification, so the
  # expiry is shorter: replace each tool with a vendor release built on the
  # fixed Go as soon as one ships (docs/versions.md), re-scanning first.
  #
  # Extended one week on 2026-10-28, the day it expired: every image build was
  # refused again (workspace-apply in PR 2592's build-check). Re-measured that
  # day from each binary's build info: kubectl 1.36.6 now ships on go1.26.10
  # (fixed), but gke-gcloud-auth-plugin has no fixed build -- 587.0.0 is
  # go1.26.6 and the newest, 590.0.1 and 591.0.0, are go1.27.1 (fixed in
  # 1.27.3) -- so the entry is still needed for at least that tool.
  - id: CVE-2026-111943
    statement: "Go stdlib crypto/x509 inside vendor-built Go binaries (docker, gcloud helpers, gh, kubectl, terraform, trivy); needs vendor rebuilds."
    expired_at: 2026-11-04

  # Same class again (PROPOSED 2026-10-28 ~10:00Z by CLD for the owner's decision;
  # this entry is not accepted until BGD merges it): go-jose v4 DoS when parsing
  # JWKs that contain RSA keys (CVE-2026-116587, HIGH, fixed in go-jose 4.1.6),
  # inside two THIRD-PARTY Go binaries the runtime images ship:
  # /usr/local/bin/terraform (1.16.4, go-jose 4.1.4/4.1.5) and
  # /usr/local/bin/trivy (0.75.0, go-jose 4.1.5) in agent-runtime-base,
  # -nocodex, -browser, -indexer and swarm-reconciler. Every image build and
  # release since 2026-10-27 ~20:16Z is refused on it (#2597). VENDOR-GOJOSE
  # (task under wf_d9026ca5f9f544e49aed) measured on 2026-10-28 09:29-09:32Z that no
  # upstream release carries the fix yet: trivy 0.76.1 (newest) and terraform
  # 1.17.0 / 1.16.7 (newest) still embed go-jose < 4.1.6, read from each
  # binary's build info against the vendor's published checksums.
  #
  # What bounds it: both are clients run inside a non-root, read-only,
  # capability-dropped container for one attempt, under the egress
  # NetworkPolicy that denies every other tenant and the control plane. The
  # flaw is a denial of service while parsing a JWK set; a crafted JWKS can at
  # worst stop that one attempt's tool, which the platform treats as an
  # ordinary failed attempt. Short expiry: take the first terraform and trivy
  # releases built on go-jose >= 4.1.6 (docs/versions.md), re-scanning first.
  #
  # Also found 2026-10-28 when PR 2593's build-check refused agent-runtime-base
  # and -nocodex on trivy 0.75.0 (TRIVY_VERSION in
  # images/agent-runtime-base/Dockerfile; the agent's copy, not the gate's),
  # measured with `trivy rootfs --scanners vuln --severity HIGH,CRITICAL
  # --ignore-unfixed` over the pinned vendor downloads. (tofu also carries it,
  # but INSTALL_TOFU is 0.)
  - id: CVE-2026-116587
    statement: "go-jose v4 JWK parsing DoS inside vendor-built terraform and trivy; no vendor release carries go-jose 4.1.6 yet."
    expired_at: 2026-11-04
