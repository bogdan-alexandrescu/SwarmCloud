# Vulnerabilities accepted for a stated reason and a stated time.
#
# Everything here must have all four: an id, WHY it cannot simply be fixed, what
# actually protects us meanwhile, and an expiry. An entry that has expired fails
# the scan again, which is the point -- an ignore file with no expiry dates is
# just a slower way of turning the gate off.
#
# Nothing in this file is a judgement that the CVE is harmless. It is a
# judgement that we cannot fix it today and that we know what we are carrying.

vulnerabilities:
  # All three live inside the dependency trees of @anthropic-ai/claude-code and
  # @openai/codex, which are installed as published npm packages. We do not
  # resolve their transitive versions -- their own lockfiles do -- so there is
  # no version of these CLIs we can pin that carries the fixed releases. The
  # alternative would be forking the CLIs, which trades a denial-of-service risk
  # for a supply-chain one.
  #
  # What bounds them: they are reachable only from inside an agent container,
  # which is non-root with a read-only root filesystem, dropped capabilities, a
  # per-attempt workspace that is destroyed afterwards, and a NetworkPolicy that
  # denies egress to every other tenant. A DoS there fails one attempt, which
  # the platform already treats as an ordinary outcome and retries; it does not
  # reach another tenant or the control plane.
  #
  # Revisit by bumping CLAUDE_CODE_VERSION / CODEX_VERSION in
  # images/agent-runtime-base/Dockerfile and re-running `make push`.
  - id: CVE-2026-14257
    statement: "brace-expansion DoS, transitive under the agent CLIs; no fixed release we can pin."
    expired_at: 2026-12-17
  - id: CVE-2026-69152
    statement: "brace-expansion DoS bypassing the CVE-2026-14257 mitigation; same tree, same constraint."
    expired_at: 2026-12-17
  - id: CVE-2026-73566
    statement: "node-tar DoS on crafted long-path archives, transitive under the agent CLIs."
    expired_at: 2026-12-17

  # SSRF through inconsistent IP parsing. Same tree and the same constraint, but
  # noted separately because the failure mode is NOT a denial of service: a
  # request that should have been refused as internal can be made. The container
  # NetworkPolicy is what carries the weight here rather than the retry
  # behaviour, so if that policy is ever relaxed this entry must be revisited
  # before it expires, not after.
  - id: CVE-2026-69192
    statement: "ip-address SSRF, transitive under the agent CLIs; bounded by the egress NetworkPolicy."
    expired_at: 2026-12-17

  # Go standard library and golang.org/x/net net/http denial-of-service bugs,
  # disclosed 2026-10-09, found in every THIRD-PARTY Go binary our images ship:
  # docker, gcloud-crc32c, gke-gcloud-auth-plugin, gh, kubectl, terraform,
  # trivy and gopls (agent-runtime-base, -browser, -indexer, workspace-apply).
  # We do not build these: each vendor has to rebuild with Go 1.26.9 / 1.27.2
  # and x/net 0.60.0, and until they ship there is no version we can pin. Every
  # release from 2026-10-09T17:27Z was refused on these two ids alone, so
  # nothing merged after that was deployed. Accepted by the owner 2026-10-10.
  #
  # What bounds them: both are DoS against an HTTP peer, and these binaries are
  # clients run inside a non-root, read-only, capability-dropped container for
  # one attempt, under the egress NetworkPolicy. A crafted response can at worst
  # fail that attempt, which the platform already retries; it reaches no other
  # tenant and no control-plane service.
  #
  # Revisit by bumping each tool's pinned version in the image Dockerfiles as
  # vendors release rebuilt binaries. The expiry is short on purpose.
  # Extended one week, 2026-10-24 -> 2026-10-31, by the owner on 2026-10-21:
  # the same three ids below and in the next block, statements unchanged.
  #
  # NARROWED AND RE-DATED 2026-10-31 -> 2026-11-07 (lane IMAGE-SCAN-NOV, part
  # of #2688; PROPOSED for the owner's review in that PR). The expiry refused
  # agent-runtime-browser in PR 2877's build (job 124436228578). Every tool
  # with a fixed vendor build is now PINNED to it instead, measured on
  # 2026-10-31 with `go version -m` and `trivy rootfs` over each vendor's own
  # download after a checksum match: gh 2.103.3 (go1.27.3, x/net v0.60.0),
  # docker 29.9.2 (go1.26.10), terraform 1.17.1 (go1.26.10, x/net v0.62.0),
  # trivy 0.76.1 (go1.27.3, x/net v0.60.0), gcloud-crc32c in google-cloud-cli
  # 591.0.0 (go1.27.2), and the indexer's Go toolchain 1.27.3, which links
  # gopls and terraform-ls. What is left has NO fixed vendor build:
  #   * Google's gke-gcloud-auth-plugin (agent-runtime-base, -nocodex,
  #     -browser, -indexer, workspace-apply): the newest, 591.0.0 in
  #     packages.cloud.google.com's apt index, is go1.27.1 with x/net v0.59.0,
  #     below the fixed go1.27.2 and x/net 0.60.0 -- all three ids;
  #   * kubectl (the same images): 1.36.6 is go1.26.10 (stdlib fixed) but
  #     links x/net v0.56.0, and the newest release, 1.37.2
  #     (dl.k8s.io/release/stable.txt), links v0.57.0 -- CVE-2026-78669 only.
  # Same bound as above. Revisit on or before 2026-11-07: re-read
  # packages.cloud.google.com's Packages index and dl.k8s.io's stable.txt,
  # run `go version -m` on the newest plugin and kubectl, bump GCLOUD_VERSION
  # (with both pool ids and checksums) and KUBECTL_VERSION in
  # images/agent-runtime-base/Dockerfile and images/workspace-apply/Dockerfile
  # to the first fixed build, and delete the entry its tool no longer needs.
  - id: CVE-2026-78667
    statement: "Go stdlib net/http DoS inside Google's prebuilt gke-gcloud-auth-plugin (591.0.0 is go1.27.1); no fixed Google build yet. Every other tool is pinned to a fixed vendor build."
    expired_at: 2026-11-07
  - id: CVE-2026-78669
    statement: "golang.org/x/net http2 DoS inside gke-gcloud-auth-plugin (591.0.0: go1.27.1, x/net v0.59.0) and kubectl (every release links x/net < 0.60.0; 1.37.2 has v0.57.0); no fixed vendor build yet."
    expired_at: 2026-11-07
