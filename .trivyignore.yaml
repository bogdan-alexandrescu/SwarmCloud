  # Same bound: a panic ends one kubectl invocation inside a non-root, read-only,
  # capability-dropped attempt, which the platform retries. Revisit by bumping
  # KUBECTL_VERSION in both Dockerfiles once a release ships x/text >= 0.41.0.
  - id: CVE-2026-56851
    statement: "golang.org/x/text precis Nickname panic inside vendor-built kubectl; no kubectl release ships x/text 0.41.0 yet."
    expired_at: 2026-12-17
