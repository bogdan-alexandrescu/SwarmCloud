# gitleaks configuration: the default rules, plus an allowlist of the test
# fixtures and public values a full-history scan found.
#
#   gitleaks git --log-opts="--all" --config .gitleaks.toml --redact=100 .
#
# Written for gitleaks 8.21.2 (linux_x64 tarball sha256
# 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba, checked
# against the release's checksums file). On 7 November 2026, before the history
# replacement and the public switch, that version scanned every commit the
# clone could see: every branch, every tag and every pull request head (11,546
# non-merge commits, and the 481 merges whose resolution differs from the
# automatic merge). It found 111 findings, and each one is matched here:
# deliberate fakes in redaction tests, or a public value that only looks like a
# key. None was a real credential.
#
# Why an allowlist of exact paths and not of tests/: a real credential pasted
# into a NEW test file must still be found. Each file below holds only synthetic
# values, built to exercise the redaction rules or the masking of served text.
# A file added here must be one whose every credential-shaped value is a fake;
# a new fake is better built at runtime (secrets.token_hex), which needs no
# entry at all.

title = "SwarmCloud gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Synthetic credentials in redaction and masking tests, and public values shaped like keys"
regexTarget = "line"
paths = [
  # Redaction and masking tests in the console: fake keys the masks must hide.
  '''^apps/swarm-ui/src/__tests__/artifacts\.pane\.test\.tsx$''',
  '''^apps/swarm-ui/src/__tests__/details\.followup\.test\.tsx$''',
  '''^apps/swarm-ui/src/__tests__/details\.masked\.everywhere\.test\.tsx$''',
  # A fixture token record's id, not a token.
  '''^apps/swarm-ui/src/__tests__/repofixture\.ts$''',
  # Fake question-text digests.
  '''^apps/swarm-ui/src/__tests__/workflows\.textkey\.test\.ts$''',
  # The generator of tests/fixtures/redaction-parity.json; it held the same
  # synthetic cases and is no longer in the tree.
  '''^scratchpad/wave-0927-redaction-family/gen_fixture\.py$''',
  # The parity corpus the Python and shell redaction filters both run.
  '''^tests/fixtures/redaction-parity\.json$''',
  # Redaction and masking tests: a synthetic value of each shape the rules
  # recognise (the files say so beside each one).
  '''^tests/unit/control_plane/test_json_artifact_masking\.py$''',
  '''^tests/unit/control_plane/test_log_redaction\.py$''',
  '''^tests/unit/control_plane/test_logs_mask_json_lines\.py$''',
  '''^tests/unit/control_plane/test_patch_artifact_applies\.py$''',
  '''^tests/unit/control_plane/test_repository_url_carries_no_credential\.py$''',
  '''^tests/unit/control_plane/test_served_names_masked\.py$''',
  '''^tests/unit/control_plane/test_task_input_route\.py$''',
  '''^tests/unit/scripts/test_make_logs_pem_order\.py$''',
  '''^tests/unit/worker/test_checkpoint_leaves_out_input\.py$''',
  # The upstream python image's environment, whose GPG_KEY is the public
  # fingerprint of the CPython release manager's signing key.
  '''^tests/unit/worker/test_image_env_reaches_the_runner\.py$''',
]
regexes = [
  # The Cloud SDK and auth plugin download's artifact pool ids and sha256
  # checksums: public, they pin what the image fetches.
  '''\bARG (GCLOUD|GKE_AUTH_PLUGIN)_(POOL_ID|SHA256)=''',
  # The live-browser test's password alphabet: the characters, not a password.
  '''\bPASSWORD_ALPHABET = "''',
  # An image reference by tag in the deploy-by-digest test.
  '''manifest\(\*\*\{"swarm-api": f"\{REPO_PATH\}/swarm-api:''',
]
