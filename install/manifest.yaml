  scope: core
  stage: 0
  provider: org-admin
  check: gcloud resource-manager org-policies describe constraints/gcp.restrictNonCmekServices --project=$P (if the org sets one)
  apply: no CMEK key ring is created by this repo's Terraform; Google-managed keys are the default everywhere except one optional variable
  verify: terraform/infra/variables.tf's wake/dead-letter Pub/Sub topics apply with their CMEK variable left empty (Google-managed keys)
  explain: if the org enforces a CMEK-required policy, the first apply of Pub/Sub topics, Secret Manager secrets, or storage buckets fails until a key ring this platform does not own is supplied -- something this repo deliberately avoids owning in the shared project
  guards: 'terraform/bootstrap/workspace_deployer.tf:526: ''CMEK would need a key ring this platform does not own in a shared project; same reasoning as the scheduler''s wake topic'''
  secret_entry: null
  depends_on: []
  evidence:
  - terraform/infra/variables.tf:970
  - terraform/bootstrap/workspace_deployer.tf:526
  notes: on a fresh, non-shared project, a CMEK-enforcing org policy would require creating and owning a KMS key ring from scratch -- nothing in this repo does that today
  step: preflight.org-policies
- id: org-policy.domain-restricted-sharing
  kind: org-policy
  scope: core
  stage: 0
  provider: org-admin
  check: gcloud resource-manager org-policies describe iam.allowedPolicyMemberDomains --project=$P
  apply: 'human step: the org/project''s Domain Restricted Sharing policy must permit an allUsers (or allUsers-equivalent) IAM grant on the two public-by-design resources this platform creates'
  verify: terraform apply of google_storage_bucket_iam_member.acceptance_fixture_public_read and the github_hooks.tf allUsers run.invoker binding succeed with 'No changes' on replan, rather than a policy-violation error
  explain: 'two resources are deliberately public: the acceptance-fixture bucket object (one fixed HTML page, read by the browser runner with no credential) and the GitHub webhook receiver''s run.invoker (GitHub cannot pass IAP or mint a Google ID token). Both grant allUsers by name, which Domain Restricted Sharing refuses outright if enforced'
  guards: 'terraform/infra/acceptance_fixture.tf:52-56: ''An organisation policy enforcing public access prevention would refuse it too; nothing in this repository measured one ... so the first apply is the measurement'' -- i.e. this is an unverified, first-apply trap on a fresh org'
  secret_entry: null
  depends_on: []
  evidence:
  - terraform/infra/acceptance_fixture.tf:50-56
  - terraform/infra/github_hooks.tf:77-122
  - terraform/bootstrap/variables.tf:553-554
  notes: 'first-apply trap: the agent/operator who wrote acceptance_fixture.tf explicitly could not read the live org policy; a fresh project under a DRS-enforcing org will fail this apply and needs either an org-policy exception or dropping the two allUsers grants'
  step: preflight.org-policies
