  apply: 'module.secret_manager -> terraform/modules/secret_manager/main.tf:76 google_secret_manager_secret.this, for_each over module.tenancy.secret_inputs, one per (tenant, provider) pair in var.tenants[t].providers ALSO: EITHER scripts/create-secrets.sh (describe-then-gcloud-secrets-create if missing, user-managed replication pinned to $R) OR swarm-api''s CredentialWriter.put_credential (apps/swarm-api/swarm_api/credentials.py create_secret, project-level unconditioned-by-name create grant from terraform/bootstrap/provider_keys.tf) -- TWO WRITERS, see notes'
  verify: a secret swarm-tenant-<t>-<provider> exists for every provider in that tenant's providers list
  explain: 'Holds the actual per-tenant, per-provider credential (e.g. swarm-tenant-eng-anthropic). Created EMPTY; scripts/create-secrets.sh --stdin adds the value, never Terraform. ALSO: one container per (tenant, provider in {anthropic,openai,git,typesafe}); the worker and swarm-api read the value under Tenant.secret_name()'
  guards: 'admin_members is per-tenant, not global: a single shared admin list would let any one tenant''s admin replace another tenant''s provider key with one pointing at a proxy they control ALSO: null'
  secret_entry: scripts/create-secrets.sh --tenant <t> --provider <provider> --stdin
  depends_on:
  - api.secretmanager
  - sa.tenant-worker
  - sa.swarm-api
  evidence:
  - terraform/infra/main.tf:258-299
  - terraform/modules/secret_manager/main.tf:76-140
  - scripts/create-secrets.sh:928-941
  - apps/swarm-api/swarm_api/credentials.py:150-192
  - terraform/bootstrap/provider_keys.tf:51-61
  - terraform/bootstrap/provider_keys.tf:146-176
  - apps/common/swarm_common/models.py:878-879
  notes: '409 risk: scripts/create-secrets.sh describes-then-creates (gcloud secrets describe at L934, gcloud secrets create at L940) while swarm-api''s put_credential (credentials.py:177-190) unconditionally calls create_secret and only then catches AlreadyExists. An operator running create-secrets.sh for a tenant at the same moment that tenant''s onboarding (or a PUT credential call) races swarm-api''s create is a real double-create window; both sides tolerate AlreadyExists so the practical failure is a replication-policy MISMATCH (script pins --replication-policy=user-managed --locations=$R; swarm-api''s create_secret uses replication from self._replication_locations or automatic{}) rather than a hard 409, but whichever call loses the race silently keeps the other''s replication policy forever.'
  step: infra.pass-1
  refs:
    terraform:
    - modules/secret_manager/google_secret_manager_secret.this
    - modules/secret_manager/google_secret_manager_secret_iam_binding.accessor
    - modules/secret_manager/google_secret_manager_secret_iam_binding.version_adder
