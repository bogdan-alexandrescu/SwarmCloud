- id: workspace-delegation.groups-dwd
  kind: workspace-delegation
  scope: core
  stage: 8
  provider: human-in-console
  check: 'the admin console has no read API for this from gcloud; operationally verify by exercising a group lookup and checking it does not raise ''Error(2028): Permission denied'''
  apply: 'human step in the Google Admin console (admin.google.com -> Security -> API controls -> Domain-wide delegation -> Add new): authorise swarm-api''s own runtime service account''s OAuth client id for the scope https://www.googleapis.com/auth/cloud-identity.groups.readonly'
  verify: 'swarm_api.groups succeeds reading a registered tenant group''s membership for groups_impersonate_user, rather than 503ing every authenticated request (a failed lookup is fatal by design, per invariant-adjacent design: an unknown higher-priority group could misfile a caller''s work)'
  explain: Cloud Identity's Groups API does not authorize through GCP IAM at all -- a *.gserviceaccount.com principal gets Error(2028) 'Permission denied' no matter which IAM role it holds (roles/cloudidentity.groupsReader is ALPHA with no included permissions). Domain-wide delegation lets the service account impersonate a real Workspace user (groups_impersonate_user) to read groups; apps/swarm-api/swarm_api/delegation.py builds this keylessly (iamcredentials signJwt + oauth2 token exchange) because Cloud Run has no service-account key file for credentials.with_subject()
  guards: live outage 2026-09-20 when turning tenant_groups back on 503'd every authenticated request (apps/swarm-api/swarm_api/delegation.py:1-24); also needs roles/iam.serviceAccountTokenCreator ON ITSELF for the service account (to sign its own JWT) granted separately in terraform, or the failure mode changes from Error(2028) to a named-permission 403
  secret_entry: null
  depends_on:
  - workspace-group.cloud-identity-presence
  evidence:
  - apps/swarm-api/swarm_api/delegation.py:1-38
  - terraform/infra/variables.tf:619-635
  - terraform/environments/dev/dev.tfvars:906-911
  - docs/deploying-without-an-organisation.md:85-99
  notes: the service account's own numeric OAuth client id must be read out of the IAM console per-deployment and pasted into the Admin console's DWD authorisation UI; this repo's dev value is hard-coded as a comment/derivation in terraform/infra/variables.tf:627-630 for THIS deployment's service account and is not reusable by a fresh project, which gets its own client id for its own swarm-api runtime SA
  step: identity.group-read
- id: workspace-group.admin-surface-swarm-admins
  kind: workspace-group
  scope: core
  stage: 8
  provider: human-in-console
  check: gcloud identity groups lookup --group-email=swarm-admins@<domain>
  apply: 'human step, NOT done in this deployment: create a dedicated swarm-admins@<domain> group and put it in ADMIN_GROUPS / admin_groups so the admin surface is group-governed rather than one named user'
  verify: terraform/environments/prod/prod.tfvars:145 names 'group:swarm-admins@saga.xyz' already, but terraform/environments/dev/dev.tfvars:538 documents it does NOT exist in this Workspace
  explain: admin_groups governs who may act across every tenant in swarm-api (reading other tenants' tasks, non-tenant-scoped platform routes); empty is the safe default (no admin at all)
  guards: 'terraform/environments/dev/dev.tfvars:538-549: ''group:swarm-admins@saga.xyz does not exist in this Workspace, and creating it needs Workspace-admin rights. For dev the platform admin is a NAMED USER, which satisfies the same constraint... Create the group and switch this back before prod, where one named human is a single point of failure'' -- and it must never be a tenant''s own group, which terraform/infra/variables.tf''s validation enforces by construction only for secret_admin_members, not for admin_groups generally'
  secret_entry: null
  depends_on:
  - workspace-group.cloud-identity-presence
  evidence:
  - terraform/environments/dev/dev.tfvars:533-551
  - terraform/environments/prod/prod.tfvars:145
  - terraform/infra/variables.tf:700-765
  notes: 'SURPRISE: prod.tfvars already names a group that dev.tfvars documents as never created in this Workspace -- prod''s config is therefore unproven to actually resolve until someone creates swarm-admins@saga.xyz by hand. A fresh install inherits the same gap unless it creates its own admin group before first use of its prod-shaped tfvars'
  probe:
    type: groups_probe_via_api
    route: /v1/admin/setup/health/groups-probe
  step: identity.admin-group
- id: workspace-group.cloud-identity-presence
  kind: workspace-group
  scope: core
  stage: 8
  provider: org-admin
  check: gcloud identity groups search --organization=<org-id> (or, for a specific group) gcloud identity groups lookup --group-email=<group>
