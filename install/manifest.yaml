# Collected references no entry lists, each with why that is right (design section 3.3).
ignored:
  secret_flag:
  - match: --stdin
    reason: 'a modifier: the value is read from standard input for whichever secret the other options name'
  - match: --disable-previous
    reason: 'a modifier: disables the previous versions of the secret the other options name'
  - match: --overwrite
    reason: 'a modifier: adds a version to an existing secret named by its argument; it creates no secret of its own'
  - match: --name
    reason: 'removed: the case only refuses (a tenant''s secret is always swarm-tenant-<tenant>-<provider>)'
  variable:
  - match: infra/allow_unprotected_prod
    reason: a guard override, default false; nothing sets it implicitly and an install never does, so deletion protection stays on
  - match: infra/bucket_force_destroy
    reason: a teardown knob, default false and refused in prod; uninstall (design section 10) owns deletion, the install keeps the default
  - match: infra/bootstrap_firestore_documents
    reason: 'default true and the install keeps it: Terraform writes the bootstrap Firestore documents (firestore.* entries)'
  - match: infra/additional_repositories_enabled
    reason: a product feature flag, OFF by default; the install leaves it off and an operator turns it on later, so it gates no install step
  - match: infra/internal_decision_api_enabled
    reason: a product feature flag, default false; the install leaves it off and an operator turns it on later, so it gates no install step
  - match: infra/pr_console_links
    reason: a product feature flag, default false; the install leaves it off and an operator turns it on later, so it gates no install step

