# SwarmCloud Day One: the dependency manifest (DAYONE-MANIFEST-1; part of #2688)
#
# Every dependency a from-scratch install of SwarmCloud into a new Google Cloud
# project needs. The installer, `swarm doctor`, the console's Admin > Setup and
# the generated install guide read it through `swarm_install.manifest`
# (docs/design/day-one-install.md sections 2 and 3; docs/design/day-one-plan.md
# section 1).
#
# What this file holds. The P0 draft's entries
# (docs/design/day-one/manifest.draft.yaml), less the 13 that DAYONE-P2 added
# for code a later lane creates: each of those is added by that lane's own
# fragment, install/manifest.d/<lane>.yaml, in the PR that creates its code. So
# this base holds every entry whose reference exists on main: the draft's 433,
# the plan's section 1.8 additions with no collectable reference (`other.*`,
# `workspace-delegation.groups-reader-admin-role`) and the two whose code is
# already in the tree (`declared-value.monitoring-excluded-tenants`,
# `switch.tenant_job_vpc_egress`).
#
# Fragments. A lane that adds, changes or removes a collectable item writes
# install/manifest.d/<lane>.yaml with the same top-level keys (`entries`,
# `ignored`, `env`; never `counts`). A fragment restates a base entry only with
# `replace: true`; two fragments naming one id fail to load.
#
# Entry fields: the draft's (id, kind, scope, stage, provider, check, apply,
# verify, explain, guards, secret_entry, depends_on, evidence, notes; its
# header documents each) plus P3's four (design section 3.1):
#   probe   the typed read-only check, {type: ..., <arguments>}
#   step    the id of the engine step (swarm_install/steps/*.py) that satisfies
#           the entry; when a step's `satisfies` lists the entry, that step.
#           Every entry, base and fragment, names one: `swarm install
#           --repair <id>` runs it (tests/unit/install/test_manifest_steps.py)
#   refs    the references tests/unit/install/test_manifest_complete.py
#           collects, by collector: terraform, api, secret, secret_flag,
#           scheduler_job, image, kubernetes, variable (exact keys or fnmatch
#           patterns; swarm_install/manifest.py documents each key's shape)
#   expand  per_tenant | per_profile | per_account, for a template entry
# and `new: true` on an `api.*` entry no API list holds yet.
#
# The test fails on an unlisted dependency: every Terraform resource and data
# source, API, service environment variable, secret id, create-secrets.sh
# option, Scheduler job, image, Kubernetes object and bool/enable_* variable in
# the tree is in some entry's refs, in `env:`, or in `ignored:` with a reason;
# and every ref, ignored match and env name still matches the tree.
#
# `counts:` is this file's header table: tests/unit/install/
# test_manifest_counts.py holds it equal to the entries below (fragments are
# not counted). Placeholders: $P project id, $R region, $E environment, $T
# tenant id, $H hostname, $V release version. No secret value appears here.

