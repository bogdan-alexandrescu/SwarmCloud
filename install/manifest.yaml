  notes: 'FIRST-APPLY TRAP: scripts/bootstrap.sh creates this bucket with `gcloud storage buckets create` BEFORE the first `terraform init` (the backend must exist before Terraform can initialise into it). state_bucket.tf then declares the SAME bucket as a plain `resource "google_storage_bucket" "state"` with no `import` block and no create_ignore_already_exists (the provider has none for this resource). Grepped the whole root (`terraform import`, `google_storage_bucket.state`) and found no import logic anywhere in scripts/ or terraform/bootstrap/*.tf. On a truly fresh project the first `terraform apply` of this root is therefore expected to fail the create of google_storage_bucket.state with a 409 ALREADY_EXISTS, unless the bucket is imported by hand first (not verified live -- no test or runbook step for this was found).'
