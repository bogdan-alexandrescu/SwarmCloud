  apply: 'human step: if the org enforces a resource-location constraint, it must admit us-central1 (REGION default in scripts/lib/common.sh:159) before any terraform apply that creates a bucket, Cloud Run service or GKE cluster'
  verify: the first terraform apply (module.storage, module.artifact_registry) does not fail with 'Operation denied by org policy constraints/gcp.resourceLocations'
  explain: every regional resource this repo creates is pinned to REGION=us-central1; a constrained org policy excluding that region blocks the very first apply
