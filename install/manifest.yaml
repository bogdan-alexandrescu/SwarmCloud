- id: org-policy.automatic-iam-grants-default-sa
  kind: org-policy
  scope: core
  stage: 0
  provider: org-admin
  check: gcloud resource-manager org-policies describe iam.automaticIamGrantsForDefaultServiceAccounts --project=$P
  apply: 'human step, ideally BEFORE first project API enablement: enforce this policy so the default compute service account (<project-number>-compute@developer.gserviceaccount.com) never receives roles/editor automatically'
  verify: gcloud projects get-iam-policy $P --flatten='bindings[].members' --filter='bindings.role:roles/editor' shows no <number>-compute@developer.gserviceaccount.com member
  explain: this repo's own deployer's serviceAccountUser grant on that default compute account (terraform/bootstrap/wif.tf) inherits every permission of whatever role the default account holds; today that is roles/editor, which carries logging.logEntries.list -- documented as an open, unclosed privilege-escalation route
  guards: 'docs/ci.md:2187 names it route #1 ''closed by a condition? no''; terraform/bootstrap/workspace_deployer.tf:658-664 calls it explicit ''RESIDUAL RISK, NOT TOUCHED HERE ... it is Google''s legacy default grant, the other team''s workloads may rely on it, and it is removed together with that team, never from this file'''
  secret_entry: null
  depends_on:
  - switch.project-create-right
  evidence:
  - docs/ci.md:2187
  - docs/ci.md:2198
  - terraform/bootstrap/workspace_deployer.tf:658-666
  notes: 'SURPRISE for a fresh install: the code''s own comment says this risk is ''never'' closed in THIS file because saga-agents-staging is shared and the default SA might be the other team''s dependency. On a fresh, single-tenant project that excuse does not apply -- nothing in terraform/bootstrap or terraform/infra removes roles/editor from the fresh project''s default compute SA, so either this org policy must be enforced at project creation or an operator must manually strip the grant; no script here does either'
  step: preflight.org-policies
- id: org-policy.cmek
