# Voice it's swarm-voice service (docs/design/voice-it.md section 10, phase one,
# the lane "swarm-voice creates a GPT-Live session from a browser's offer and
# holds its sideband"). These are the environment variables its caller check
# reads (google_caller_check in apps/swarm-voice/swarm_voice/main.py). Nothing
# deploys swarm-voice yet: the StatefulSet lane renders both into
# kubernetes/swarm-system/swarm-voice.yaml and edits these setters to that
# file's path:line in its own PR. PROJECT_ID, PORT and LOG_LEVEL, which main.py
# also reads, are already in the base manifest's env: table.
version: 1
env:
  SWARM_VOICE_AUDIENCE:
    setter: 'internal: read at apps/swarm-voice/swarm_voice/main.py:113; rendered by the swarm-voice StatefulSet, which a later Voice it lane adds; until then nothing deploys swarm-voice'
  SWARM_VOICE_CALLERS:
    setter: 'internal: read at apps/swarm-voice/swarm_voice/main.py:112; rendered by the swarm-voice StatefulSet, which a later Voice it lane adds; until then nothing deploys swarm-voice'
