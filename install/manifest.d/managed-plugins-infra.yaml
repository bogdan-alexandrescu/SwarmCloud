# Lane MANAGED-PLUGINS-INFRA (lane 3 of docs/design/managed-plugins.md section 17;
# part of #2688): terraform/infra/plugins.tf makes the managed plugins' bucket,
# its grants, the intake job's account, network and firewalls, and (once the
# release carries the swarm-plugin-intake image) the intake job. swarm install's
# infra passes apply it with no prompt and no step of its own (section 15);
# stage 14's verify.plugins and swarm doctor's plugins.infrastructure check that
# the bucket exists, the job is deployed and a tenant account may read platform/.
version: 1
entries:
- id: bucket.plugins
  kind: bucket
  scope: core
  stage: 7
  provider: engine
  check: gcloud storage buckets describe gs://$P-swarm-plugins
  apply: terraform/infra/plugins.tf google_storage_bucket.plugins
  verify: the bucket exists, uniform access, public access prevented (verify.plugins)
  explain: pinned plugin copies by digest under platform/ and tenants/<t>/, intake under quarantine/ and staging/ (section 3)
  guards: 'null'
  secret_entry: 'null'
  depends_on:
  - api.storage
evidence:
- terraform/infra/plugins.tf
notes: 'null'
step: infra.pass-1
refs:
  terraform:
  - infra/google_storage_bucket.plugins
- id: iam-binding.plugins-api-objects
  kind: iam-binding
  scope: core
  stage: 7
  provider: engine
  check: gcloud storage buckets get-iam-policy gs://$P-swarm-plugins --project=$P
  apply: terraform/infra/plugins.tf google_storage_bucket_iam_member.plugins_api_objects
  verify: swarm-api holds roles/storage.objectUser on the plugins bucket, the catalogues one writer
  explain: managed-plugins.md sections 2.2, 3 and 9.3
  guards: 'null'
  secret_entry: 'null'
  depends_on:
  - bucket.plugins
