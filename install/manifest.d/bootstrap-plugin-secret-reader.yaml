# Lane BOOTSTRAP-PLUGIN-SECRET-READER (part of #2688): terraform/bootstrap/
# plugin_secrets.tf grants swarm-api roles/secretmanager.secretAccessor on
# swarm-tenant-<t>-plg-* secrets, the read terraform/infra/plugins.tf cannot
# grant (design docs/design/managed-plugins.md section 6.2). Off by default:
# no swarm-api path reads a -plg- value until the plugin release is built, so
# swarm install leaves enable_plugin_secrets off and this lane's
# questions.json asks the owner when it goes on.
version: 1
entries:
- id: iam-binding.swarm-api-plugin-secrets-read
  kind: iam-binding
  scope: core
  stage: 7
  provider: engine
  check: gcloud projects get-iam-policy $P --flatten=bindings --filter='bindings.condition.title:"swarm plugin secrets read"'
  apply: terraform/bootstrap/plugin_secrets.tf google_project_iam_member.plugin_secret_reader, count=enable_plugin_secrets
  verify: 'roles/secretmanager.secretAccessor to swarm-api only, condition: projects/<n>/secrets/swarm-tenant-{t}-plg-*, via extract(), never matches()'
  explain: swarm-api releases a plugin's secret to an attempt whose signed plugin set names it (section 6.2); no tenant worker reads one
  guards: lint with iamPolicies:lintPolicy before applying; NOT VERIFIED LIVE per the file's own note
  secret_entry: null
  depends_on:
  - sa.swarm-api
  evidence:
  - terraform/bootstrap/plugin_secrets.tf
  notes: absent until enable_plugin_secrets is true, which nothing sets yet (the owner's decision, asked in this lane's questions.json)
  step: bootstrap.pass-2
  refs:
    terraform:
    - bootstrap/google_project_iam_member.plugin_secret_reader
ignored:
  variable:
  - match: bootstrap/enable_plugin_secrets
    reason: 'the owner''s switch, default false: nothing reads a -plg- value until the plugin release (managed-plugins.md section 17 lane 6) is built, so swarm install leaves it off'
