- id: iam-binding.swarm-api-spec-signer
  kind: iam-binding
  scope: core
  stage: 7
  provider: engine
  step: bootstrap.pass-2
  check: gcloud kms keys get-iam-policy step-spec --keyring=swarm-dev-specs --location=$R --project=$P
  apply: terraform/bootstrap/spec_signing.tf resource "google_kms_crypto_key_iam_member" "swarm_api_signer",
    role=roles/cloudkms.signer, member=swarm-api
  verify: policy shows roles/cloudkms.signer for serviceAccount:swarm-api@$P.iam.gserviceaccount.com and
    no one else, on the key only (not the ring, not the project)
  explain: The ONE identity that can sign (useToSign, never signerVerifier). swarm-api's account is this
    root's own since DAYONE-BOOT-2, and the grant depends on it, so a fresh project's first bootstrap
    apply makes both.
  guards: 'accepted residual (owner, 2026-09-29): a project Owner/Editor could still redeploy swarm-api
    to sign through this key -- this grant stops tenant agents, not a compromised platform owner'
  depends_on:
  - kms-key.step-spec-key
  - sa.swarm-api
  evidence:
  - terraform/bootstrap/spec_signing.tf
  - terraform/bootstrap/platform_service_accounts.tf
  refs:
    terraform:
    - bootstrap/google_kms_crypto_key_iam_member.swarm_api_signer
  replace: true
- id: iam-binding.verify-cluster-viewer
  kind: iam-binding
  scope: core
  stage: 7
  provider: engine
  step: bootstrap.pass-2
  check: gcloud projects get-iam-policy $P --flatten=bindings --filter='bindings.members:serviceAccount:swarm-verify@*
    AND bindings.role=roles/container.clusterViewer'
  apply: terraform/bootstrap/verify_cluster_read.tf resource "google_project_iam_member" "verify_views_swarm_cluster"
  verify: condition pins resource.name to exactly projects/$P/locations/$R/clusters/swarm-autopilot (and
    sub-paths); agents-staging (the other team's cluster) cannot match a bare startsWith either, since
    its name does not start with ours
  explain: Lets scripts/e2e-test.sh's check [10] ('no task holding capacity against a GKE execution that
    is gone') read the swarm cluster's endpoint/CA. clusterViewer, not container.viewer, so it carries
    no Kubernetes object read at all -- only what verify-rbac.yaml's Role binds inside the cluster.
  guards: '#1754, owner decision 2026-10-20; VERIFY-GKE-READ-2 (owner decision 2026-10-21): must live
    here, never in terraform/infra, because CI''s scoped projectIamAdmin would otherwise need clusterViewer
    on its grantable list and could then grant it to anyone, reaching agents-staging'
  evidence:
  - terraform/bootstrap/verify_cluster_read.tf:46-65
  notes: Target account swarm-verify is created by terraform/bootstrap (platform_service_accounts.tf,
    DAYONE-BOOT-2); the grant depends on it, so it needs no later apply.
  refs:
    terraform:
    - bootstrap/google_project_iam_member.verify_views_swarm_cluster
  depends_on:
  - sa.swarm-verify
  replace: true
- id: iam-binding.broker-secret-lister
  kind: iam-binding
  scope: core
  stage: 7
  provider: engine
  step: bootstrap.pass-2
  check: gcloud projects get-iam-policy $P --flatten=bindings --filter='bindings.members:serviceAccount:swarm-quota-broker@*
    AND bindings.role:swarmSecretLister'
  apply: terraform/bootstrap/platform_roles.tf resource "google_project_iam_member" "broker_secret_lister",
    for_each gated by switch.grant_broker_secret_lister
  verify: swarm-quota-broker is created by terraform/bootstrap (DAYONE-BOOT-2), so the grant names an
    account the same root makes
  explain: 'Project-wide secrets.list/create/getIamPolicy/setIamPolicy/versions.list/destroy(+add while
    the legacy switch is on), unconditioned by design -- bounded in CODE (quota_broker.secretstore.owned_by_this_platform
    regex) rather than IAM, an owner-accepted trade from #69.'
  guards: '#69, 2026-09-25; precondition requires every state in adopt_from_infra_states to show custom_roles_owner
    == terraform/bootstrap'
  depends_on:
  - sa.swarm-quota-broker
  - role.custom.swarmSecretLister
  - switch.grant_broker_secret_lister
  evidence:
  - terraform/bootstrap/platform_roles.tf:361-386
  refs:
    terraform:
    - bootstrap/google_project_iam_member.broker_secret_lister
  notes: The grant's member is still a string in platform_roles.tf (outside DAYONE-BOOT-2's files), so
    on a fresh project it is not ordered after the account; asked in the BOOT-2 PR. A failed first apply
    converges on the next.
  replace: true
- id: switch.grant_broker_secret_lister
  kind: switch
  scope: core
  stage: 3
  provider: engine
  step: bootstrap.pass-1
  check: grep -n grant_broker_secret_lister terraform/bootstrap/variables.tf terraform/bootstrap/terraform.tfvars
  apply: terraform/bootstrap/variables.tf:591-601, default TRUE; not set in terraform.tfvars
  verify: true everywhere, a fresh project included, since the account is bootstrap's own (DAYONE-BOOT-2)
  explain: Default true. Since DAYONE-BOOT-2 terraform/bootstrap creates swarm-quota-broker, so the switch
    no longer waits for terraform/infra; it is retired once platform_roles.tf orders the grant after the
    account (asked in the BOOT-2 PR).
  evidence:
  - terraform/bootstrap/variables.tf:591-601
  notes: 'The FIRST-APPLY TRAP this entry described is gone with DAYONE-BOOT-2: the account and the grant
    are in one root.'
  refs:
    variable:
    - bootstrap/grant_broker_secret_lister
  replace: true
- id: switch.swarm_workers_log_view_exists
  kind: switch
  scope: core
  stage: 7
  provider: engine
  step: bootstrap.pass-2
  check: grep -n swarm_workers_log_view_exists terraform/bootstrap/variables.tf terraform/bootstrap/terraform.tfvars
  apply: terraform/bootstrap/variables.tf:898-912, default TRUE; not overridden in terraform.tfvars
  verify: gcloud logging views describe swarm-workers --bucket=swarm-worker-logs --location=$R --project=$P
    exists before this is true
  explain: Gates log_view_read.tf's IAM row L-1 (swarm-api's read of the swarm-workers log view).
  guards: 'BGD, 2026-10-23, #1960, lane LOG-VIEW-BOOT; moved here from terraform/infra after a release
    failed with a 403 setting IAM on a view CI could not touch'
  evidence:
  - terraform/bootstrap/variables.tf:898-912
  notes: 'Stays a bootstrap pass 2 input (design §5.3, ''The log view''): the VIEW, not an account, is
    terraform/infra''s (log_view.tf). The engine sets it true only after infra pass 1; DAYONE-BOOT-2 moved
    the accounts, not the view.'
  refs:
    variable:
    - bootstrap/swarm_workers_log_view_exists
    - infra/swarm_workers_log_view_enabled
  replace: true
