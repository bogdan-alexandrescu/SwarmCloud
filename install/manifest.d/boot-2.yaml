# Lane DAYONE-BOOT-2 (part of #2688): every platform service account moves into
# terraform/bootstrap (terraform/bootstrap/platform_service_accounts.tf), for
# installs and for the live deployment, with zero destroys (design §5.3, plan
# §8, Q7). The eight existing sa.* entries are restated with the bootstrap
# resource and the infra data source that replaced the infra resource; the two
# accounts this lane adds (swarm-discovery, swarm-doctor) are new entries; the
# grants and switches the move changes are restated with the new facts.
version: 1
entries:
- id: sa.swarm-api
  kind: service-account
  scope: core
  stage: 3
  provider: engine
  step: bootstrap.pass-1
  check: gcloud iam service-accounts describe swarm-api@$P.iam.gserviceaccount.com
  apply: terraform/bootstrap/platform_service_accounts.tf:50 google_service_account.platform["swarm-api"],
    applied by terraform/bootstrap (DAYONE-BOOT-2, Q7); terraform/infra reads it as a data source (modules/iam).
    On the live deployment it is adopted by the import block gated on adopt_from_infra_states and forgotten
    by terraform/infra/removed.tf (destroy = false).
  verify: account exists with managed-by=swarm-terraform in its description
  explain: 'Created by terraform/infra applying modules/iam (in this agent''s territory because terraform/modules/iam
    is in scope), named/used throughout terraform/bootstrap by string (module.service_account_ids.platform),
    never by a cross-root reference. Nearly every bootstrap grant in this inventory targets it. ALSO:
    Authenticates callers, resolves tenants, writes tasks. Also runs swarm-ui (reused, since the UI is
    static files and calls nothing Google).'
  guards: '#334: bootstrap grants roles/iam.serviceAccountAdmin on this account to the deployer PER-ACCOUNT,
    never project-wide ALSO: no create_ignore_already_exists: a release that meets a 409 on this account
    fails rather than silently adopting someone else''s account (#334 security review)'
  depends_on:
  - api.iam
  evidence:
  - terraform/bootstrap/platform_service_accounts.tf:50
  - terraform/infra/removed.tf
  - terraform/modules/service_account_ids/main.tf
  notes: 'Created by terraform/bootstrap since DAYONE-BOOT-2, so every bootstrap grant on it is made in
    the same apply as the account; no "later" switch. Migration: zero destroys, the email and unique id
    do not change (plan §8).'
  refs:
    terraform:
    - bootstrap/google_service_account.platform
    - modules/iam/data.google_service_account.platform
  replace: true
