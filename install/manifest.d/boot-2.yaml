    On the live deployment it is adopted by the import block gated on adopt_from_infra_states and forgotten
    by terraform/infra/removed.tf (destroy = false).
  verify: account exists; holds swarmSecretLister only once grant_broker_secret_lister is applied from
    this root
  explain: 'Owns provider quota state; the target of platform_roles.tf''s broker_secret_lister grant.
    ALSO: Owns provider quota state (the account pool); control-plane data only.'
  guards: '#69'
  depends_on:
  - api.iam
  evidence:
  - terraform/bootstrap/platform_service_accounts.tf:50
  - terraform/infra/removed.tf
  - terraform/modules/service_account_ids/main.tf
  notes: 'Created by terraform/bootstrap since DAYONE-BOOT-2, so every bootstrap grant on it is made in
    the same apply as the account; no "later" switch. Migration: zero destroys, the email and unique id
    do not change (plan §8).'
  refs:
    terraform:
    - bootstrap/google_service_account.platform
    - modules/iam/data.google_service_account.platform
  replace: true
