# Lane VOICE-SPEECH-SERVER (part of #2688; docs/design/voice-it-own-speech.md
# section 14, lane L2, "The speech server streams words and speech"):
# apps/swarm-speech/, the server that runs on Voice it's own speech machine.
#
# Its two environment variables are set by the machine's launcher from the
# instance's metadata (swarm-speech-caller, swarm-speech-models), which
# terraform writes when it creates the stopped machine and swarm-api rewrites
# at each start (design §5.1, §11.4). PORT, which main.py also reads, is
# already in the base manifest's env: table.
#
# Its image: lane L3 ("The release builds and pins swarm-speech") added
# swarm-speech to scripts/build-images.sh's ALL_TARGETS, so the release builds
# it and the install copies it by digest (step images.copy), as swarm-voice's.
# It is neither a platform nor a gated image in terraform/infra/images.json:
# terraform deploys nothing from it; swarm-api writes its digest into the
# stopped machine's metadata at the next start (design §5.3).
version: 1
env:
  SWARM_SPEECH_CALLER:
    setter: apps/swarm-speech/vm/swarm-speech-launch.sh:77
  SWARM_SPEECH_MODELS:
    setter: apps/swarm-speech/vm/swarm-speech-launch.sh:78
entries:
- id: image.swarm-speech
  kind: image
  scope: core
  stage: 4
  provider: engine
  check: gcloud artifacts docker images list $R-docker.pkg.dev/$P/swarm-images/swarm-speech --limit=5
  apply: apps/swarm-speech/Dockerfile (beside its app as swarm-voice's; find_recipe() accepts either layout); not
    in terraform/infra/images.json, since terraform deploys nothing from it
  verify: the image's build-time self-test imported swarm_speech.main, its engines, qwen_asr and kokoro; the
    speech machine's launcher pulls exactly this digest from its swarm-speech-image metadata
  explain: Voice it's own speech server, run by the stopped speech machine's systemd unit at its next start.
  guards: null
  secret_entry: null
  depends_on:
  - registry.swarm
  evidence:
  - scripts/build-images.sh:185-192
  - apps/swarm-speech/Dockerfile:151
  - apps/swarm-speech/vm/swarm-speech-launch.sh:35-52
  notes: null
  step: images.copy
  refs:
    image:
    - swarm-speech
    - dockerfile:apps/swarm-speech/Dockerfile
