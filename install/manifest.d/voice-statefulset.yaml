# Lane VOICE-STATEFULSET (part of #2688; docs/design/voice-it.md section 10,
# phase one): swarm-voice runs as a one-replica StatefulSet in swarm-system
# with its own service account and an egress policy for OpenAI and Anthropic
# only. Its shape is swarm-live's entries in the base manifest: an image the
# release builds and the install copies by digest, its account (created by
# terraform/bootstrap, voice-account-bootstrap.yaml; infra only reads it),
# terraform's grants and reserved address, and a swarm-system workload
# applied from a rendered terraform output. Off until terraform/infra's `voice_it` is "on"
# (voice.tf says the three steps).
version: 1
entries:
- id: image.swarm-voice
  kind: image
  scope: core
  stage: 4
  provider: engine
  check: gcloud artifacts docker images list $R-docker.pkg.dev/$P/swarm-images/swarm-voice --limit=5
  apply: apps/swarm-voice/Dockerfile (beside its app as swarm-live's; find_recipe() accepts either layout); a gated
    image, terraform/infra/images.json, outputs=[swarm_voice_manifest]
  verify: the image's build-time self-test imported swarm_voice.main, credential and live; the swarm_voice_manifest
    output names this digest once voice_it is "on"
  explain: Voice it's GPT-Live session holder, which answers the browser's offer through OpenAI and holds each
    session's sideband.
  guards: null
  secret_entry: null
  depends_on:
  - registry.swarm
  evidence:
  - scripts/build-images.sh:179-185
  - apps/swarm-voice/Dockerfile:171
  - terraform/infra/images.json:33-36
  notes: null
  step: images.copy
  refs:
    image:
    - swarm-voice
    - dockerfile:apps/swarm-voice/Dockerfile
- id: iam-binding.swarm-voice-workload-identity
  kind: iam-binding
  scope: core
  stage: 5
  provider: engine
  check: gcloud iam service-accounts get-iam-policy swarm-voice@$P.iam.gserviceaccount.com --project=$P
  apply: terraform/infra/voice.tf:153 data.google_service_account.voice reads the account terraform/bootstrap
    creates (sa.swarm-voice, voice-account-bootstrap.yaml; voice_it "account" or "on"), and voice.tf:162
    google_service_account_iam_member.voice_workload_identity binds the KSA to it once "on"
  verify: the KSA swarm-system/swarm-voice, and no other, holds roles/iam.workloadIdentityUser on swarm-voice
  explain: lets swarm-voice's pod act as its own Google service account, which it needs to present a Google ID
    token to swarm-api (the metadata server mints one only for a KSA that impersonates a GSA).
  guards: the plan fails at data.google_service_account.voice until the owner's terraform/bootstrap apply has
    created swarm-voice and granted the CI deployer serviceAccountAdmin on it
  secret_entry: null
  depends_on:
  - sa.swarm-voice
  evidence:
  - terraform/infra/voice.tf:153-168
  notes: null
  step: infra.pass-1
  refs:
    terraform:
    - infra/data.google_service_account.voice
    - infra/google_service_account_iam_member.voice_workload_identity
- id: iam-binding.swarm-voice-invokes-broker
  kind: iam-binding
  scope: core
  stage: 5
  provider: engine
  check: gcloud run services get-iam-policy swarm-quota-broker --project=$P --region=$R
  apply: terraform/infra/voice.tf:173 google_cloud_run_v2_service_iam_member.voice_invokes_broker, once voice_it is
    "on"
  verify: swarm-quota-broker's policy lists serviceAccount:swarm-voice@$P.iam.gserviceaccount.com under roles/run.invoker
  explain: swarm-voice leases, renews and releases a Voice it pool account at the quota broker; which routes it may
    use is the broker's decision, by the caller's email in VOICE_SERVICE_ACCOUNTS.
  guards: null
  secret_entry: null
  depends_on:
  - sa.swarm-voice
  evidence:
  - terraform/infra/voice.tf:173-183
  notes: null
  step: infra.pass-1
  refs:
    terraform:
    - infra/google_cloud_run_v2_service_iam_member.voice_invokes_broker
- id: iam-binding.swarm-voice-invokes-api
  kind: iam-binding
  scope: core
  stage: 5
  provider: engine
  check: gcloud run services get-iam-policy swarm-api --project=$P --region=$R
  apply: terraform/infra/voice.tf:193 google_cloud_run_v2_service_iam_member.voice_invokes_api, once voice_it is "on"
  verify: swarm-api's policy lists serviceAccount:swarm-voice@$P.iam.gserviceaccount.com under roles/run.invoker
  explain: swarm-voice calls swarm-api, and only swarm-api, for every read and write (section 3.6).
  guards: null
  secret_entry: null
  depends_on:
  - sa.swarm-voice
  evidence:
  - terraform/infra/voice.tf:193-203
  notes: null
  step: infra.pass-1
  refs:
    terraform:
    - infra/google_cloud_run_v2_service_iam_member.voice_invokes_api
- id: workload.swarm-voice
  kind: namespace-object
  scope: core
  stage: 10
  provider: engine
  check: kubectl --context $E -n swarm-system get statefulset swarm-voice
  apply: terraform output -raw swarm_voice_manifest (kubernetes/swarm-system/swarm-voice.yaml:46(Namespace),58(SA),75+98(Service
    x2),120(StatefulSet) and kubernetes/network-policies/swarm-system-voice.yaml:52+76(NetworkPolicy x2),111(FQDNNetworkPolicy))
  verify: kubectl -n swarm-system get pods -l app.kubernetes.io/name=swarm-voice shows one Running pod; a Voice it
    session starts from the console
  explain: Voice it's swarm-voice workload, one replica, behind its internal load balancer (swarm-api's SWARM_VOICE_URL)
  guards: the FQDNNetworkPolicy needs FQDN network policy enabled on the cluster; without it swarm-voice reaches
    only DNS and the metadata server
  secret_entry: null
  depends_on:
  - cluster.swarm-system-namespace
  - sa.swarm-voice
  - image.swarm-voice
  evidence:
  - kubernetes/swarm-system/swarm-voice.yaml:120
  - kubernetes/network-policies/swarm-system-voice.yaml:111
  notes: null
  step: cluster.workloads
  refs:
    kubernetes:
    - swarm-system/swarm-voice.yaml
    terraform:
    - infra/google_compute_address.voice
env:
  VOICE_SERVICE_ACCOUNTS:
    setter: 'internal: read at apps/quota-broker/quota_broker/main.py:2837; unset on purpose, so the broker answers
      its /v1/voice/ lease routes for swarm-voice@<PROJECT_ID>.iam.gserviceaccount.com alone, the account
      terraform/bootstrap creates'
