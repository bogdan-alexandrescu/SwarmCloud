# Lane DAYONE-ENGINE-INPUTS (part of #2688): a closing infra pass after the
# cluster stages removes the installer's address from the control plane's
# authorised networks (decision 2). The entry is new; this lane restates no
# base entry. Stage 8's re-apply of infra pass 2 (infra.pass-identity) declares
# no entry: every stage 8 entry belongs to an identity step
# (test_identity_step.py), and the re-apply follows them by registration order.
version: 1
entries:
- id: other.engine-cluster-reach-closed
  kind: other
  scope: core
  stage: 12
  provider: engine
  step: infra.pass-close
  check: the infra inputs last applied carry no gke_master_authorized_cidrs entry named swarm-install (infra-close,
    infra-3 or infra-4 is the latest infra pass applied, with its current inputs)
  apply: 'swarm_install/steps/infra.py ClosingPassStep: terraform apply infra with the same inputs less the
    installer''s /32, as swarm-tf-deployer'
  verify: test_infra_steps.py in tests/unit/install
  explain: Decision 2. The install reaches the cluster's control plane from the installer's public address
    during stages 10 and 11 only; once they are done the address is removed, and a run that stopped before
    stage 12 has the leftover removed by the next one.
  depends_on:
  - cluster.swarm-system-namespace
  evidence:
  - apps/swarm-install/swarm_install/steps/infra.py
  - apps/swarm-install/swarm_install/tfvars.py
