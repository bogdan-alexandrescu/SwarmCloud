# swarm-speech: Voice it's own speech server (docs/design/voice-it-own-speech.md
# §3.3, §5.2, §12). One container on the stopped g2-standard-4 (one NVIDIA L4)
# that swarm-api starts for a session: Qwen3-ASR-0.6B's streaming path through
# vLLM turns the browser's speech into words, Kokoro-82M speaks the replies,
# both over one WebSocket per swarm-api socket, /v1/stream.
#
# No swarm-common: the server reads and writes nothing of the platform's (no
# Firestore, no tenant, no lease); swarm-api holds all of that and talks to it
# over the socket. Its caller check verifies swarm-api's Google ID token with
# google-auth.
#
# Linux x86_64 and Python 3.11 only: the image is the one place it runs, and
# vLLM ships wheels for nothing else, so the lock resolves for that platform.
[project]
name = "swarm-speech"
version = "0.1.0"
description = "Voice it's own speech server: streaming speech-to-text and text-to-speech on one L4."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "google-auth[requests]>=2.30",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    # Exact pins: the streaming API (init_streaming_state, streaming_transcribe,
    # finish_streaming_transcribe) and KPipeline's signature are read from these
    # versions' source (engines.py); a newer release is a deliberate bump.
    "qwen-asr[vllm]==0.0.6",
    "kokoro==0.9.4",
    # Kokoro's English phonemiser (misaki) loads this spaCy model, and when it
    # is missing runs `spacy.cli.download` at the first synthesis: a pip install
    # at run time, into a venv the server's uid cannot write. It is locked here
    # by URL and hash, so the image carries it (source below).
    "en-core-web-sm",
    # NVML's GPU readings for the 5 s metrics frame (telemetry.py).
    "nvidia-ml-py>=12.535",
]

[project.scripts]
swarm-speech = "swarm_speech.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_speech"]

[tool.uv.sources]
# spaCy's models are published only as GitHub release assets; 3.8.0 is the
# release for spaCy 3.8, the version kokoro's misaki resolves to in uv.lock.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
