# The bridge that makes SwarmCloud usable from a laptop the way a local
# subagent is. It runs on the OPERATOR's machine, never in Cloud Run, which is
# why it carries no THIRD-PARTY dependency: urllib for the API, subprocess for
# `gcloud` and `git`. Adding an SDK here would mean an operator has to install
# something before they can look at their own platform.
#
# The one dependency is `swarm-common`, this repository's frozen contract, and
# it is here so that nothing in this package restates it. The part that is
# used (`swarm_common.states`) is enum-only: no client, no credentials, no
# network, so the offline tests stay offline.
[project]
name = "swarm-mcp"
version = "0.1.0"
description = "Local bridge: drive SwarmCloud from Claude Code the way you drive a local agent."
requires-python = ">=3.11"
dependencies = ["swarm-common"]

[project.scripts]
swarm = "swarm_mcp.cli:main"
swarm-mcp = "swarm_mcp.server:main"
# `sc` is read-only and deliberately short: a status command that has to be
# looked up is one nobody runs at the moment it would have helped.
sc = "swarm_mcp.sc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# WHERE swarm-common COMES FROM, which is why this table exists. The `sc`
# plugin starts this bridge with
#
#   uv tool run --from 'swarm-mcp @ git+https://github.com/<repo>@sc-v<version>#subdirectory=apps/swarm-mcp' swarm-mcp
#
# because a marketplace install copies only plugin/ -- there is no checkout to
# `uv run` in. Installed that way, the root pyproject's sources do not apply,
# and a bare `swarm-common` is a PyPI lookup: the name is unclaimed there
# (404 on 2026-09-24), so today the install fails, and the day somebody
# registers it every operator's bridge installs their code.
#
# A RELATIVE path is what uv rewrites, inside a Git dependency, into a Git
# source at the SAME commit with the subdirectory taken relative to the
# checkout -- `apps/common` at whatever tag the plugin pinned. That is
# astral-sh/uv#9594, shipped in uv 0.5.6 (`path_source` in
# crates/uv-distribution/src/metadata/lowering.rs). uv's DOCUMENTATION does not
# describe this case -- only its 0.5.6 release notes and its source do -- which
# is why CI's install step checks it on every run rather than trusting it. So
# there is no second ref to drift from the plugin's. In this checkout the entry is an ordinary
# editable path, identical to the root pyproject's, so the development
# workspace resolves exactly as before.
#
# uv only: pip does not read [tool.uv.sources], and installing this package
# with pip is not supported. tests/unit/mcp/test_plugin_bridge_install.py
# holds all of the above.
[tool.uv.sources]
swarm-common = { path = "../common", editable = true }

[tool.uv]
# What `SWARM_MCP_FROM=<checkout>/apps/swarm-mcp` needs to mean "my working
# copy". uv rebuilds a local directory only when a cache key changes, and the
# default keys are pyproject.toml and setup.py/setup.cfg -- so without the
# second entry an edited bridge keeps serving the build from before the edit,
# which is the one thing a developer's escape hatch must not do. The price is
# that the editable install in this workspace is rebuilt after a source edit,
# at the next `uv run` -- one hatchling build of this small package, not timed.
#
# That is half of it. The install is NOT editable, so the running code sits in
# uv's cache and nothing above it is the checkout; finding that checkout's
# tfvars -- the front door -- is `swarm_mcp.client._repo_root`, which reads the
# install's PEP 610 record of where it was built from.
cache-keys = [{ file = "pyproject.toml" }, { file = "swarm_mcp/**/*.py" }]
