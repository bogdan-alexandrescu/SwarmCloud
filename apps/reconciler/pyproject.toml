# Track C reconciler: a Cloud Run service on a Cloud Scheduler trigger that
# compares control-plane state to real backend state and repairs the difference.
[project]
name = "swarm-reconciler"
version = "0.1.0"
description = "Reconciles control-plane state against Cloud Run Jobs and GKE reality."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "google-cloud-firestore>=2.16",
    "google-cloud-run>=0.10",
    "google-cloud-storage>=2.18",
    "kubernetes>=30",
]

[project.scripts]
reconciler = "reconciler.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reconciler"]

[tool.uv.sources]
swarm-common = { path = "../common", editable = true }
