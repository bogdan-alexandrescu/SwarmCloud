[project]
name = "swarm-api"
version = "0.1.0"
description = "Tenant-scoped control-plane API for the agent swarm."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "google-cloud-firestore>=2.16",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-pubsub>=2.21",
    "google-auth>=2.30",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
swarm-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_api"]
