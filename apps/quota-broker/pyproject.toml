[project]
name = "swarm-quota-broker"
version = "0.1.0"
description = "Per (provider, tenant) quota state with AIMD adaptive concurrency."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "google-cloud-firestore>=2.16",
    "google-auth>=2.30",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
swarm-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quota_broker"]
