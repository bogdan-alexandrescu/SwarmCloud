# swarm-install: the Day One installer's home (docs/design/day-one-install.md
# §2.1, owner answer Q5; lane DAYONE-MANIFEST-1, part of #2688). This lane adds
# the manifest's typed model and loader (`swarm_install.manifest`); the engine,
# its steps and verbs (`swarm_install.steps`, `swarm_install.verbs`, discovered
# by package scan) come in later lanes.
#
# Every dependency the package will need is declared HERE, once, so no later
# Day One lane touches this file, the root pyproject.toml or uv.lock
# (docs/design/day-one-plan.md §1 conventions). The Google client libraries are
# imported lazily by the engine: nothing builds a client at import time, and the
# manifest tests run with no credentials and no emulator.
[project]
name = "swarm-install"
version = "0.1.0"
description = "Day One installer: the dependency manifest, its model and the install engine."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    "swarm-redaction",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "google-auth>=2.30",
    "google-cloud-firestore>=2.16",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-storage>=2.18",
    "google-cloud-kms>=2.21",
    "google-cloud-monitoring>=2.21",
    "google-cloud-run>=0.10",
    "requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_install"]

[tool.uv.sources]
swarm-common = { path = "../common", editable = true }
swarm-redaction = { path = "../redaction", editable = true }
