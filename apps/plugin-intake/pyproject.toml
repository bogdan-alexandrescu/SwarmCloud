# swarm-plugin-intake: the isolated job that checks one quarantined plugin
# archive and pins it (docs/design/managed-plugins.md §2.3, lane 4 of §17).
#
# The standard library only, on purpose: the job parses untrusted archives, so
# it carries no third-party code an archive could reach. Not a member of the
# root uv project (no service imports it); the Dockerfile copies the package,
# and its tests put the package on sys.path themselves (tests/conftest.py):
#
#     uv run pytest apps/plugin-intake/tests -q
[project]
name = "swarm-plugin-intake"
version = "0.1.0"
description = "The plugin intake job: unpack, check, normalise, digest and report on one quarantined archive."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
swarm-plugin-intake = "plugin_intake.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plugin_intake"]
