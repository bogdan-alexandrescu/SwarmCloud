# Packaging metadata only. The swarm_common package itself is FROZEN by CONTRACT.md;
# this file adds no code and changes no types -- it exists so the three Track A
# services can depend on `swarm-common` as a local path package.
[project]
name = "swarm-common"
version = "0.1.0"
description = "Frozen domain contract shared by every swarm service."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_common"]
