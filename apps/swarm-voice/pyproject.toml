# swarm-voice: GPT-Live sessions for Voice it (docs/design/voice-it.md §3.4,
# section 10 phase one). A single-replica StatefulSet in swarm-system on GKE that
# answers the browser's WebRTC offer and holds each session's sideband.
#
# No Firestore or storage client: every read and write of Voice it's data goes
# through swarm-api (§3.6). Secret Manager is read over REST with google-auth
# (credential.py, SecretManagerStore); OpenAI over httpx and websockets.
[project]
name = "swarm-voice"
version = "0.1.0"
description = "Voice it's GPT-Live session holder: offer, answer, sideband, end."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "google-auth[requests]>=2.30",
]

[project.scripts]
swarm-voice = "swarm_voice.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_voice"]

[tool.uv.sources]
swarm-common = { path = "../common", editable = true }
