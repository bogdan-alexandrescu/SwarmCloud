[project]
name = "swarm-scheduler"
version = "0.1.0"
description = "Admission controller: bounded drain loop woken by Pub/Sub."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    # The account pool's own model and its one statement of who an account
    # serves (`quota_broker.accounts.accounts_serving`). Admission asks it
    # whether a tenant with no key may run on the pool (scheduler/credentials.py,
    # #169). Imported rather than restated: the broker's documents are read
    # with the broker's parser, and the rule is the broker's function. Only
    # `accounts` and `accountstore` are imported, and both are pure Python
    # over the Firestore client the scheduler already has.
    "swarm-quota-broker",
    # The workflow state derivation and its in-transaction write
    # (`swarm_rollup.derived_state_write`, #2838): admission, a woken park and
    # the `fail_workflow` cancels change a step's state, so they write the
    # workflow's derived state in the same transaction, by the same rule the
    # API and the reconciler use. Pure Python over the Firestore client.
    "swarm-workflow-rollup",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "google-cloud-firestore>=2.16",
    "google-cloud-run>=0.10",
    "google-auth>=2.30",
    "kubernetes>=30.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
swarm-common = { path = "../common", editable = true }
swarm-quota-broker = { path = "../quota-broker", editable = true }
swarm-workflow-rollup = { path = "../workflow-rollup", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scheduler"]
