[project]
name = "swarm-scheduler"
version = "0.1.0"
description = "Admission controller: bounded drain loop woken by Pub/Sub."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "google-cloud-firestore>=2.16",
    "google-cloud-run>=0.10",
    "google-auth>=2.30",
    "kubernetes>=30.1",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
swarm-common = { path = "../common", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scheduler"]
