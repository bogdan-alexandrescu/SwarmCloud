# The Jev client, shared by the agent worker (J0-J5, `jev_decide`, the
# end-of-step judgment) and swarm-api (the work contract's submission review):
# the wire shape, `validate_questions`, `JudgeClient` and the outbound
# `sanitize`. The owner's answer 10, 3 November 2026
# (docs/design/agent-quality/jev-contract.md section 13, lane 1): a new shared
# package, as swarm-redaction is. NOT part of the frozen contract in
# apps/common: a change here is an ordinary reviewed change.
#
# A plain package like apps/redaction: a static [project] table and a build
# backend. Standard library plus swarm-redaction (the credential rules every
# string is scanned with), and nothing of the worker or of swarm-api, so either
# can install it without the other.
[project]
name = "swarm-jev"
version = "0.1.0"
description = "The Jev client shared by swarm-api and the agent worker."
requires-python = ">=3.11"
dependencies = ["swarm-redaction"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swarm_jev"]

[tool.uv.sources]
swarm-redaction = { path = "../redaction", editable = true }
