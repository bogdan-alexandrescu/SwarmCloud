[project]
name = "agent-swarm-infra"
version = "0.1.0"
description = "Track A control plane: swarm-api, scheduler, quota-broker."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    "swarm-redaction",
    "swarm-jev",
    "swarm-workflow-rollup",
    "swarm-api",
    "swarm-scheduler",
    "swarm-quota-broker",
    "swarm-agent-worker",
    "swarm-reconciler",
    "swarm-mcp",
]

[tool.uv]
package = false
# The uv the agent images run (images/*/Dockerfile, ARG UV_IMAGE) and every
# astral-sh/setup-uv step in .github/ installs; a different uv refuses to run
# here rather than resolve or sync differently from CI.
# tests/unit/scripts/test_ci_tool_versions.py holds the three equal.
required-version = "==0.12.15"
# RELEASE-AGE QUARANTINE (audit "Add a 14-day release-age quarantine for uv
# and npm", part of #60): a resolution (`uv lock`, `uv lock --upgrade`, `uv add`)
# only takes distributions uploaded at least 14 days ago, so a hijacked release
# that is yanked within days never reaches uv.lock. A ROLLING window: uv takes
# a duration here and resolves it against the clock on every run, recording
# only the span in uv.lock ([options] exclude-newer-span = "P14D"; the
# exclude-newer "0001-01-01" beside it is uv's placeholder and does nothing).
# Nothing to move by hand. Installs are unaffected: CI and the images install
# with `uv sync --frozen` from uv.lock, and `uv lock --check` passes while the
# lock records the same span. To take a fix younger than the window, use
# `exclude-newer-package` for that one package, never a shorter window.
# tests/unit/scripts/test_release_age_quarantine.py holds this and the lock's
# span equal, and apps/swarm-ui/.npmrc's npm counterpart.
exclude-newer = "14 days"

[tool.uv.sources]
swarm-common = { path = "apps/common", editable = true }
swarm-redaction = { path = "apps/redaction", editable = true }
swarm-jev = { path = "apps/jev-client", editable = true }
swarm-workflow-rollup = { path = "apps/workflow-rollup", editable = true }
swarm-api = { path = "apps/swarm-api", editable = true }
swarm-scheduler = { path = "apps/scheduler", editable = true }
swarm-quota-broker = { path = "apps/quota-broker", editable = true }
swarm-agent-worker = { path = "apps/agent-worker", editable = true }
swarm-reconciler = { path = "apps/reconciler", editable = true }
# Local-only: the operator-side bridge. It is in the workspace so its tests
# run in `make test` like everything else, NOT because anything deploys it.
swarm-mcp = { path = "apps/swarm-mcp", editable = true }
# The Day One installer (docs/design/day-one-install.md §2.1).
swarm-install = { path = "apps/swarm-install", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Measured 2026-09-23: tests/integration drives the real shell scripts
    # against a fake `curl` that is a Python process, so ~600 requests per
    # suite run cost ~42ms each in interpreter startup alone -- ~31s per run,
    # ~480s for the file, which was 60% of `make test`. The cases are
    # independent and each works in its own tmp_path, so they parallelise
    # cleanly: 566s -> 66s on eight cores.
    "pytest-xdist>=3.6",
    # The house linter (pyproject [tool.ruff]). Exact pin, held equal to
    # required-version by tests/unit/scripts/test_ruff_config.py.
    "ruff==0.17.0",
    "httpx>=0.27",
    # A test-only oracle for swarm_common.specsign's RFC 8785 encoding
    # (tests/unit/common/test_specsign.py). Never a runtime dependency:
    # swarm_common declares none (contract request 34, decision 3).
    "rfc8785>=0.1.4",
    # The repository-index extractor's parser and grammars
    # (images/agent-runtime-indexer/repo-index/), so its tests in
    # tests/unit/worker/ run here offline. Exact pins, and the SAME pins as
    # images/agent-runtime-indexer/repo-index/requirements.txt, which a test
    # holds equal: the image and the tests must parse with one grammar build.
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-hcl==1.2.0",
    # The Day One installer (apps/swarm-install). In the dev group, not the
    # root's dependencies: an operator-side tool no service image ships; each
    # service Dockerfile's export prunes it (test_service_image_install.py).
    "swarm-install",
    # The coverage ratchet (issue 64, docs/ci.md "Coverage floors"). Pinned:
    # 7.1.0 was uploaded 2026-03-21, well outside the 14-day release-age
    # window above; its `coverage` (7.17.2 in uv.lock) is the newest the
    # window allowed on 2026-11-23.
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
markers = [
    "serial: measures elapsed time or process liveness; must not run under -n",
    # Applied at collection from tests/flaky.txt (tests/unit/conftest.py), never
    # written on a test by hand: the list is the one place a quarantine lives.
    "flaky: quarantined in tests/flaky.txt; CI runs it in a step that never fails the gate",
]
testpaths = ["tests/unit"]
# No -q here (observer P32, owner decision 2026-10-06): callers add their own, and
# -q twice hides the "N passed, M failed" line, so agents re-ran suites to read a count.
addopts = ""
filterwarnings = ["ignore::DeprecationWarning"]

# ruff is the house LINTER (owner decision 2026-10-14, "Adopt ruff"). Lint only:
# `ruff format` is NOT adopted -- a repository-wide reformat would conflict with
# every open lane -- so formatting excludes every file below. `force-exclude`
# makes that hold when a caller names files explicitly, as the pre-publish gate
# does (`ruff format --check <files>`, apps/agent-worker/agent_worker/prepublish.py):
# without it the gate would fail every changed .py file on formatting nobody adopted.
# THE COVERAGE RATCHET (issue 64; docs/ci.md "Coverage floors"). Read by
# pytest-cov in the nightly coverage run's unit shards (`--cov`,
# .github/workflows/coverage.yml; never on the merge path) and by
# scripts/coverage-floors.sh, which combines the shards' data
# files and groups the lines per `apps/<dir>` against coverage-floors.json.
[tool.coverage.run]
# Every Python package under apps/, by its import directory: a directory
# source also reports the files no test imported (at 0 %), which a module
# name would only do once something imported it.
source = [
    "apps/agent-worker/agent_worker",
    "apps/common/swarm_common",
    "apps/jev-client/swarm_jev",
    "apps/plugin-intake/plugin_intake",
    "apps/quota-broker/quota_broker",
    "apps/reconciler/reconciler",
    "apps/redaction/swarm_redaction",
    "apps/scheduler/scheduler",
    "apps/swarm-api/swarm_api",
    "apps/swarm-egress/swarm_egress",
    "apps/swarm-github-hooks/swarm_github_hooks",
    "apps/swarm-graph/swarm_graph",
    "apps/swarm-install/swarm_install",
    "apps/swarm-live/swarm_live",
    "apps/swarm-mcp/swarm_mcp",
    "apps/swarm-speech/swarm_speech",
    "apps/swarm-typesafe-fwd/swarm_typesafe_fwd",
    "apps/swarm-voice/swarm_voice",
    "apps/workflow-rollup/swarm_rollup",
]
omit = ["*/tests/*"]
# Paths stored relative to the checkout, so shards that ran in different
# runner work directories combine into one file per source path.
relative_files = true

[tool.ruff]
# Exact pin in [dependency-groups] dev; tests/unit/scripts/test_ruff_config.py
# holds the two equal.
required-version = "==0.17.0"
target-version = "py311"
# 99.2% of lines already fit in 100 (measured 2026-10-14); only formatting and
# isort read it, and neither is selected, but a later adoption starts here.
line-length = 100
force-exclude = true
extend-exclude = ["apps/swarm-ui", "tests/acceptance/fixtures"]

[tool.ruff.lint]
# The conservative set: pyflakes plus the pycodestyle errors that are always bugs.
# Selected explicitly, because ruff's own default set has grown past this. isort
# (I) is NOT selected: it would rewrite 735 files' imports.
select = ["E4", "E7", "E9", "F", "BLE001", "S110", "S112"]
# BLE001 (a blind `except Exception`/`BaseException`), S110 (`except: pass`) and
# S112 (`except: continue`) catch a NEW silent broad except (issue 54). Every
# site that existed then carries its own inline noqa marker (issue 185: a
# per-file ignore let a new broad except through in 146 files); the number of
# marked sites is held by tests/unit/scripts/test_ruff_config.py and may only
# go down. RUF100 is NOT selected: repository-wide it reported 920 findings in
# 309 files, mostly markers for rules never selected here and F811 markers in
# tests/, one in the frozen swarm_common; the test runs it scoped to these three.
# E741 (a variable named `l`) is style, not a defect: 47 hits in 22 files.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# FROZEN (CLAUDE.md rule 1): its three unused imports stay until a contract change.
"apps/common/swarm_common/**" = ["F401"]
# A pytest fixture imported from a helper module and then named as a parameter is
# the house pattern (1,548 hits), not a redefinition.
"tests/**" = ["F811"]

[tool.ruff.format]
exclude = ["*"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["apps"]
exclude = ["apps/swarm-ui", "**/node_modules", "**/__pycache__", "**/.*"]
# A `# type: ignore` that suppresses nothing is an error (issue 55): a dead
# ignore hides the next real error on its line. The dead ones were pruned when
# this was turned on; any that remain (the frozen apps/common/swarm_common/)
# are in scripts/lib/pyright-baseline.json like every other error.
reportUnnecessaryTypeIgnoreComment = "error"
