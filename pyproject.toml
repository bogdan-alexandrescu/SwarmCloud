[project]
name = "agent-swarm-infra"
version = "0.1.0"
description = "Track A control plane: swarm-api, scheduler, quota-broker."
requires-python = ">=3.11"
dependencies = [
    "swarm-common",
    "swarm-redaction",
    "swarm-workflow-rollup",
    "swarm-api",
    "swarm-scheduler",
    "swarm-quota-broker",
    "swarm-agent-worker",
    "swarm-reconciler",
    "swarm-mcp",
]

[tool.uv]
package = false

[tool.uv.sources]
swarm-common = { path = "apps/common", editable = true }
swarm-redaction = { path = "apps/redaction", editable = true }
swarm-workflow-rollup = { path = "apps/workflow-rollup", editable = true }
swarm-api = { path = "apps/swarm-api", editable = true }
swarm-scheduler = { path = "apps/scheduler", editable = true }
swarm-quota-broker = { path = "apps/quota-broker", editable = true }
swarm-agent-worker = { path = "apps/agent-worker", editable = true }
swarm-reconciler = { path = "apps/reconciler", editable = true }
# Local-only: the operator-side bridge. It is in the workspace so its tests
# run in `make test` like everything else, NOT because anything deploys it.
swarm-mcp = { path = "apps/swarm-mcp", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    # Measured 2026-09-23: tests/integration drives the real shell scripts
    # against a fake `curl` that is a Python process, so ~600 requests per
    # suite run cost ~42ms each in interpreter startup alone -- ~31s per run,
    # ~480s for the file, which was 60% of `make test`. The cases are
    # independent and each works in its own tmp_path, so they parallelise
    # cleanly: 566s -> 66s on eight cores.
    "pytest-xdist>=3.6",
    # The house linter (pyproject [tool.ruff]). Exact pin, held equal to
    # required-version by tests/unit/scripts/test_ruff_config.py.
    "ruff==0.17.0",
    "httpx>=0.27",
    # A test-only oracle for swarm_common.specsign's RFC 8785 encoding
    # (tests/unit/common/test_specsign.py). Never a runtime dependency:
    # swarm_common declares none (contract request 34, decision 3).
    "rfc8785>=0.1.4",
    # The repository-index extractor's parser and grammars
    # (images/agent-runtime-indexer/repo-index/), so its tests in
    # tests/unit/worker/ run here offline. Exact pins, and the SAME pins as
    # images/agent-runtime-indexer/repo-index/requirements.txt, which a test
    # holds equal: the image and the tests must parse with one grammar build.
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-hcl==1.2.0",
]

[tool.pytest.ini_options]
markers = [
    "serial: measures elapsed time or process liveness; must not run under -n",
    # Applied at collection from tests/flaky.txt (tests/unit/conftest.py), never
    # written on a test by hand: the list is the one place a quarantine lives.
    "flaky: quarantined in tests/flaky.txt; CI runs it in a step that never fails the gate",
]
testpaths = ["tests/unit"]
# No -q here (observer P32, owner decision 2026-10-06): callers add their own, and
# -q twice hides the "N passed, M failed" line, so agents re-ran suites to read a count.
addopts = ""
filterwarnings = ["ignore::DeprecationWarning"]

# ruff is the house LINTER (owner decision 2026-10-14, "Adopt ruff"). Lint only:
# `ruff format` is NOT adopted -- a repository-wide reformat would conflict with
# every open lane -- so formatting excludes every file below. `force-exclude`
# makes that hold when a caller names files explicitly, as the pre-publish gate
# does (`ruff format --check <files>`, apps/agent-worker/agent_worker/prepublish.py):
# without it the gate would fail every changed .py file on formatting nobody adopted.
[tool.ruff]
# Exact pin in [dependency-groups] dev; tests/unit/scripts/test_ruff_config.py
# holds the two equal.
required-version = "==0.17.0"
target-version = "py311"
# 99.2% of lines already fit in 100 (measured 2026-10-14); only formatting and
# isort read it, and neither is selected, but a later adoption starts here.
line-length = 100
force-exclude = true
extend-exclude = ["apps/swarm-ui", "tests/acceptance/fixtures"]

[tool.ruff.lint]
# The conservative set: pyflakes plus the pycodestyle errors that are always bugs.
# Selected explicitly, because ruff's own default set has grown past this. isort
# (I) is NOT selected: it would rewrite 735 files' imports.
select = ["E4", "E7", "E9", "F"]
# E741 (a variable named `l`) is style, not a defect: 47 hits in 22 files.
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# FROZEN (CLAUDE.md rule 1): its three unused imports stay until a contract change.
"apps/common/swarm_common/**" = ["F401"]
# A pytest fixture imported from a helper module and then named as a parameter is
# the house pattern (1,548 hits), not a redefinition.
"tests/**" = ["F811"]

[tool.ruff.format]
exclude = ["*"]
