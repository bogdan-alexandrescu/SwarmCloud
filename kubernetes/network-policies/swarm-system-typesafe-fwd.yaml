# The TypeSafe forwarder's egress: DNS, the metadata server, and by name
# api.typesafe.ai and Secret Manager -- nothing else (the TypeSafe egress
# allowlist, docs/runbooks/typesafe-egress.md; part of #2688).
#
# WHY. swarm-typesafe-fwd holds TypeSafe keys: it reads a workspace's key from
# Secret Manager and puts it in the authorization header of the one upstream
# it serves (kubernetes/swarm-system/swarm-typesafe-fwd.yaml). Until this file,
# nothing put swarm-system under egress isolation (swarm-system-live.yaml says
# why for the relay), so the process that holds the keys could open a socket
# to any address. Here it can reach only the hosts its code dials:
#
#   * api.typesafe.ai               swarm_typesafe_fwd/upstream.py UPSTREAM_HOST;
#   * secretmanager.googleapis.com  swarm_typesafe_fwd/main.py SECRET_MANAGER,
#                                   the key versions a ticket names.
#
# tests/unit/scripts/test_typesafe_egress_allowlist.py reads both constants
# from the forwarder's source and holds this list equal to them, and holds
# this the only swarm-system workload with an allow for api.typesafe.ai.
#
# TWO OBJECTS, as swarm-voice's (swarm-system-voice.yaml), because a
# NetworkPolicy names addresses and api.typesafe.ai answers from shared
# Cloudflare addresses (104.18.24.46 and 104.18.25.46, read with getent on
# 2026-11-02) that no one may pin:
#
#   1. `swarm-typesafe-fwd-egress`, a NetworkPolicy, puts the forwarder's pods
#      under egress isolation and admits what has a fixed address: cluster DNS
#      and the GKE metadata server (the Workload Identity token it reads
#      Secret Manager with).
#   2. `swarm-typesafe-fwd-egress-hosts`, a GKE FQDNNetworkPolicy, admits TCP
#      443 to the two hosts by name.
#
# FAILS CLOSED. On a cluster without FQDN network policy
# (`gke_enable_fqdn_network_policy`, on in dev since 2026-11-01) the apply of
# (2) is refused and the forwarder reaches DNS and the metadata server only:
# every forwarded Jev call then fails at the forwarder's upstream, and no key
# leaves the pod. Apply (1) and (2)
# together or not at all; the runbook says how.
#
# A STATIC FILE: no placeholder, because nothing in it belongs to one cluster.
# The NodeLocal DNSCache address is GKE's fixed 169.254.20.10 (allow-egress.yaml
# rule 1b, measured 2026-09-24); the kube-dns Service IP is not named, so a
# cluster that serves DNS only there reaches it through rule (a)'s pods.
# Apply it to swarm-autopilot only: `agents-staging` in the same project is
# another team's cluster (CLAUDE.md rule 2).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: swarm-typesafe-fwd-egress
  namespace: swarm-system
  labels:
    managed-by: swarm-terraform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: swarm-typesafe-fwd
  policyTypes:
    - Egress
  egress:
    # (a) Cluster DNS by pod selector, as allow-egress.yaml rule 1.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # (b) Cluster DNS as swarm-autopilot serves it: the NodeLocal DNSCache
    #     address, a pod's nameserver there. Port 53 and nothing else on it.
    #     allow-egress.yaml rule 1b records the open question about an
    #     ipBlock to a hostNetwork pod on Dataplane V2; the runbook's probe
    #     checks this pod resolves api.typesafe.ai before anything relies on it.
    - to:
        - ipBlock:
            cidr: 169.254.20.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # (c) The GKE metadata server, on the ports GKE gives for Dataplane V2
    #     (allow-egress.yaml rule 2): the Workload Identity access token.
    - to:
        - ipBlock:
            cidr: 169.254.169.254/32
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
---
apiVersion: networking.gke.io/v1alpha1
kind: FQDNNetworkPolicy
metadata:
  name: swarm-typesafe-fwd-egress-hosts
  namespace: swarm-system
  labels:
    managed-by: swarm-terraform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: swarm-typesafe-fwd
  egress:
    - matches:
        - name: api.typesafe.ai
        - name: secretmanager.googleapis.com
      ports:
        - protocol: TCP
          port: 443
