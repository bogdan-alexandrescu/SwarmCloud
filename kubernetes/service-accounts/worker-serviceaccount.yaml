# The tenant's Kubernetes identity on the GKE path.
#
# Two service accounts are created, and that is a workaround rather than a
# design: `scripts/register-tenant.sh` creates and workload-identity-binds
# `swarm-worker`, while the GKE manifest in
# `apps/scheduler/scheduler/dispatch.py` asks for `serviceAccountName:
# swarm-<tenant>`. A pod naming a service account that does not exist stays
# Pending until its activeDeadlineSeconds expires, so both names exist here and
# both carry the same Workload Identity annotation. The duplicate costs nothing
# and removes a failure that would otherwise look like a scheduling problem.
# The two should be collapsed to one name once the dispatcher and the
# registration script agree; see kubernetes/README.md.
#
# `automountServiceAccountToken: false` is the point of this file.
#
# A mounted token is a credential for the Kubernetes API sitting in the
# filesystem of a container that runs a coding agent -- an agent whose whole job
# is to read files and follow instructions it finds in a repository. Nothing in
# the worker talks to the Kubernetes API: it reads Firestore, writes GCS and
# calls a provider, all of which it authenticates with the Google service
# account that Workload Identity provides through the metadata server, not with
# this token. So the token has no use to the worker and considerable use to
# anybody who can persuade the agent to read it out.
#
# Setting it false on the ServiceAccount is a default, not a guarantee: a pod
# spec that sets `automountServiceAccountToken: true` overrides it, which is
# exactly what the dispatcher's manifest currently does. The Job template in
# `worker-templates/` sets it false at the pod level too, and that is the layer
# that actually decides.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarm-worker
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-terraform
    swarm-tenant: __TENANT_ID__
    app.kubernetes.io/part-of: swarm
    app.kubernetes.io/component: agent-worker
  annotations:
    # Workload Identity: pods using this KSA authenticate to Google APIs as the
    # tenant's own GSA, which is scoped to that tenant's Firestore data, GCS
    # prefix and Secret Manager secrets and to nothing else.
    iam.gke.io/gcp-service-account: __GSA_EMAIL__
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # The name the dispatcher's Job manifest asks for: sanitize_name("swarm", id).
  name: __KSA_NAME__
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-terraform
    swarm-tenant: __TENANT_ID__
    app.kubernetes.io/part-of: swarm
    app.kubernetes.io/component: agent-worker
  annotations:
    iam.gke.io/gcp-service-account: __GSA_EMAIL__
    swarm.saga.xyz/alias-of: swarm-worker
automountServiceAccountToken: false
---
# The namespace's own `default` service account, disarmed.
#
# Kubernetes creates it automatically in every namespace and mounts its token
# into any pod that does not name a service account. Nothing here should ever
# use it, but "should never" is not a control, and a pod created by hand during
# an incident is precisely when the default gets used.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-terraform
    swarm-tenant: __TENANT_ID__
  annotations:
    swarm.saga.xyz/rationale: >-
      Token automounting is disabled on the default service account so that a
      pod created without naming one gets no Kubernetes API credential either.
automountServiceAccountToken: false
