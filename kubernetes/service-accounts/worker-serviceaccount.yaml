# The tenant's Kubernetes identity on the GKE path.
#
# Two service accounts are created, and that is a migration rather than a
# design.
#
# `__KSA_NAME__` is the one that matters: it renders to `swarm-agent-worker`,
# which is the name `apps/scheduler/scheduler/dispatch.py` puts in every GKE
# pod spec (`GkeJobDispatcher.ksa_for`) and the name
# `terraform/modules/tenancy` issued the Workload Identity binding for. Nothing
# in `terraform/` creates a Kubernetes object -- there is no kubernetes
# provider here -- so this file is the ONLY thing that creates it, and until
# 2026-09-24 it did not: `__KSA_NAME__` rendered to `swarm-<tenant>`, a
# spelling the dispatcher stopped asking for when its KSA was renamed. A pod
# naming a ServiceAccount that does not exist is never scheduled at all; the
# Job controller reports `serviceaccount "..." not found` on the Job's events
# and the pod simply never appears, which reads as a scheduling or capacity
# problem. That is the same disguise the namespace bug wore -- see
# kubernetes/render.py's NAMESPACE_PREFIX and DEFAULT_KSA_NAME.
#
# `swarm-worker` stays because `scripts/register-tenant.sh` has
# workload-identity-bound it for every tenant it has ever registered. Removing
# a bound name is a migration of its own; adding the missing one is not, and
# was the outage.
#
# `automountServiceAccountToken: false` is the point of this file.
#
# A mounted token is a credential for the Kubernetes API sitting in the
# filesystem of a container that runs a coding agent -- an agent whose whole job
# is to read files and follow instructions it finds in a repository. Nothing in
# the worker talks to the Kubernetes API: it reads Firestore, writes GCS and
# calls a provider, all of which it authenticates with the Google service
# account that Workload Identity provides through the metadata server, not with
# this token. So the token has no use to the worker and considerable use to
# anybody who can persuade the agent to read it out.
#
# Setting it false on the ServiceAccount is a default, not a guarantee: a pod
# spec that sets `automountServiceAccountToken: true` overrides it, and the pod
# spec is the layer that actually decides. So it is set false in all three
# places that build a worker pod -- here, in `worker-templates/`, and in the
# dispatcher's manifest (`apps/scheduler/scheduler/dispatch.py`) -- and
# `swarm-worker-pod-hardening` in `policies/pod-security.yaml` refuses a pod
# that says otherwise, so the default and the guarantee no longer depend on each
# other.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: swarm-worker
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-terraform
    swarm-tenant: __TENANT_ID__
    app.kubernetes.io/part-of: swarm
    app.kubernetes.io/component: agent-worker
  annotations:
    # Workload Identity: pods using this KSA authenticate to Google APIs as the
    # tenant's own GSA, which is scoped to that tenant's Firestore data, GCS
    # prefix and Secret Manager secrets and to nothing else.
    iam.gke.io/gcp-service-account: __GSA_EMAIL__
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  # The name the dispatcher's Job manifest asks for: sanitize_name("swarm", id).
  name: __KSA_NAME__
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-terraform
    swarm-tenant: __TENANT_ID__
    app.kubernetes.io/part-of: swarm
    app.kubernetes.io/component: agent-worker
  annotations:
    iam.gke.io/gcp-service-account: __GSA_EMAIL__
    swarm.saga.xyz/alias-of: swarm-worker
automountServiceAccountToken: false
---
# The namespace's own `default` service account, disarmed.
#
# Kubernetes creates it automatically in every namespace and mounts its token
# into any pod that does not name a service account. Nothing here should ever
# use it, but "should never" is not a control, and a pod created by hand during
# an incident is precisely when the default gets used.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-terraform
    swarm-tenant: __TENANT_ID__
  annotations:
    swarm.saga.xyz/rationale: >-
      Token automounting is disabled on the default service account so that a
      pod created without naming one gets no Kubernetes API credential either.
automountServiceAccountToken: false
