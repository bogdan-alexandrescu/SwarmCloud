# The OLDER worker identity, `__LEGACY_KSA_NAME__` -- rendered ONLY WHERE IT IS BOUND.
#
# kubernetes/render.py includes this file when, and only when, `--bound-ksa`
# names `__LEGACY_KSA_NAME__` (render.py LEGACY_KSA_NAME, which renders to
# `swarm-worker`). kubernetes/apply.sh supplies `--bound-ksa` from the tenant
# GSA's IAM policy: one per `<project>.svc.id.goog[<namespace>/<ksa>]` member
# of roles/iam.workloadIdentityUser. Nothing types it -- apply.sh refuses the
# flag on its own command line.
#
# WHY IT IS CONDITIONAL. It used to be created in every tenant namespace, on the
# claim that `scripts/register-tenant.sh` had workload-identity-bound it for
# every tenant. That is true only of tenants the script provisioned. eng is a
# terraform tenant, and measured 2026-09-25 the only workloadIdentityUser member
# on swarm-agent-worker-eng@ is `[swarm-tenant-eng/swarm-agent-worker]`. So in
# swarm-tenant-eng this account carried the GSA annotation and got no Google
# identity -- an annotation claiming an identity IAM does not grant -- and no
# pod or Job named it. The dispatcher's pods run as `__KSA_NAME__`.
#
# WHERE IT IS STILL RENDERED: a tenant `scripts/register-tenant.sh` registered.
# Its KSAS array binds both names, and it issues those bindings BEFORE it calls
# apply.sh, so the render it triggers already sees them.
#
# WHAT A RENDER WITHOUT IT DOES TO A LIVE NAMESPACE: nothing to the account.
# apply.sh runs `kubectl apply` with no `--prune`, which never deletes an object
# a manifest stopped declaring. The `swarm-worker` RoleBinding in
# rbac/worker-rbac.yaml stops naming it (that subject moved here), and the
# ServiceAccount itself stays until someone deletes it -- kubernetes/README.md
# §5 has the one line for eng.
#
# The RoleBinding is in this file rather than in rbac/worker-rbac.yaml so the
# older identity is included whole or not at all: an account without its
# binding, or a binding naming an account the render did not create, is the
# divergence tests/unit/worker/test_kubernetes_manifests.py
# (test_the_role_binding_covers_every_account_a_pod_could_use) exists to catch.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: __LEGACY_KSA_NAME__
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-terraform
    swarm-tenant: __TENANT_ID__
    app.kubernetes.io/part-of: swarm
    app.kubernetes.io/component: agent-worker
  annotations:
    # Same GSA as the current account: where this one is bound, it is bound to
    # the tenant's own identity and nothing wider.
    iam.gke.io/gcp-service-account: __GSA_EMAIL__
    swarm.saga.xyz/superseded-by: __KSA_NAME__
# Hardened exactly like every other worker account: see
# worker-serviceaccount.yaml for why the token is never mounted.
automountServiceAccountToken: false
---
# The older account's grant of the empty `swarm-worker` Role from
# rbac/worker-rbac.yaml -- i.e. of nothing. It exists so every account a pod
# could run as is named by the worker Role's bindings, which makes "workers get
# no Kubernetes API access" a statement about every account, not most of them.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: swarm-worker-legacy
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-terraform
    swarm-tenant: __TENANT_ID__
    app.kubernetes.io/part-of: swarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: swarm-worker
subjects:
  - kind: ServiceAccount
    name: __LEGACY_KSA_NAME__
    namespace: __NAMESPACE__
