# What the workspace deployer may write, enforced by the API server
# (docs/workspaces.md §2.3, lane W5).
#
# kubernetes/rbac/provisioner-rbac.yaml gives `swarm-workspace-deployer` a
# ClusterRole, because RBAC cannot restrict `create` by name: a role that can
# create one namespace can create any, and a role that can create a Role in a
# new namespace can create it in `swarm-system` or `kube-system`. These
# policies are what narrow it, for requests by that identity and nobody else:
#
#   swarm-workspace-deployer-scope        every kind the deployer may write,
#                                         listed (Autopilot refuses "*"). The
#                                         write is a CREATE or an UPDATE
#                                         (never a DELETE), of a Namespace
#                                         named swarm-tenant-u-* or
#                                         swarm-tenant-<id>, or of an object
#                                         inside a swarm-tenant-u-* namespace or
#                                         inside one carrying the workspace
#                                         label -- never in a Terraform
#                                         tenant's -- and only of a kind and
#                                         name the tenant render produces.
#   swarm-workspace-deployer-namespaces   the Namespace carries the labels the
#                                         worker policies and the scheduler
#                                         select on, and enforces `restricted`;
#                                         one outside swarm-tenant-u-* is
#                                         created only with the workspace label
#                                         and updated only if it already has it.
#   swarm-workspace-deployer-roles        a Role's rules are EXACTLY the
#                                         render's, so `escalate` (which RBAC
#                                         cannot narrow on create) writes
#                                         nothing else.
#   swarm-workspace-deployer-rolebindings a RoleBinding names one of the three
#                                         Roles, and binds it only to whom the
#                                         render binds it: the dispatcher Role
#                                         to the scheduler, the reaper Role to
#                                         the reconciler, the worker Role to
#                                         ServiceAccounts in the same
#                                         namespace. Otherwise the deployer
#                                         could bind Job creation to itself and
#                                         run as a person's worker identity.
#
# THE LITERALS BELOW ARE A RESTATEMENT, AND A TEST HOLDS THEM.
# tests/unit/worker/test_workspace_provisioner_scope.py renders the tenant
# files and asserts the Role rules, the RoleBinding subjects and the
# kind-to-names map here equal what render.py produces, and that the users
# matched here are exactly the subjects provisioner-rbac.yaml binds. They are
# written as JSON-shaped CEL literals so that test can read them.
#
# WHY THE SCOPE POLICY MATCHES EVERY KIND THE DEPLOYER WRITES, against the
# one-kind-per-policy rule pod-security.yaml states. That rule exists because CEL is type-checked
# against the schema of what it matches; the scope policy reads `request`
# alone and never `object`, so there is no schema to disagree about. The three
# policies that read `object` match one kind each.
#
# WHY THE BINDINGS HAVE NO namespaceSelector, unlike every other binding in
# this directory. A selector on the swarm label would let the deployer escape
# by creating a namespace WITHOUT the label, or by writing into one that lacks
# it. What scopes these is `matchConditions` on the caller: a request by anyone
# but the deployer is not evaluated at all.
#
# THE WORKSPACE LABEL, AND WHY IT IS THE BOUND FOR A GROUP OR SERVICE
# WORKSPACE (docs/design/workspace-kinds.md §3.1 and §4.3, owner's answer
# Q3 (a), 2026-10-19). A group tenant's id is the bare slug of the group
# (`eng`, `research`), so the `swarm-tenant-u-*` name bound cannot hold it.
# The bound is widened to `swarm-tenant-<id>`, and narrowed again by
# `swarm.saga.xyz/workspace: w-<6 hex>`, which only the job writes and only on
# CREATE (render.py --workspace-id, the job's step A7):
#
#   * a Namespace outside `swarm-tenant-u-*` is CREATED only with the label,
#     and UPDATED only when the namespace already has it, unchanged -- so
#     labelling an existing hand-made namespace is refused, and nothing the
#     deployer did not create becomes its;
#   * an object inside such a namespace is written only when the namespace
#     (`namespaceObject`) carries the label. `eng`'s, `smoke`'s and every
#     hand-made namespace lack it, so the deployer still cannot write into any
#     of them;
#   * the namespaces of the tenants terraform/infra declares are refused BY
#     NAME, whatever their labels, so a missing `swarm-tenant-eng` cannot be
#     created with the label either. The list is rendered from the
#     environment's tfvars (render.py --terraform-tfvars; kubernetes/apply.sh
#     passes its environment's). It includes Terraform's `u-` tenants, which
#     the deployer never had any business writing;
#   * the `swarm-tenant-u-*` arm is as it was, for the personal namespaces
#     made before the label existed (w-752763's, w-7f9285's). Once written,
#     the label never changes and never goes, on any namespace.
#
# The label is a string in this file and in render.py, not a constant in the
# frozen contract: neither imports the contract for labels (design §5).
#
# Fail closed throughout: a policy that cannot be evaluated refuses the write.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swarm-workspace-deployer-scope
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  failurePolicy: Fail
  matchConstraints:
    # Every resource provisioner-rbac.yaml grants the deployer a write on, by
    # name. Not ("*", "*"): GKE Autopilot's own admission webhook refuses any
    # admission rule matching every group and resource (measured 2026-10-11,
    # `apply.sh --policies` server dry run). RBAC already bounds what the
    # deployer can write to these, so listing them matches what "*" matched;
    # test_the_scope_policy_matches_every_resource_the_rbac_lets_it_write holds
    # this list to the grants. DELETE is matched so the validation below can
    # refuse it.
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces", "serviceaccounts", "resourcequotas", "limitranges"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["roles", "rolebindings"]
  # The deployer, by email and by numeric uniqueId -- the same two subjects
  # provisioner-rbac.yaml binds. A spelling bound there and missing here would
  # be RBAC without this policy.
  matchConditions:
    - name: workspace-deployer
      expression: >-
        request.userInfo.username in ["__WORKSPACE_DEPLOYER_GSA__", "__WORKSPACE_DEPLOYER_UID__"]
  variables:
    # `has()` on every optional request field: AdmissionRequest omits an empty
    # group, namespace, name or subresource, and reading an absent field is an
    # evaluation error -- which, failing closed, would refuse every write the
    # deployer makes with a message about nothing.
    - name: resource
      expression: >-
        (has(request.resource.group) ? request.resource.group : '') + '/' + request.resource.resource
    - name: target
      expression: >-
        variables.resource == '/namespaces'
          ? (has(request.name) ? request.name : '')
          : (has(request.namespace) ? request.namespace : '')
    # A person's namespace: the arm that predates the workspace label.
    - name: personal
      expression: >-
        variables.target.matches('^swarm-tenant-u-[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    # The namespaces of the tenants terraform/infra declares, refused by name
    # whatever they carry: kubernetes/render.py --terraform-tfvars.
    - name: terraform
      expression: >-
        __TERRAFORM_NAMESPACES__
    # Whether the namespace a namespaced object is written into carries the
    # workspace label. Read only for a namespaced object: `namespaceObject` is
    # null for a Namespace itself (cluster-scoped), and that request is judged
    # by swarm-workspace-deployer-namespaces, which reads the object.
    - name: labelled
      expression: >-
        has(namespaceObject.metadata.labels) &&
        'swarm.saga.xyz/workspace' in namespaceObject.metadata.labels &&
        namespaceObject.metadata.labels['swarm.saga.xyz/workspace'].matches('^w-[0-9a-f]{6}$')
    # What the tenant render produces, by `group/resource`: render.py's
    # TENANT_FILES and LEGACY_KSA_FILES. Not the spec-verify-keys ConfigMap:
    # the workspace job renders without it, and the ClusterRole grants none.
    - name: names
      expression: >-
        {"/serviceaccounts": ["swarm-agent-worker", "default", "swarm-worker"],
        "/resourcequotas": ["swarm-tenant-quota"],
        "/limitranges": ["swarm-worker-limits"],
        "networking.k8s.io/networkpolicies": ["swarm-default-deny", "swarm-deny-cross-tenant-ingress", "swarm-allow-worker-egress", "swarm-allow-live-egress", "swarm-allow-egress-proxy", "swarm-allow-judge-egress", "swarm-allow-graph-service", "swarm-allow-typesafe-fwd"],
        "rbac.authorization.k8s.io/roles": ["swarm-worker", "swarm-dispatcher", "swarm-reaper"],
        "rbac.authorization.k8s.io/rolebindings": ["swarm-worker", "swarm-worker-legacy", "swarm-dispatcher", "swarm-reaper"]}
  validations:
    - expression: "request.operation == 'CREATE' || request.operation == 'UPDATE'"
      message: >-
        the workspace deployer creates and patches; it never deletes. Removing a
        person's workspace is deprovisioning (docs/workspaces.md §7), which is
        the owner's.
      reason: Forbidden

    - expression: "!has(request.subResource) || request.subResource == ''"
      message: >-
        the workspace deployer writes whole objects, never a subresource
        (status, finalize, exec, ...).
      reason: Forbidden

    - expression: >-
        !(variables.target in variables.terraform)
      message: >-
        the workspace deployer never writes the namespace of a tenant
        terraform/infra declares, or anything inside one, whatever its labels.
        Those are the release's.
      reason: Forbidden

    - expression: >-
        variables.personal ||
        (variables.target.matches('^swarm-tenant-[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
          (variables.resource == '/namespaces' || variables.labelled))
      message: >-
        the workspace deployer writes only a Namespace named swarm-tenant-<tenant>,
        an object inside a swarm-tenant-u-<person> namespace, or an object inside
        a namespace carrying swarm.saga.xyz/workspace, which only the deployer
        writes and only on create. Every other namespace, and every other
        cluster-scoped object, belongs to someone else.
      reason: Forbidden

    - expression: >-
        variables.resource == '/namespaces' ||
        (variables.resource in variables.names && has(request.name) &&
          request.name in variables.names[variables.resource])
      message: >-
        the workspace deployer writes only the kinds and names the tenant render
        produces (kubernetes/render.py TENANT_FILES). A new object in that
        render must be added to swarm-workspace-deployer-scope as well; the
        parity test says which.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swarm-workspace-deployer-scope
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  policyName: swarm-workspace-deployer-scope
  # Audit as well: the refusal reaches the job's log, and the audit log is
  # where the alert of docs/workspaces.md §2.4 can see it.
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swarm-workspace-deployer-namespaces
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces"]
  matchConditions:
    - name: workspace-deployer
      expression: >-
        request.userInfo.username in ["__WORKSPACE_DEPLOYER_GSA__", "__WORKSPACE_DEPLOYER_UID__"]
  variables:
    # The workspace label on the namespace as written, and as it was ('' when
    # absent). oldObject is read only on UPDATE: it is null on CREATE.
    - name: label
      expression: >-
        has(object.metadata.labels) && 'swarm.saga.xyz/workspace' in object.metadata.labels
          ? object.metadata.labels['swarm.saga.xyz/workspace'] : ''
    - name: old_label
      expression: >-
        request.operation == 'UPDATE' && has(oldObject.metadata.labels) &&
        'swarm.saga.xyz/workspace' in oldObject.metadata.labels
          ? oldObject.metadata.labels['swarm.saga.xyz/workspace'] : ''
  validations:
    # The worker pod and Job policies in pod-security.yaml bind by this label.
    # A namespace without it is a namespace where Spot, bursting and
    # Kubernetes-level retries are allowed again.
    - expression: >-
        has(object.metadata.labels) &&
        'app.kubernetes.io/part-of' in object.metadata.labels &&
        object.metadata.labels['app.kubernetes.io/part-of'] == 'swarm'
      message: >-
        a workspace namespace must carry app.kubernetes.io/part-of=swarm, which
        is what the worker admission policies select on.
      reason: Forbidden

    - expression: >-
        has(object.metadata.labels) &&
        'swarm-tenant' in object.metadata.labels &&
        'swarm-tenant-' + object.metadata.labels['swarm-tenant'] == object.metadata.name
      message: >-
        a workspace namespace's swarm-tenant label must name the tenant the
        namespace is for (swarm-tenant-<tenant>).
      reason: Forbidden

    # Lowering enforcement for an incident stays possible (render.py
    # --pss-enforce), and stays the owner's: the deployer always writes
    # `restricted`.
    - expression: >-
        has(object.metadata.labels) &&
        'pod-security.kubernetes.io/enforce' in object.metadata.labels &&
        object.metadata.labels['pod-security.kubernetes.io/enforce'] == 'restricted'
      message: >-
        a workspace namespace enforces Pod Security `restricted`; only the owner
        may lower it.
      reason: Forbidden

    # The workspace label (header): a w- id when present; outside the
    # personal arm, present on CREATE and already present on UPDATE; and once
    # written, never changed or removed.
    - expression: >-
        variables.label == '' || variables.label.matches('^w-[0-9a-f]{6}$')
      message: >-
        swarm.saga.xyz/workspace names the workspace that created the namespace,
        w- and six hex digits.
      reason: Forbidden

    - expression: >-
        object.metadata.name.matches('^swarm-tenant-u-[a-z0-9]([-a-z0-9]*[a-z0-9])?$') ||
        (variables.label != '' && (request.operation == 'CREATE' || variables.old_label != ''))
      message: >-
        a namespace outside swarm-tenant-u-* is created by the workspace deployer
        only with swarm.saga.xyz/workspace, and updated only when it already
        carries it. Labelling an existing namespace does not make it the
        deployer's.
      reason: Forbidden

    - expression: >-
        variables.old_label == '' || variables.label == variables.old_label
      message: >-
        swarm.saga.xyz/workspace never changes and never goes once written.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swarm-workspace-deployer-namespaces
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  policyName: swarm-workspace-deployer-namespaces
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swarm-workspace-deployer-roles
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles"]
  matchConditions:
    - name: workspace-deployer
      expression: >-
        request.userInfo.username in ["__WORKSPACE_DEPLOYER_GSA__", "__WORKSPACE_DEPLOYER_UID__"]
  variables:
    # Each Role's rules as [apiGroups, resources, verbs], in the render's order:
    # rbac/worker-rbac.yaml's empty swarm-worker and rbac/dispatcher-rbac.yaml's
    # two. Order is compared too, which costs nothing: apply sends the render.
    - name: expected
      expression: >-
        {"swarm-worker": [],
        "swarm-dispatcher": [[["batch"], ["jobs"], ["create", "get", "list", "watch"]], [[""], ["pods"], ["get", "list", "watch"]], [[""], ["pods/log"], ["get"]], [[""], ["events"], ["get", "list", "watch"]]],
        "swarm-reaper": [[["batch"], ["jobs"], ["get", "list", "watch", "delete"]], [[""], ["pods"], ["get", "list", "watch", "delete"]]]}
    # A rule without apiGroups, resources or verbs is an evaluation error here,
    # and so a refusal. None of the render's omits them.
    # The swarm-worker Role is intentionally empty, and an empty `rules` list
    # reaches admission as a PRESENT field whose value is null: has() alone
    # let `.map` run on null, the expression errored ("got 'types.Null',
    # expected iterable type") and the first self-service workspace's A7 was
    # refused (w-7f9285, 2026-10-13 04:52Z). Null and absent both mean no rules.
    - name: actual
      expression: >-
        has(object.rules) && type(object.rules) == list ? object.rules.map(r, [r.apiGroups, r.resources, r.verbs]) : []
  validations:
    - expression: "object.metadata.name in variables.expected"
      message: >-
        the workspace deployer creates only the swarm-worker, swarm-dispatcher
        and swarm-reaper Roles.
      reason: Forbidden

    - expression: >-
        !(object.metadata.name in variables.expected) ||
        variables.actual == variables.expected[object.metadata.name]
      message: >-
        a Role the workspace deployer writes must carry exactly the rules
        kubernetes/render.py renders for it. The deployer holds `escalate`
        because these Roles grant what it does not hold; this is what keeps
        that from meaning any rule at all.
      reason: Forbidden

    - expression: >-
        !has(object.rules) || type(object.rules) != list ||
        object.rules.all(r, !has(r.resourceNames) && !has(r.nonResourceURLs))
      message: "the rendered Roles name no resourceNames and no nonResourceURLs."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swarm-workspace-deployer-roles
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  policyName: swarm-workspace-deployer-roles
  validationActions: ["Deny", "Audit"]
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swarm-workspace-deployer-rolebindings
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: workspace-deployer
      expression: >-
        request.userInfo.username in ["__WORKSPACE_DEPLOYER_GSA__", "__WORKSPACE_DEPLOYER_UID__"]
  variables:
    # Who rbac/dispatcher-rbac.yaml binds each control-plane Role to, by email
    # and by uniqueId. swarm-worker is bound to ServiceAccounts, checked below.
    - name: users
      expression: >-
        {"swarm-dispatcher": ["__SCHEDULER_GSA__", "__SCHEDULER_UID__"],
        "swarm-reaper": ["__RECONCILER_GSA__", "__RECONCILER_UID__"]}
  validations:
    - expression: >-
        object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
        object.roleRef.kind == 'Role' &&
        (object.roleRef.name == 'swarm-worker' || object.roleRef.name in variables.users)
      message: >-
        a RoleBinding the workspace deployer writes references one of the
        Roles swarm-worker, swarm-dispatcher or swarm-reaper -- never a
        ClusterRole.
      reason: Forbidden

    - expression: >-
        object.roleRef.name != 'swarm-worker' || !has(object.subjects) ||
        object.subjects.all(s,
          s.kind == 'ServiceAccount' && has(s.namespace) && has(request.namespace) &&
          s.namespace == request.namespace)
      message: >-
        swarm-worker is bound only to ServiceAccounts in its own namespace.
      reason: Forbidden

    - expression: >-
        !(object.roleRef.name in variables.users) || !has(object.subjects) ||
        object.subjects.all(s,
          s.kind == 'User' && s.name in variables.users[object.roleRef.name])
      message: >-
        swarm-dispatcher is bound only to the scheduler and swarm-reaper only to
        the reconciler. Binding either to anyone else -- the deployer included
        -- would let that caller create or delete Jobs in a person's namespace.
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swarm-workspace-deployer-rolebindings
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  policyName: swarm-workspace-deployer-rolebindings
  validationActions: ["Deny", "Audit"]
