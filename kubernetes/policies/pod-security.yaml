# Cluster-scoped admission policy for tenant namespaces.
#
# Pod Security Admission covers the generic container-escape surface, and
# Autopilot already refuses privileged pods, hostPath and the Docker socket on
# its own. What neither of them knows about are this platform's own invariants,
# and those are what this file enforces:
#
#   invariant 6   Spot is disabled platform-wide. Spot Pods cannot use Autopilot
#                 extended run time, so a Spot pod is a pod that can be
#                 preempted mid-agent-run -- which is the one thing the whole
#                 checkpoint-and-lease design exists to avoid paying for.
#   invariant 7   requests == limits. A container that requests less than its
#                 limit is a container that gets OOM-killed under node pressure
#                 at ninety minutes into a two-hour run.
#   fencing       a retry is a NEW attempt with a new generation, minted by the
#                 scheduler. A Kubernetes-level retry re-runs the agent under
#                 the OLD generation, so `backoffLimit` must be 0.
#
# THREE policies rather than one, and the split is not stylistic. A
# ValidatingAdmissionPolicy compiles its CEL against the schema of the resources
# it matches, so an expression that reaches `spec.template.spec` cannot also
# type-check against a Pod, whose spec has no `template`. Matching both kinds in
# one policy would leave that resolution up to the API server's type inference.
# One policy per kind removes the question:
#
#   swarm-worker-pod-constraints    pods, Deny.   The real enforcement point:
#                                                 this is what the kubelet is
#                                                 about to run.
#   swarm-worker-job-constraints    jobs, Deny.   Fails fast, at the object a
#                                                 person or the dispatcher
#                                                 actually creates, where the
#                                                 error is visible rather than
#                                                 buried in a controller event.
#   swarm-worker-hardening-...      pods, Warn.   See its own note below.
#
# Every binding is scoped by namespace label, so nothing here can affect the
# other teams' workloads in this shared cluster.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swarm-worker-pod-constraints
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  # If the policy cannot be evaluated, refuse the pod. A constraint about
  # preemptible capacity must not fail open.
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        !has(object.spec.tolerations) ||
        !object.spec.tolerations.exists(t,
          has(t.key) && (
            t.key.startsWith('cloud.google.com/gke-spot') ||
            t.key.startsWith('cloud.google.com/gke-preemptible')))
      message: >-
        Spot is disabled platform-wide: a Spot Pod cannot use Autopilot extended
        run time, so it can be preempted in the middle of an agent run. Remove
        the gke-spot / gke-preemptible toleration.
      reason: Forbidden

    - expression: >-
        !has(object.spec.nodeSelector) || (
          !('cloud.google.com/gke-spot' in object.spec.nodeSelector) &&
          !('cloud.google.com/gke-preemptible' in object.spec.nodeSelector))
      message: >-
        Spot is disabled platform-wide; a nodeSelector requesting Spot or
        preemptible capacity is refused for the same reason as the toleration.
      reason: Forbidden

    # `quantity()` rather than string equality: "4" and "4000m" are the same
    # amount of CPU and different strings, and rejecting a correct pod because
    # it spelled its CPU in millicores would be a bug wearing a policy.
    - expression: >-
        variables.containers.all(c,
          !has(c.resources) || !has(c.resources.limits) || !has(c.resources.requests) || (
            (!('cpu' in c.resources.limits) || !('cpu' in c.resources.requests) ||
              quantity(c.resources.requests['cpu'])
                .compareTo(quantity(c.resources.limits['cpu'])) == 0) &&
            (!('memory' in c.resources.limits) || !('memory' in c.resources.requests) ||
              quantity(c.resources.requests['memory'])
                .compareTo(quantity(c.resources.limits['memory'])) == 0)))
      message: >-
        requests must equal limits for cpu and memory. Bursting past a request is
        precisely what gets a long-running agent container OOM-killed under node
        pressure, and there is no headroom to absorb it because every resource
        class is sized as both request and limit.
      reason: Forbidden

    # By the time a policy sees a Pod, LimitRanger has already applied the
    # namespace defaults, so a container with no limits has bypassed them -- and
    # a container with no limits is unbounded demand from a tenant with a bounded
    # quota.
    - expression: >-
        variables.containers.all(c,
          has(c.resources) && has(c.resources.limits) &&
          'cpu' in c.resources.limits && 'memory' in c.resources.limits)
      message: >-
        every container must declare cpu and memory limits; the namespace
        LimitRange supplies defaults, so a pod without them has bypassed it.
      reason: Forbidden

    # One field per validation, each guarded by its own `has()`. Combining them
    # into a single expression looks tidier and is a trap: CEL short-circuits
    # `||`, so a pod that sets hostPID but not hostNetwork would fall through to
    # a clause reading a field that is not there, raise an evaluation error, and
    # -- with failurePolicy Fail -- be refused with a message about nothing.
    - expression: "!has(object.spec.hostNetwork) || object.spec.hostNetwork != true"
      message: >-
        hostNetwork is refused: it puts the pod on the node's network namespace,
        where the NetworkPolicy that separates tenants does not apply.
      reason: Forbidden

    - expression: "!has(object.spec.hostPID) || object.spec.hostPID != true"
      message: "hostPID is refused: it exposes every other workload's processes."
      reason: Forbidden

    - expression: "!has(object.spec.hostIPC) || object.spec.hostIPC != true"
      message: "hostIPC is refused."
      reason: Forbidden

    - expression: >-
        !has(object.spec.volumes) || !object.spec.volumes.exists(v, has(v.hostPath))
      message: >-
        hostPath volumes are refused. This is also how the container runtime
        socket would be reached, and an agent that can reach the Docker socket
        has escaped every boundary this platform builds.
      reason: Forbidden

    - expression: >-
        variables.containers.all(c,
          !has(c.securityContext) || !has(c.securityContext.privileged) ||
          c.securityContext.privileged != true)
      message: "privileged containers are refused."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swarm-worker-pod-constraints
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  policyName: swarm-worker-pod-constraints
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: swarm
---
# The same invariants, checked at the object the dispatcher actually creates.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swarm-worker-job-constraints
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    - name: podSpec
      expression: "object.spec.template.spec"
    - name: containers
      expression: >-
        variables.podSpec.containers +
        (has(variables.podSpec.initContainers) ? variables.podSpec.initContainers : [])
  validations:
    - expression: >-
        !has(variables.podSpec.tolerations) ||
        !variables.podSpec.tolerations.exists(t,
          has(t.key) && (
            t.key.startsWith('cloud.google.com/gke-spot') ||
            t.key.startsWith('cloud.google.com/gke-preemptible')))
      message: >-
        Spot is disabled platform-wide; remove the gke-spot / gke-preemptible
        toleration from the Job's pod template.
      reason: Forbidden

    - expression: >-
        !has(variables.podSpec.nodeSelector) || (
          !('cloud.google.com/gke-spot' in variables.podSpec.nodeSelector) &&
          !('cloud.google.com/gke-preemptible' in variables.podSpec.nodeSelector))
      message: "Spot is disabled platform-wide; remove the Spot nodeSelector."
      reason: Forbidden

    - expression: >-
        variables.containers.all(c,
          !has(c.resources) || !has(c.resources.limits) || !has(c.resources.requests) || (
            (!('cpu' in c.resources.limits) || !('cpu' in c.resources.requests) ||
              quantity(c.resources.requests['cpu'])
                .compareTo(quantity(c.resources.limits['cpu'])) == 0) &&
            (!('memory' in c.resources.limits) || !('memory' in c.resources.requests) ||
              quantity(c.resources.requests['memory'])
                .compareTo(quantity(c.resources.limits['memory'])) == 0)))
      message: "requests must equal limits for cpu and memory."
      reason: Forbidden

    # The one check that only makes sense on a Job, and the one whose absence is
    # most dangerous: a Kubernetes retry re-runs the agent under the generation
    # the first pod was given. That generation may already have been invalidated
    # and its lease reissued to a replacement attempt, so the retry is a second
    # agent on the same task, with the same credentials, on the same repository.
    # The platform owns retries; Kubernetes must not.
    - expression: "has(object.spec.backoffLimit) && object.spec.backoffLimit == 0"
      message: >-
        backoffLimit must be 0. A retry is a new attempt with a new fencing
        generation, minted by the scheduler inside the admission transaction; a
        Kubernetes-level retry would re-run the agent under the old generation.
      reason: Forbidden

    - expression: >-
        !has(variables.podSpec.hostNetwork) || variables.podSpec.hostNetwork != true
      message: "hostNetwork is refused."
      reason: Forbidden

    - expression: >-
        !has(variables.podSpec.volumes) ||
        !variables.podSpec.volumes.exists(v, has(v.hostPath))
      message: "hostPath volumes are refused."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swarm-worker-job-constraints
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  policyName: swarm-worker-job-constraints
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: swarm
---
# The pod-hardening fields, reported rather than enforced -- for now.
#
# These are exactly what `worker-templates/worker-job.yaml` sets, and exactly
# what Pod Security Admission's `restricted` level would require. The GKE
# manifest built in `apps/scheduler/scheduler/dispatch.py` does not set a
# container securityContext yet, so denying here -- or setting the namespace's
# PSA enforce label to `restricted` -- would reject every browser job the
# dispatcher creates and take the GKE path offline.
#
# Warn reaches whoever ran kubectl. Audit reaches the API server's audit log,
# which is where a pod created by a controller rather than by a person shows up,
# so the gap is measurable today instead of merely known. Change
# `validationActions` to ["Deny"] and the namespace label to
# `pod-security.kubernetes.io/enforce: restricted` on the same day the
# dispatcher's pod spec matches the template.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: swarm-worker-hardening-advisories
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  # An advisory check must never block a pod, so an evaluation failure is
  # ignored -- the opposite of the hard constraints above, deliberately.
  failurePolicy: Ignore
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        object.spec.containers +
        (has(object.spec.initContainers) ? object.spec.initContainers : [])
  validations:
    - expression: >-
        has(object.spec.automountServiceAccountToken) &&
        object.spec.automountServiceAccountToken == false
      message: >-
        automountServiceAccountToken should be false. A worker never calls the
        Kubernetes API -- it authenticates to Google APIs through Workload
        Identity -- so a mounted token is a credential with no use to the pod and
        real use to anything that can read its filesystem.
      reason: Invalid

    - expression: >-
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
          c.securityContext.allowPrivilegeEscalation == false)
      message: "allowPrivilegeEscalation should be explicitly false on every container."
      reason: Invalid

    - expression: >-
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.capabilities) &&
          has(c.securityContext.capabilities.drop) &&
          c.securityContext.capabilities.drop.exists(d, d == 'ALL'))
      message: "every container should drop ALL capabilities."
      reason: Invalid

    - expression: >-
        (has(object.spec.securityContext) &&
         has(object.spec.securityContext.runAsNonRoot) &&
         object.spec.securityContext.runAsNonRoot == true) ||
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.runAsNonRoot) &&
          c.securityContext.runAsNonRoot == true)
      message: >-
        runAsNonRoot should be true. The runtime images already run as uid 10001,
        so declaring it costs nothing and makes the kubelet enforce it.
      reason: Invalid

    - expression: >-
        (has(object.spec.securityContext) &&
         has(object.spec.securityContext.seccompProfile) &&
         object.spec.securityContext.seccompProfile.type == 'RuntimeDefault') ||
        variables.containers.all(c,
          has(c.securityContext) && has(c.securityContext.seccompProfile) &&
          c.securityContext.seccompProfile.type == 'RuntimeDefault')
      message: "seccompProfile should be RuntimeDefault."
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: swarm-worker-hardening-advisories
  labels:
    managed-by: swarm-terraform
    app.kubernetes.io/part-of: swarm
spec:
  policyName: swarm-worker-hardening-advisories
  validationActions: ["Warn", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: swarm
