# The v2 agent Job: root inside a gVisor sandbox.
#
# This sits BESIDE worker-job.yaml rather than replacing it, and the pair is
# worth reading together. v1's template argues at length for non-root, a
# read-only root filesystem and dropped capabilities. That reasoning was correct
# for v1 and is deliberately preserved: v2 does not overturn it, it moves the
# boundary it depended on.
#
# WHY ROOT (BUILD_PROMPT_V2 §2.2)
# An agent that cannot install the tool it needs fails at the first
# unanticipated task, and "install what you need" is a stated requirement. apt
# needs root; a writable root filesystem is what apt writes to.
#
# WHY THAT IS NOT A REGRESSION
# Root removes the in-CONTAINER defence. `runtimeClassName: gvisor` replaces it
# with a boundary a layer down: syscalls are served by gVisor's user-space
# kernel, not the host's, so an escape must break gVisor before it reaches a
# node shared with another tenant. Without the sandbox this file would be a
# straightforward downgrade; with it, the defence moved rather than left.
#
# WHAT THE SANDBOX COSTS, so nobody rediscovers it as a mystery:
#   * syscall-heavy work is slower. Measure with
#     kubernetes/benchmarks/gvisor-overhead.yaml rather than trusting a number.
#   * no GPU. A GPU profile needs its own unsandboxed pool and its own trust
#     decision.
#   * no Docker-in-pod. Agents that must build an image submit to Cloud Build,
#     which is what this repository already does for its own images.
#
# UNCHANGED FROM v1, AND STILL LOAD-BEARING
#   `command` is ABSENT. The image ENTRYPOINT starts the WORKER, which validates
#   its fencing generation, restores the checkpoint and only then starts the
#   runner as a supervised child. Setting `command` would start the runner
#   directly -- no fencing, no checkpointing, no heartbeat, no lease release.
#
#   `backoffLimit: 0`. A retry is a new attempt with a new generation, minted
#   inside the admission transaction. A Kubernetes retry would re-run under the
#   OLD generation against a lease that may already have been reissued: two
#   agents, one task.
#
#   `requests == limits`, including ephemeral-storage. Bursting is what gets a
#   two-hour agent OOM-killed at minute ninety.
#
#   `safe-to-evict: "false"`. Autopilot extended run time, honoured only on
#   on-demand capacity -- the concrete reason Spot is banned platform-wide.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-scheduler
    swarm-tenant: __TENANT_ID__
    swarm-profile: __RUNNER_PROFILE__
    swarm-task: __TASK_LABEL__
    swarm-runtime: gvisor
    app.kubernetes.io/part-of: swarm
    app.kubernetes.io/component: agent-worker
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    swarm.saga.xyz/task-id: __TASK_ID__
    swarm.saga.xyz/attempt-id: __ATTEMPT_ID__
    swarm.saga.xyz/generation: "__GENERATION__"
    # Which subscription account the broker assigned. Recorded here as well as
    # on the lease so `kubectl describe` answers "which account is this agent
    # burning?" without a Firestore lookup -- the first question asked when one
    # account is exhausted and others are not.
    swarm.saga.xyz/account: __ACCOUNT_LABEL__
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  # Later than the worker's TASK_TIMEOUT_SECONDS; see worker-job.yaml.
  activeDeadlineSeconds: __ACTIVE_DEADLINE_SECONDS__
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        managed-by: swarm-scheduler
        swarm-tenant: __TENANT_ID__
        swarm-task: __TASK_LABEL__
        swarm-runtime: gvisor
        app.kubernetes.io/part-of: swarm
        app.kubernetes.io/component: agent-worker
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      # THE LOAD-BEARING LINE IN THIS FILE. Without it, every securityContext
      # below is a plain privilege grant on a shared node.
      runtimeClassName: gvisor
      restartPolicy: Never
      serviceAccountName: __KSA_NAME__
      # The worker never calls the Kubernetes API.
      automountServiceAccountToken: false
      # Longer than the worker's own grace period, or the kubelet kills the pod
      # while it is still uploading the checkpoint that makes an interruption
      # cheap.
      terminationGracePeriodSeconds: 120
      securityContext:
        # Root, and stated once here rather than implied by omission.
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      # NO INIT CONTAINER, deliberately (docs/BUILD_PROMPT_V2.md §2.6.3,
      # amended 2026-10-01). There used to be one, `install-credential`, and it
      # ran /usr/local/bin/swarm-install-credential -- which no Dockerfile under
      # images/ installs, so every pod rendered with `--runtime gvisor` failed
      # at init before the worker ever started. The design it stood for was
      # never built: the worker process itself asks the broker for an account
      # at start, reads the credential under the tenant's own GSA through
      # Workload Identity, and hands it only to the agent child's environment
      # (agent_worker/lifecycle.py::Worker._lease_account and
      # ::_account_credential_env). That is the same on Cloud Run and on GKE,
      # which is why it lives in the worker rather than in a pod spec only one
      # backend has. No account to lease is the worker's to decide, too: it
      # falls back to the tenant secret or parks the attempt, rather than a pod
      # dying at init over the pool.
      # test_every_command_a_worker_template_runs_is_a_binary_some_image_installs
      # holds any container added back to a binary an image actually ships.
      containers:
        - name: worker
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            # Root with a writable root filesystem -- the point of v2.
            runAsUser: 0
            readOnlyRootFilesystem: false
            # Still refused, because nothing an agent legitimately does needs
            # them and gVisor is not a reason to stop asking. Privilege
            # escalation beyond root buys an attacker capabilities root does not
            # already have; SYS_ADMIN and friends are what container escapes are
            # written against.
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop: ["ALL"]
              # apt, npm and git need none of these. If a tool genuinely does,
              # add it HERE with a comment naming the tool -- never by moving to
              # privileged.
              add: []
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "__CPU__"
              memory: __MEMORY__
              ephemeral-storage: __EPHEMERAL__
            limits:
              cpu: "__CPU__"
              memory: __MEMORY__
              ephemeral-storage: __EPHEMERAL__
          env:
            # Identifiers only. The worker reads WHAT to run from the frozen
            # catalogue keyed by RUNNER_PROFILE, so a doctored environment
            # cannot change the image, the command or the resource spec.
            - name: TASK_ID
              value: __TASK_ID__
            - name: ATTEMPT_ID
              value: __ATTEMPT_ID__
            - name: LEASE_ID
              value: __LEASE_ID__
            - name: GENERATION
              value: "__GENERATION__"
            - name: TENANT_ID
              value: __TENANT_ID__
            - name: RUNNER_PROFILE
              value: __RUNNER_PROFILE__
            - name: ACCOUNT_LABEL
              value: __ACCOUNT_LABEL__
            - name: PROJECT_ID
              value: __PROJECT_ID__
            - name: REGION
              value: __REGION__
            - name: FIRESTORE_DATABASE
              value: __FIRESTORE_DATABASE__
            - name: ARTIFACT_BUCKET
              value: __ARTIFACT_BUCKET__
            - name: WORKSPACE_ROOT
              value: /workspace
            # INERT UNDER THE WORKER LIFECYCLE, and kept only as a fallback.
            #
            # CORRECTED 2026-09-24 (incident wf_ebb3ab2d65664707a559). This note
            # used to say that without this variable the agent writes its
            # artifact tree to `/artifacts` on the writable layer here, outside
            # the `workspace` emptyDir, and gets evicted for ephemeral-storage.
            # That is only true of a runner started DIRECTLY. This template sets
            # no `command` on this container (the header's "UNCHANGED FROM v1"),
            # so the image ENTRYPOINT -- the worker lifecycle -- runs, and the
            # lifecycle gives its runner child SWARM_ARTIFACTS_DIR itself, per
            # attempt, under WORKSPACE_ROOT, from an allowlist that never passes
            # this value through. The `/artifacts` crash on v1 was a symptom of
            # the scheduler's GKE Job overriding `command` and replacing the
            # lifecycle, not of this variable being absent.
            #
            # What this entry still does: a runner started BY HAND in this
            # container, during an incident, writes inside the `workspace`
            # volume -- which carries `sizeLimit: __DISK__` -- rather than on
            # the container's writable layer.
            #
            # It belongs on THIS container. It once sat by mistake on the
            # since-removed `install-credential` init container, which never
            # wrote an artifact: a variable that decides where a process writes
            # is set on the process that writes.
            - name: SWARM_ARTIFACTS_DIR
              value: /workspace/artifacts
            # Points Claude Code at a directory this pod owns. Verified against
            # the Claude Code 2.1.274 binary: on non-macOS the credential is a
            # plaintext JSON file at <config dir>/.credentials.json, mode 0600,
            # and CLAUDE_CONFIG_DIR relocates it. This is what gives the
            # credential exactly one owner and lets it die with the pod.
            - name: CLAUDE_CONFIG_DIR
              value: /work/.claude
            - name: HOME
              value: /work
            - name: CHECKPOINT_INTERVAL_SECONDS
              value: "__CHECKPOINT_INTERVAL_SECONDS__"
            - name: MAX_IN_WORKER_RETRY_DELAY_SECONDS
              value: "__MAX_IN_WORKER_RETRY_DELAY_SECONDS__"
            - name: TASK_TIMEOUT_SECONDS
              value: "__TIMEOUT_SECONDS__"
            # The metadata server BY ADDRESS; see worker-job.yaml. This is the
            # pod's only container, and the worker is the process that talks to
            # the metadata server -- including to read the account credential,
            # which no init container installs any more.
            - name: GCE_METADATA_HOST
              value: "169.254.169.254"
            - name: GCE_METADATA_IP
              value: "169.254.169.254"
            # NO PROVIDER KEY IS PROJECTED HERE, and root makes this stricter
            # rather than looser. Every process in this container is uid 0, so
            # anything in the worker's environment is readable at /proc/1/environ
            # by the runner child and by anything the agent spawns. The worker
            # puts the credential only into the environment of the single child
            # that needs it.
          # NO LIVENESS OR READINESS PROBE, deliberately. Both used to exec
          # /usr/local/bin/swarm-healthcheck, which no Dockerfile under images/
          # installs, so on this template every probe failed and the kubelet
          # killed a healthy worker. A dead worker is covered without one: the
          # worker IS the container's main process, so a crash ends the pod and
          # the Job (restartPolicy Never) fails it; a live-but-wedged agent is
          # the stall guard's case; and activeDeadlineSeconds bounds the rest.
          # Readiness gates Service traffic, and no Service selects a worker.
          # test_every_command_a_worker_template_runs_is_a_binary_some_image_installs holds any
          # probe added back to a binary an image actually ships.
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        # Ephemeral, per BUILD_PROMPT_V2 §2.3: no volume to provision, leak or
        # pay for, and a restart resumes from the GCS checkpoint instead.
        - name: workspace
          emptyDir:
            sizeLimit: __DISK__
        # HOME and CLAUDE_CONFIG_DIR. Separate from the workspace so a
        # checkpoint of the workspace never sweeps up the credential -- a
        # checkpoint goes to the tenant's GCS prefix, and a credential does not
        # belong there.
        - name: work
          emptyDir:
            sizeLimit: __HOME_DISK__
        - name: tmp
          emptyDir:
            sizeLimit: __TMP_DISK__
