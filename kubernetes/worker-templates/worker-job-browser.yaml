# The browser worker Job: `worker-job.yaml` plus shared memory for Chromium.
#
# The `browser` profile is the reason the GKE path exists at all. Chromium's
# renderer processes communicate through /dev/shm, and the container runtime
# default of 64 MiB is what makes headless Chrome crash under load with
# "Target closed" -- an error that looks like a flaky site and is not. Cloud Run
# gives no way to size /dev/shm, so the frozen catalogue pins this profile to
# Autopilot, where an `emptyDir` with `medium: Memory` mounted at /dev/shm can
# be sized directly.
#
# That emptyDir counts against the container's memory limit, which is why the
# `browser` resource class is 16 GiB rather than 8: 2 GiB of it is shared memory
# before Chromium has allocated a single tab.
#
# Chromium's own sandbox stays OFF, and the runner passes
# `chromium_sandbox=False`. It needs user namespaces and CAP_SYS_ADMIN, and this
# pod drops every capability. The isolation here is the pod and the namespace --
# non-root, no privilege escalation, seccomp RuntimeDefault, default-deny
# NetworkPolicy -- not Chromium's inner sandbox, and handing a capability back to
# regain the latter would be a bad trade.
#
# `readOnlyRootFilesystem` is true here as well; Chromium writes its profile and
# crash dumps under $HOME, which is a writable emptyDir, and its browser bundle
# -- at the path the image's own `ENV PLAYWRIGHT_BROWSERS_PATH` names -- is read
# at runtime and never written.
#
# THAT VARIABLE IS DELIBERATELY NOT IN `env:` BELOW. It used to be, as a second
# copy of what images/agent-runtime-browser/Dockerfile sets next to the
# `playwright install` that puts the browser there. The dispatcher's copy of
# this Job never carried it, so the two already disagreed, and a second copy of
# one value is the drift docs/mirrored-values.md records. The image is the only
# place it can be correct. The runner child still gets it: the worker lifecycle
# carries it BY NAME from its own environment (`lifecycle._build_child_env`,
# #37), and that environment has it from the image, not from this file.
# tests/unit/worker/test_kubernetes_manifests.py fails if any worker Job
# restates a variable that image sets, or if the path appears as a value
# anywhere under apps/, kubernetes/ or terraform/.
apiVersion: batch/v1
kind: Job
metadata:
  name: __JOB_NAME__
  namespace: __NAMESPACE__
  labels:
    managed-by: swarm-scheduler
    swarm-tenant: __TENANT_ID__
    swarm-profile: __RUNNER_PROFILE__
    swarm-task: __TASK_LABEL__
    app.kubernetes.io/part-of: swarm
    app.kubernetes.io/component: agent-worker
  annotations:
    cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    swarm.saga.xyz/task-id: __TASK_ID__
    swarm.saga.xyz/attempt-id: __ATTEMPT_ID__
    swarm.saga.xyz/generation: "__GENERATION__"
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  # Later than the worker's TASK_TIMEOUT_SECONDS; see worker-job.yaml. On this
  # template it mattered most: Autopilot provisions a node and pulls the
  # browser image before the worker starts its own clock.
  activeDeadlineSeconds: __ACTIVE_DEADLINE_SECONDS__
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        managed-by: swarm-scheduler
        swarm-tenant: __TENANT_ID__
        swarm-task: __TASK_LABEL__
        app.kubernetes.io/part-of: swarm
        app.kubernetes.io/component: agent-worker
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      restartPolicy: Never
      serviceAccountName: __KSA_NAME__
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: "__CPU__"
              memory: __MEMORY__
              ephemeral-storage: __DISK__
            limits:
              cpu: "__CPU__"
              memory: __MEMORY__
              ephemeral-storage: __DISK__
          env:
            # INERT UNDER THE WORKER LIFECYCLE, and kept only as a fallback.
            #
            # On 2026-09-24 the first browser pod ever started died with
            #
            #     OSError: [Errno 30] Read-only file system: '/artifacts'
            #
            # because `runners/base.py` defaults `artifacts_dir` to
            # `work.parent / "artifacts"` -- `/artifacts` from a cwd of
            # `/workspace` -- on this read-only root.
            #
            # CORRECTED (incident wf_ebb3ab2d65664707a559). This note used to
            # say Cloud Run never showed the crash because it ran "the identical
            # `python -m agent_worker.runners.<x>` command" on a writable root.
            # It did not run the same command. Terraform's Cloud Run Jobs set
            # no `command`, so the image ENTRYPOINT -- `tini -- python -m
            # agent_worker`, the worker lifecycle -- ran, and the lifecycle gives
            # its runner child SWARM_ARTIFACTS_DIR=<workspace>/<attempt>/artifacts
            # itself. The scheduler's GKE Job set `command` to the RUNNER, which
            # replaced the lifecycle; nothing set the variable because nothing
            # that sets it was running. The crash was the first symptom of a
            # missing lifecycle, not of a missing variable. This template has
            # never set `command` (see worker-job.yaml's header); the
            # dispatcher's copy of this Job now does not either, and
            # tests/unit/worker/test_kubernetes_manifests.py asserts the two
            # agree.
            #
            # So this entry is not what makes the runner work. The lifecycle
            # builds its child's environment from an allowlist and never passes
            # this value through. It stays because it is harmless and because a
            # runner started BY HAND in this container, during an incident,
            # then gets a writable path inside the `workspace` volume -- whose
            # size limit already derives from `__DISK__` -- instead of Errno 30.
            - name: SWARM_ARTIFACTS_DIR
              value: /workspace/artifacts
            - name: TASK_ID
              value: __TASK_ID__
            - name: ATTEMPT_ID
              value: __ATTEMPT_ID__
            - name: LEASE_ID
              value: __LEASE_ID__
            - name: GENERATION
              value: "__GENERATION__"
            - name: TENANT_ID
              value: __TENANT_ID__
            - name: RUNNER_PROFILE
              value: __RUNNER_PROFILE__
            - name: PROJECT_ID
              value: __PROJECT_ID__
            - name: REGION
              value: __REGION__
            - name: FIRESTORE_DATABASE
              value: __FIRESTORE_DATABASE__
            - name: ARTIFACT_BUCKET
              value: __ARTIFACT_BUCKET__
            - name: WORKSPACE_ROOT
              value: /workspace
            - name: CHECKPOINT_INTERVAL_SECONDS
              value: "__CHECKPOINT_INTERVAL_SECONDS__"
            - name: MAX_IN_WORKER_RETRY_DELAY_SECONDS
              value: "__MAX_IN_WORKER_RETRY_DELAY_SECONDS__"
            - name: TASK_TIMEOUT_SECONDS
              value: "__TIMEOUT_SECONDS__"
            # NO PROVIDER KEY IS PROJECTED HERE, deliberately.
            #
            # Every process in this container runs as uid 10001, so anything in
            # the worker's own environment is readable at /proc/1/environ by the
            # runner child, by anything the agent spawns, and by a `cat`. A
            # `secretKeyRef` entry would hand the tenant's provider key to every
            # one of them, and the env allowlist in `workspace.child_env` cannot
            # take back what the container was started with.
            #
            # The worker reads the key from Secret Manager itself, as the
            # tenant's own GSA through Workload Identity (that GSA holds
            # secretAccessor on exactly `swarm-tenant-<tenant>-<provider>` and
            # nothing else), and puts it only into the environment of the single
            # child that needs it. A `secretKeyRef` would also have named a
            # KUBERNETES Secret, and nothing in this repository creates one.
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/swarm
      volumes:
        - name: workspace
          emptyDir:
            sizeLimit: __DISK__
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: home
          emptyDir:
            sizeLimit: 4Gi
