# Post-deploy acceptance of dev: warm, smoke, the GKE proof and the
# acceptance suite, judged against exactly what dev runs.
#
# WHY A WORKFLOW OF ITS OWN (owner decision 2026-10-08, cuts A and C of the
# release timing report; docs/ci.md, "The release timeline"). Measured that
# day over 22 successful release.yml runs: the `release-dev` concurrency lock
# was held 100 min p50 -- verify 26.4, deploy and smoke 23.6 (warm 11.4, smoke
# 9-14, GKE proof 3.5) and acceptance 45.4 (five groups one after another:
# mock 8-12, generic 6-8, claude-code 4-7, workflow ~13, browser 2-3). New
# digests were live 43 min after the run started; the other 71 min held the
# lock while every later push queued behind it. Everything here proves what is
# ALREADY deployed, so none of it needs that lock: release.yml now ends at its
# deploy on dev, and this file starts when it completes.
#
# IT JUDGES WHAT IS DEPLOYED, NOT WHAT TRIGGERED IT. `what dev runs` reads the
# SHA from releases/dev/applied.json in the state bucket -- the record the
# release lanes write after every successful apply (scripts/lib/
# release-order.sh `deployed`) -- and every later job checks out THAT commit,
# so the suite's fixtures and the scripts that drive it are the deployed
# commit's. The run's summary names it. A completed release run is accepted
# only when applied.json names that very run: a release a newer commit
# superseded, or a prod release (which records nothing for dev), accepts
# nothing. A dispatch accepts whatever dev runs now.
#
# ONLY THE NEWEST DEPLOYMENT IS WORTH ACCEPTING, AND ONLY A RUN THAT WILL
# ACCEPT MAY CANCEL ONE. Deciding and accepting are split: `target` carries NO
# concurrency, so a completion that accepts nothing (a superseded release, a
# failed one, a prod one) runs it, decides accept=false and ends without
# touching anything. A workflow-level `accept-dev` group used to be joined by
# every completion, so such a run cancelled a real in-flight acceptance and
# then accepted nothing, leaving the deployed SHA unaccepted with no signal.
# Only the accepting jobs (those that run when accept is true) carry
# `cancel-in-progress` groups. Each job has its OWN group, `accept-dev-<job>`:
# one shared group would make sibling jobs of the same run cancel each other
# (a job-level group cancels any other job in it, this run's included). A prod
# release is recognised by its run-name (`release prod <ref>`, release.yml),
# the one place a workflow_run event carries the dispatch's inputs.
#
# A GITHUB CANCEL DOES NOT STOP CLOUD RUN. Cancelling a job kills the
# `gcloud run jobs execute --wait` client, not the swarm-verify execution,
# which keeps submitting tasks to the smoke tenant (ceiling 20). So `quiesce`
# runs first in every accepting run: it cancels the other in-progress accept
# runs (so an old run cannot start a later wave under the new one) and CANCELS
# the running swarm-verify executions. Cancel rather than wait: a wait of up to
# a wave (~13 min) buys nothing, because the old run is about to be judged
# stale, and its results are never reported. Each job that runs the suite also
# has an `if: cancelled()` step that cancels the executions it started.
#
# A RED ACCEPTANCE IS AN ISSUE, NOT A BLOCKED DEPLOY. `report` opens -- or,
# when one is open, retitles and comments on -- ONE issue labelled bug naming
# the SHA and the failing groups (scripts/accept-report.sh). The next push
# deploys regardless; that is the trade the owner made.
#
# PROD IS NOT HERE. Acceptance never ran on prod (it spends subscription quota
# and opens real pull requests on the sandbox), so there was no
# acceptance-before-prod gate to keep; prod's warm, smoke and GKE proof still
# run inside release.yml's prod deploy, behind `approval (prod)`, unchanged.
#
# ITS IDENTITY IS NOT THE DEPLOYER. Every job that reaches Google federates as
# vars.GCP_ACCEPT_SA, an account terraform/bootstrap/acceptance.tf binds to
# THIS file on refs/heads/main and nothing else, holding only what this file
# does: execute the swarm-verify job and the per-tenant worker jobs (the
# suites run INSIDE the VPC as swarm-verify, which has its own identity),
# read run state, read the swarm-verify log view, and read releases/ in the
# state bucket. It cannot plan, apply, promote or touch IAM. accept.yml is
# therefore NOT in wif.tf's deployer_workflows, and
# tests/unit/scripts/test_workflow_id_token_scope.py holds that. The binding
# is in the bootstrap layer, which the owner applies: until it is, `what dev
# runs` fails at authentication, and `report` files that as the red group.
#
# HOW THE SUITE IS SPLIT. Six of the seven groups run as matrix jobs, one
# swarm-verify execution each, in TWO WAVES rather than six at once (the
# seventh, live-browser, runs on a schedule: below): the smoke tenant's
# ceiling is 20 concurrent tasks (terraform/environments/dev/dev.tfvars,
# tenants.smoke, max_active = capacity_units = 20), and the groups' peaks
# summed are about 37 (mock submits 12 tasks and a workflow at once, generic
# 8, workflow 4 roots, claude-code 3, browser 3, live-browser 1, git-tools 5).
# Wave 1 is the three longest or heaviest -- mock, workflow, browser, a peak
# of ~20 -- and wave 2 the rest -- generic, claude-code, git-tools, ~16.
# Over the ceiling a task QUEUES (invariant
# 1: queued costs nothing), so a burst would not fail outright, but every
# check has a settle deadline and the queue would eat into it. So acceptance
# takes about the longest of wave 1 (workflow, ~13 min) plus the longest of
# wave 2 (generic, ~8), against 45.4 serially.
#
# LIVE-BROWSER IS OFF THE RED PATH (owner decision 2026-10-14, lane
# SPEED-C2). Of 43 completed runs of this file, 21 failed; the live-browser
# job failed 18 of 34, every other group 0-3, and every red run updated the
# one acceptance issue. So it is not in either wave: the `live-browser` job
# runs it every three hours (and on a dispatch with scope `live-browser`)
# against whatever dev runs, and `live-browser-report` files its OWN issue
# (scripts/accept-report.sh, ACCEPT_KIND=live-browser). Neither is an
# accepting job: the schedule decides nothing about a deployment, so it has
# no quiesce and cancels nothing, and its concurrency group is not an
# `accept-dev-` one. A post-release run's quiesce DOES cancel a scheduled run
# in flight (both runs belong to this file); a cancelled scheduled run files
# nothing and does not count. It returns to wave 2 when
# scripts/accept-live-browser-streak.sh says it passed five scheduled runs in
# a row (docs/ci.md, "live-browser runs on a schedule"). Its peak of 1 fits
# beside either wave if the two overlap.
#
# THE TENANT ISOLATION PROBE IS REPORT-ONLY UNTIL THE CUTOVER (owner decision
# 2026-10-20, lane ISO-ACCEPT-WIRE). `acceptance (tenant-isolation)` runs on
# every accepting run, beside wave 2, and stays green whatever the probe says
# until the repository variable ISO_PROBE_REQUIRED is 'true' (the job, below).

name: accept

on:
  workflow_run:
    workflows: [release]
    types: [completed]
    branches: [main]
  # Accept whatever dev runs now, e.g. after a hotfix (hotfix.yml) or to retry
  # a red run. Main only: the identity is bound to this file on main.
  # scope live-browser runs only the scheduled group (below), now.
  workflow_dispatch:
    inputs:
      scope:
        description: all = the post-release acceptance; live-browser = only the scheduled live-browser group
        type: choice
        options: [all, live-browser]
        default: all
  # The live-browser group, off the red path (header). Every three hours, at
  # :41 to stay off the top of the hour GitHub's scheduler is busiest at.
  # A schedule runs on the default branch, so the identity binding (this
  # file on refs/heads/main) holds; a separate workflow file would not get it.
  schedule:
    - cron: '41 */3 * * *'

permissions:
  contents: read

env:
  ENVIRONMENT: dev
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

# RUNNERS (owner decision 2026-10-14). A job that holds no cloud identity
# (id-token) runs on the self-hosted `bogdan-ci` VMs through the one guarded
# `runs-on` expression, in its SHORT form: only the repo variable
# SELF_HOSTED_CI set to `off` (the capacity escape hatch) sends it to
# GitHub-hosted ubuntu-24.04. The fork-PR clause the other workflows carry is
# left out on purpose: this workflow starts only from a completed release on
# main or by hand, never from a pull request, so no fork's code can reach it
# (test_fork_prs_off_self_hosted.py checks the triggers). Every job that stays
# hosted is listed, with why, in that test.
jobs:
  # -------------------------------------------------------------------------
  # What dev runs, and whether this run should judge it.
  # -------------------------------------------------------------------------
  target:
    name: what dev runs
    runs-on: ubuntu-24.04
    # Not on the schedule, nor on a dispatch for the live-browser group alone:
    # those run `live-browser` and accept nothing.
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' && inputs.scope != 'live-browser' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || !startsWith(github.event.workflow_run.display_title, 'release prod ')))) }}
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.deployed.outputs.sha }}
      accept: ${{ steps.decide.outputs.accept }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ACCEPT_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: read the deployed SHA from releases/dev/applied.json
        id: deployed
        run: ./scripts/lib/release-order.sh deployed --environment "${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: decide whether this run judges it
        # On a completed release, only when THAT run applied what dev runs:
        # a superseded release, or a prod one, accepts nothing and ends green.
        id: decide
        env:
          SHA: ${{ steps.deployed.outputs.sha }}
          APPLIED_RUN: ${{ steps.deployed.outputs.run_id }}
          APPLIED_BY: ${{ steps.deployed.outputs.workflow }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          accept=true
          # Accept when applied.json names this very run, OR the very commit
          # the run built: a hotfix re-applying the same SHA records a
          # different run id, and the SHA is still unaccepted.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] && [ "${APPLIED_RUN}" != "${TRIGGER_RUN}" ] && [ "${SHA}" != "${TRIGGER_SHA}" ]; then
            accept=false
            echo "::notice title=Nothing to accept::release run ${TRIGGER_RUN} (${TRIGGER_SHA}) did not apply what dev runs: applied.json names ${SHA}, applied by ${APPLIED_BY:-?} run ${APPLIED_RUN:-?}. That run's own completion accepts it."
          fi
          echo "accept=${accept}" >> "$GITHUB_OUTPUT"
          {
            if [ "${accept}" = true ]; then
              echo "### Accepting \`${SHA}\` on dev"
            else
              echo "### Not accepting: dev runs \`${SHA}\`, which this release did not apply"
            fi
            echo
            echo "releases/dev/applied.json: applied by ${APPLIED_BY:-?} run ${APPLIED_RUN:-?}."
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # Stop what an earlier acceptance left running, before this one starts.
  # Runs only when `target` decided to accept. See the header: cancelling a
  # GitHub job leaves its swarm-verify Cloud Run execution running, and two
  # acceptances at once overlap in the smoke tenant (ceiling 20) and produce
  # false reds.
  # -------------------------------------------------------------------------
  quiesce:
    name: stop an earlier acceptance
    runs-on: ubuntu-24.04
    needs: [target]
    if: needs.target.outputs.accept == 'true'
    concurrency:
      group: accept-dev-quiesce
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      # Cancel the other in-progress runs of this workflow.
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ACCEPT_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: cancel the other in-progress accept runs
        # Newest deployment wins, as the group used to say. Without this an
        # old run's later wave would start under this run's wave 1.
        env:
          GH_TOKEN: ${{ github.token }}
          THIS_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for status in in_progress queued; do
            gh run list --workflow accept.yml --status "${status}" --json databaseId --jq '.[].databaseId' --limit 50 \
              | while read -r id; do
                  if [ -n "${id}" ] && [ "${id}" != "${THIS_RUN}" ]; then
                    echo "cancelling accept run ${id}"
                    gh run cancel "${id}" || echo "::warning title=Not cancelled::accept run ${id} could not be cancelled"
                  fi
                done
          done

      - name: cancel the swarm-verify executions still running
        run: |
          set -euo pipefail
          gcloud run jobs executions list --job swarm-verify --region "${REGION}" --project "${PROJECT_ID}" \
            --filter 'status.runningCount>0' --format 'value(metadata.name)' > running.txt
          n=0
          while read -r name; do
            [ -n "${name}" ] || continue
            echo "cancelling swarm-verify execution ${name}"
            # An execution can finish between the list above and this cancel;
            # gcloud then answers "Failed to cancel" for one that is already
            # done (run 38072148450, 2026-10-10: swarm-verify-zkzcx). A failed
            # cancel is fine only if the execution is no longer running.
            if ! gcloud run jobs executions cancel "${name}" --region "${REGION}" --project "${PROJECT_ID}" --quiet; then
              running="$(gcloud run jobs executions describe "${name}" --region "${REGION}" --project "${PROJECT_ID}" \
                --format 'value(status.runningCount)')"
              if [ -n "${running}" ] && [ "${running}" != "0" ]; then
                echo "::error::swarm-verify execution ${name} is still running (${running}) and would not cancel"
                exit 1
              fi
              echo "${name} had already finished; nothing to cancel"
            fi
            n=$((n + 1))
          done < running.txt
          echo "cancelled ${n} running swarm-verify execution(s)"

  # -------------------------------------------------------------------------
  # Warm, smoke and the GKE proof: release.yml's dev deploy steps until
  # 2026-10-08, unchanged but for where they run and the commit they read.
  # -------------------------------------------------------------------------
  smoke:
    name: warm, smoke and GKE proof (dev)
    runs-on: ubuntu-24.04
    needs: [target, quiesce]
    if: needs.target.outputs.accept == 'true'
    concurrency:
      group: accept-dev-smoke
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ACCEPT_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: note when this job starts
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: warm each Cloud Run worker job once on its new digest
        # #363: the first execution of each Cloud Run job after a new digest
        # spends 30-59 s importing the image. One `--self-test` execution per
        # per-tenant worker job pays it here, before the smoke test and before
        # acceptance. A failed warm run is a slower first task, not a broken
        # deployment: the script warns and exits 0, and continue-on-error
        # keeps a refused name (its only non-zero exit) from failing the run.
        continue-on-error: true
        timeout-minutes: 30
        run: ./scripts/warm-jobs.sh

      - name: smoke test (inside the VPC)
        # The `mock` profile needs no provider key, so this proves submit,
        # admit, dispatch, run and release without any tenant's credential.
        # verify-remote.sh executes scripts/smoke-test.sh in the swarm-verify
        # Cloud Run job, which IS in the VPC, and exits with its exit code.
        id: smoke
        run: ./scripts/verify-remote.sh smoke-test

      - name: prove GKE dispatch with one browser task
        # docs/incidents/2026-09-24-gke-dispatch.md section 5. Runs even when
        # the smoke test failed -- the two paths share nothing below the API,
        # so that is when this diagnosis is worth most -- but not after a
        # cancel. SWITCHED BY vars.PROVE_GKE_DISPATCH, off until the owner
        # restores browser admission; when off it SAYS it skipped.
        if: ${{ !cancelled() }}
        env:
          PROVE_GKE_DISPATCH: ${{ vars.PROVE_GKE_DISPATCH }}
        run: |
          if [ "${PROVE_GKE_DISPATCH}" != "true" ]; then
            echo "::notice title=GKE proof skipped::vars.PROVE_GKE_DISPATCH is not 'true' -- browser admission is paused; nothing about GKE was proven by this acceptance."
            exit 0
          fi
          ./scripts/verify-remote.sh prove-gke-dispatch

      - name: cancel the executions this job started
        # A cancel stops the client, not the Cloud Run execution (header).
        # Cancels the swarm-verify executions created since this job started.
        if: ${{ cancelled() }}
        continue-on-error: true
        env:
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          [ -n "${STARTED}" ] || exit 0
          gcloud run jobs executions list --job swarm-verify --region "${REGION}" --project "${PROJECT_ID}" \
            --filter 'status.runningCount>0' --format 'value(metadata.name,metadata.creationTimestamp)' \
            | while read -r name created; do
                if [ -n "${name}" ] && [[ "${created}" > "${STARTED}" ]]; then
                  gcloud run jobs executions cancel "${name}" --region "${REGION}" --project "${PROJECT_ID}" --quiet || true
                fi
              done

  # -------------------------------------------------------------------------
  # THE SANDBOX'S TOKEN, the repository secret SWARM_SANDBOX_GITHUB_TOKEN, is
  # handed to the sync, the read-back and the sweep only, and never to the
  # suite: the swarm-verify job holds no GitHub credential. The sync writes
  # the deployed commit's tests/acceptance/fixtures/ to the private sandbox's
  # main ONCE, before any group starts (the groups clone it), so it is a job
  # of its own and not a step of each matrix job, which would race on one
  # branch. It needs no Google identity, so it runs beside `smoke`.
  # -------------------------------------------------------------------------
  sandbox:
    name: put the deployed commit's fixtures on the sandbox
    runs-on: ${{ vars.SELF_HOSTED_CI == 'off' && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    # The sandbox token (SWARM_SANDBOX_GITHUB_TOKEN) lives in environment
    # `repo-secrets`, whose deployment branches are `main` only (BGD,
    # 2026-10-23, REPO-SECRETS-ENV; docs/ci.md): a repository secret is read
    # by a workflow on ANY pushed branch, before any review or hold.
    # Every trigger here runs on main's ref -- workflow_run after release,
    # schedule, workflow_dispatch from main (`target` already requires it) --
    # so the rule admits them; a dispatch from another branch is refused, and
    # that is the point. `deployment: false`: no deployment record.
    # test_repo_secrets_environment.py.
    environment:
      name: repo-secrets
      deployment: false
    needs: [target, quiesce]
    if: needs.target.outputs.accept == 'true'
    concurrency:
      group: accept-dev-sandbox
      cancel-in-progress: true
    outputs:
      since: ${{ steps.started.outputs.at }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}

      # Before the sync, so github-verify.sh judges only the pull requests
      # this run's groups opened, not one an earlier, unswept run left.
      - name: note when acceptance starts
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: put the fixtures on the sandbox
        env:
          SWARM_ACCEPTANCE_GITHUB_TOKEN: ${{ secrets.SWARM_SANDBOX_GITHUB_TOKEN }}
        run: ./scripts/acceptance/sandbox-sync.sh

  # -------------------------------------------------------------------------
  # ACCEPTANCE: real tasks, judged by what they produced (owner decision,
  # 2026-09-29; docs/acceptance.md). One swarm-verify execution per group, in
  # the smoke tenant against the private sandbox (scripts/acceptance/
  # config.sh, #628). Two waves -- see the header for the ceiling that sets
  # them. fail-fast false: one red group must not cancel the others, and the
  # issue names every red group, not the first.
  #
  # Only after smoke succeeded, as before: a deployment that fails smoke
  # fails acceptance for the same reason, and smoke says it in a tenth of
  # the time.
  # -------------------------------------------------------------------------
  acceptance:
    name: acceptance (${{ matrix.group }})
    runs-on: ubuntu-24.04
    needs: [target, smoke, sandbox]
    if: ${{ !cancelled() && needs.target.outputs.accept == 'true' && needs.smoke.result == 'success' && needs.sandbox.result == 'success' }}
    concurrency:
      group: accept-dev-acceptance-${{ matrix.group }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        group: [mock, workflow, browser]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ACCEPT_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: note when this job starts
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: acceptance suite, one group (inside the VPC)
        env:
          GROUP: ${{ matrix.group }}
        run: ./scripts/verify-remote.sh "acceptance/${GROUP}"

      - name: cancel the executions this job started
        # A cancel stops the client, not the Cloud Run execution (header).
        # Cancels the swarm-verify executions created since this job started.
        if: ${{ cancelled() }}
        continue-on-error: true
        env:
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          [ -n "${STARTED}" ] || exit 0
          gcloud run jobs executions list --job swarm-verify --region "${REGION}" --project "${PROJECT_ID}" \
            --filter 'status.runningCount>0' --format 'value(metadata.name,metadata.creationTimestamp)' \
            | while read -r name created; do
                if [ -n "${name}" ] && [[ "${created}" > "${STARTED}" ]]; then
                  gcloud run jobs executions cancel "${name}" --region "${REGION}" --project "${PROJECT_ID}" --quiet || true
                fi
              done

  # Wave 2: starts when wave 1 has finished, whatever it concluded, so a red
  # group in wave 1 still lets wave 2 report its own.
  acceptance-2:
    name: acceptance (${{ matrix.group }})
    runs-on: ubuntu-24.04
    needs: [target, smoke, sandbox, acceptance]
    if: ${{ !cancelled() && needs.target.outputs.accept == 'true' && needs.smoke.result == 'success' && needs.sandbox.result == 'success' }}
    concurrency:
      group: accept-dev-acceptance-2-${{ matrix.group }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # live-browser left this wave on 2026-10-14 for the `live-browser`
        # job below; it comes back here when its streak says so.
        group: [generic, claude-code, git-tools]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ACCEPT_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: note when this job starts
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: acceptance suite, one group (inside the VPC)
        env:
          GROUP: ${{ matrix.group }}
        run: ./scripts/verify-remote.sh "acceptance/${GROUP}"

      - name: cancel the executions this job started
        # A cancel stops the client, not the Cloud Run execution (header).
        # Cancels the swarm-verify executions created since this job started.
        if: ${{ cancelled() }}
        continue-on-error: true
        env:
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          [ -n "${STARTED}" ] || exit 0
          gcloud run jobs executions list --job swarm-verify --region "${REGION}" --project "${PROJECT_ID}" \
            --filter 'status.runningCount>0' --format 'value(metadata.name,metadata.creationTimestamp)' \
            | while read -r name created; do
                if [ -n "${name}" ] && [[ "${created}" > "${STARTED}" ]]; then
                  gcloud run jobs executions cancel "${name}" --region "${REGION}" --project "${PROJECT_ID}" --quiet || true
                fi
              done

  # -------------------------------------------------------------------------
  # THE CROSS-TENANT FIRESTORE PROBE (owner decision 2026-10-20, lane
  # ISO-ACCEPT-WIRE, part of #1457; docs/ci.md, "The cross-tenant Firestore
  # probe is report-only until the cutover"). From a smoke worker, with that
  # worker's own credential, Firestore must refuse another tenant's documents
  # (tests/acceptance/fixtures/tenant-isolation/test_cross_tenant_firestore.py).
  # It is RED until the last tenant is cut over, by design, so it is
  # REPORT-ONLY while vars.ISO_PROBE_REQUIRED is not 'true': the probe's step
  # may fail, the job still concludes green, and so `report` neither sees a
  # failure in `needs` nor finds this job among the run's failing jobs -- it
  # cannot open or update the acceptance issue. The owner sets the variable
  # after the cutover (docs/runbooks/isolation-cutover.md); from then a red
  # probe fails the job, and the run's report files it. One agent: it runs
  # beside wave 2 (peak ~16 + 1 against smoke's 20), not wave 1 (~20).
  # -------------------------------------------------------------------------
  tenant-isolation:
    name: acceptance (tenant-isolation)
    runs-on: ubuntu-24.04
    needs: [target, smoke, sandbox, acceptance]
    if: ${{ !cancelled() && needs.target.outputs.accept == 'true' && needs.smoke.result == 'success' && needs.sandbox.result == 'success' }}
    concurrency:
      group: accept-dev-tenant-isolation
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ACCEPT_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: note when this job starts
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: the cross-tenant Firestore probe, in a smoke worker (inside the VPC)
        id: probe
        # Report-only unless the owner has set ISO_PROBE_REQUIRED=true.
        continue-on-error: ${{ vars.ISO_PROBE_REQUIRED != 'true' }}
        run: ./scripts/verify-remote.sh "acceptance/tenant-isolation"

      - name: report-only until ISO_PROBE_REQUIRED is true
        if: ${{ !cancelled() && steps.probe.outcome == 'failure' && vars.ISO_PROBE_REQUIRED != 'true' }}
        run: |
          echo "::warning title=Tenant isolation probe red (report-only)::A tenant's worker can still reach another tenant's Firestore documents, or the probe could not measure; the step above says which. Not filed: ISO_PROBE_REQUIRED is not true (docs/ci.md)."
          {
            echo "### Tenant isolation probe: red, report-only"
            echo
            echo "The cross-tenant Firestore probe did not pass. This job stays green and files nothing until the repository variable \`ISO_PROBE_REQUIRED\` is \`true\`, which the owner sets after the last tenant is cut over (docs/runbooks/isolation-cutover.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cancel the executions this job started
        # A cancel stops the client, not the Cloud Run execution (header).
        # Cancels the swarm-verify executions created since this job started.
        if: ${{ cancelled() }}
        continue-on-error: true
        env:
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          [ -n "${STARTED}" ] || exit 0
          gcloud run jobs executions list --job swarm-verify --region "${REGION}" --project "${PROJECT_ID}" \
            --filter 'status.runningCount>0' --format 'value(metadata.name,metadata.creationTimestamp)' \
            | while read -r name created; do
                if [ -n "${name}" ] && [[ "${created}" > "${STARTED}" ]]; then
                  gcloud run jobs executions cancel "${name}" --region "${REGION}" --project "${PROJECT_ID}" --quiet || true
                fi
              done

  # -------------------------------------------------------------------------
  # The suite cannot read the private sandbox back (swarm-verify holds no
  # GitHub token) and SKIPs those assertions; github-verify.sh makes them
  # here, with the sandbox token, before the sweep closes anything. A failure
  # there fails this job; the sweep still runs after it. github-cleanup.sh
  # closes only swarm/task_ branches whose changes lie entirely under
  # tests/acceptance/fixtures/.
  # -------------------------------------------------------------------------
  sandbox-results:
    name: read back and sweep the sandbox
    runs-on: ${{ vars.SELF_HOSTED_CI == 'off' && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    # The main-only environment that holds the secret: see the comment on
    # `sandbox` above (REPO-SECRETS-ENV).
    environment:
      name: repo-secrets
      deployment: false
    needs: [target, sandbox, acceptance, acceptance-2]
    if: ${{ !cancelled() && needs.sandbox.result == 'success' }}
    concurrency:
      group: accept-dev-sandbox-results
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: read the suite's pull requests back from the sandbox
        env:
          SWARM_ACCEPTANCE_GITHUB_TOKEN: ${{ secrets.SWARM_SANDBOX_GITHUB_TOKEN }}
          SWARM_ACCEPTANCE_SINCE: ${{ needs.sandbox.outputs.since }}
        run: ./scripts/acceptance/github-verify.sh

      - name: close the pull requests and branches the suite opened on the sandbox
        if: ${{ !cancelled() }}
        env:
          SWARM_ACCEPTANCE_GITHUB_TOKEN: ${{ secrets.SWARM_SANDBOX_GITHUB_TOKEN }}
        run: ./scripts/acceptance/github-cleanup.sh

  # -------------------------------------------------------------------------
  # Which SHA was accepted, in the summary; on red, ONE issue labelled bug
  # naming that SHA and every failing group (scripts/accept-report.sh). It
  # also runs when `what dev runs` itself failed -- an identity that cannot
  # authenticate is a red acceptance too. Not after a cancel: a newer
  # deployment's run replaced this one and reports for itself.
  #
  # If dev no longer runs the accepted SHA by the time this job looks (the
  # hotfix lane applied a newer commit mid-run), a red result is reported in
  # the summary and NOT filed: it judged a deployment that is gone.
  # -------------------------------------------------------------------------
  report:
    name: report what was accepted
    runs-on: ubuntu-24.04
    needs: [target, quiesce, smoke, sandbox, acceptance, acceptance-2, tenant-isolation, sandbox-results]
    # A job a newer acceptance cancelled (its group above) is not a red one:
    # no report from a run whose jobs were replaced.
    if: ${{ !cancelled() && !contains(needs.*.result, 'cancelled') && (needs.target.result == 'failure' || needs.target.outputs.accept == 'true') }}
    concurrency:
      group: accept-dev-report
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write
      # The failing matrix jobs' names, read from this run's job list.
      actions: read
      # The one place this workflow writes to GitHub.
      issues: write
    steps:
      - uses: actions/checkout@v5

      # Best effort: the re-read below is what tells a superseded run from a
      # red one, and without it the report still files.
      - id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ACCEPT_SA }}

      - uses: google-github-actions/setup-gcloud@v3
        if: steps.auth.outcome == 'success'

      - name: is the accepted SHA still what dev runs
        id: now
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        run: ./scripts/lib/release-order.sh deployed --environment "${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: summary, and an issue when red
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPT_SHA: ${{ needs.target.outputs.sha }}
          ACCEPT_NOW_SHA: ${{ steps.now.outputs.sha }}
          ACCEPT_NEEDS: ${{ toJSON(needs) }}
        run: ./scripts/accept-report.sh

  # -------------------------------------------------------------------------
  # THE LIVE-BROWSER GROUP, OFF THE RED PATH (header; owner decision
  # 2026-10-14). Every three hours, or on a dispatch with scope live-browser:
  # read what dev runs, check that commit out, run the one group, and file
  # any red on its OWN issue. No `target`, `quiesce`, smoke or sandbox sync:
  # it judges no deployment and cancels nothing, and the task clones the
  # sandbox's fixtures the last post-release run synced from what dev runs.
  # Nothing the post-release `report` needs, so it can never turn that run
  # red. scripts/accept-live-browser-streak.sh reads these runs' results.
  # -------------------------------------------------------------------------
  live-browser:
    name: acceptance (live-browser, scheduled)
    runs-on: ubuntu-24.04
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'live-browser')) }}
    concurrency:
      group: accept-live-browser
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.deployed.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_ACCEPT_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: read the deployed SHA from releases/dev/applied.json
        id: deployed
        run: ./scripts/lib/release-order.sh deployed --environment "${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      # The deployed commit's scripts, as the waves run them. clean: false
      # keeps the credentials file the auth step wrote into the workspace.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.deployed.outputs.sha }}
          clean: false

      - name: note when this job starts
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: acceptance suite, the live-browser group (inside the VPC)
        env:
          SHA: ${{ steps.deployed.outputs.sha }}
        run: |
          echo "### Scheduled live-browser acceptance of \`${SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          ./scripts/verify-remote.sh "acceptance/live-browser"

      - name: cancel the executions this job started
        # A cancel stops the client, not the Cloud Run execution (header).
        # Cancels the swarm-verify executions created since this job started.
        if: ${{ cancelled() }}
        continue-on-error: true
        env:
          STARTED: ${{ steps.started.outputs.at }}
        run: |
          [ -n "${STARTED}" ] || exit 0
          gcloud run jobs executions list --job swarm-verify --region "${REGION}" --project "${PROJECT_ID}" \
            --filter 'status.runningCount>0' --format 'value(metadata.name,metadata.creationTimestamp)' \
            | while read -r name created; do
                if [ -n "${name}" ] && [[ "${created}" > "${STARTED}" ]]; then
                  gcloud run jobs executions cancel "${name}" --region "${REGION}" --project "${PROJECT_ID}" --quiet || true
                fi
              done

  # On red, ONE issue labelled bug for the scheduled live-browser group, found
  # by its own marker -- never the post-release acceptance issue
  # (scripts/accept-report.sh, ACCEPT_KIND=live-browser). Not after a cancel:
  # a post-release run's quiesce cancels a scheduled run in flight, and that
  # says nothing about the group.
  live-browser-report:
    name: report the scheduled live-browser group
    runs-on: ${{ vars.SELF_HOSTED_CI == 'off' && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    needs: [live-browser]
    if: ${{ !cancelled() && needs.live-browser.result != 'skipped' }}
    concurrency:
      group: accept-live-browser-report
      cancel-in-progress: false
    permissions:
      contents: read
      # The failing job's name, read from this run's job list.
      actions: read
      # Its own issue.
      issues: write
    steps:
      - uses: actions/checkout@v5

      - name: summary, and its own issue when red
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPT_KIND: live-browser
          ACCEPT_SHA: ${{ needs.live-browser.outputs.sha }}
          ACCEPT_NEEDS: ${{ toJSON(needs) }}
        run: ./scripts/accept-report.sh
