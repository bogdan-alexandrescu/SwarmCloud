# A SwarmCloud pull request that goes red in CI gets a fix attempt, with no
# operator (#263).
#
# When `application` fails on a `swarm/<task-id>` branch, scripts/ci-fix.sh
# reads the failed jobs' log, passes it through `redact`, caps it, and submits
# a one-step `claude-code` workflow through the swarm API that continues that
# task's branch: the worker clones it, the agent fixes exactly that failure,
# the worker pushes the fix onto it, and the step stops. The push re-runs CI.
# At most MAX_FIX_ATTEMPTS per pull request (the script says why), each one a
# comment on the pull request; past that, one comment saying it stopped. When
# the fix step ends, swarm-api comments how it ended, with the tenant's own
# -git token (apps/swarm-api/swarm_api/cifix.py); nothing here waits for it.
# See docs/ci.md, "The CI fixer".
#
# WHY workflow_run AND NOT A JOB IN application.yml. A pull_request run cannot
# write to its pull request, its ref (refs/pull/<n>/merge) is refused by the
# Workload Identity pool's trust policy, and it runs the pull request's own
# workflow file. workflow_run runs THIS file as it is on
# main, with this repository's permissions -- which is why nothing below
# checks out, builds or runs the branch it is fixing, and why every field of
# the event reaches the shell through env, never pasted into a run: block.
#
# Only a branch of THIS repository qualifies. A fork can name a branch
# swarm/<anything>; its failures are not this platform's to fix.
#
# workflow_run only fires for a workflow file on the default branch, so this
# does nothing until it has merged.

name: ci-fix

on:
  workflow_run:
    workflows: [application]
    types: [completed]

permissions:
  contents: read
  # To comment on the pull request: every attempt, and every stop, is visible there.
  pull-requests: write
  # To read the failed run's log.
  actions: read
  # Workload Identity Federation, directly as SWARM_CI_FIX_SA.
  id-token: write

concurrency:
  # One fixer per branch at a time, and never cancelled: a cancelled run could
  # have submitted a fix step and died before commenting, which is an attempt
  # nobody can see.
  group: ci-fix-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

# RUNNERS (owner decision 2026-10-14). A job that holds no cloud identity
# (id-token) runs on the self-hosted `bogdan-ci` VMs through the one guarded
# `runs-on` expression: a fork's pull request, or the repo variable
# SELF_HOSTED_CI set to `off` (the capacity escape hatch), sends it to
# GitHub-hosted ubuntu-24.04 instead. Every job that stays hosted is listed,
# with why, in tests/unit/scripts/test_fork_prs_off_self_hosted.py.
jobs:
  fix:
    name: fix a red SwarmCloud pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # A pull request's run only (LANE CI-EARLY, part of #1694): a lane push
    # runs application.yml too, and the same red head would start two fixers.
    # A branch with no pull request was refused by ci-fix.sh anyway.
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.event == 'pull_request' && startsWith(github.event.workflow_run.head_branch, 'swarm/') && github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
      # main, for scripts/ci-fix.sh and scripts/lib/common.sh. NOT the branch
      # being fixed: its code runs in the fix step's container, never here.
      - uses: actions/checkout@v5

      # Only when the fixer is configured. Unconfigured, the script says so on
      # the pull request once and submits nothing, rather than failing here on
      # every red swarm branch.
      #
      # AS THE FIXER'S OWN ACCOUNT, NEVER THE DEPLOYER'S. terraform/bootstrap
      # (ci_fix.tf) binds SWARM_CI_FIX_SA to this workflow file on main and to
      # nothing else, through `attribute.job_workflow_ref`. This job never holds
      # the deployer's token, and no other workflow can become the fixer.
      # Owner decision, 2026-09-28.
      - id: auth
        if: ${{ vars.SWARM_CI_FIX_SA != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.SWARM_CI_FIX_SA }}

      - if: ${{ vars.SWARM_CI_FIX_SA != '' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: submit one fix attempt
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FIX_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_FIX_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_FIX_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          # The pull request GitHub itself associated with this run. GitHub
          # excludes a fork's pull requests from this list, so it is where the
          # pull request number comes from, never a `gh pr list --head`
          # search by branch name -- a fork author picks that name (#273
          # review).
          CI_FIX_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          # The identity whose access token passes the API's IAP front door,
          # and whose tenant owns the swarm tasks it fixes (docs/ci.md).
          SWARM_IMPERSONATE_SA: ${{ vars.SWARM_CI_FIX_SA }}
          # Empty resolves the front door from terraform/environments/<env>.
          API_HOST: ${{ vars.SWARM_API_HOST }}
        run: ./scripts/ci-fix.sh run
