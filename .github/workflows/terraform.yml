# Terraform checks on every pull request that touches infrastructure.
#
# This workflow PLANS and never applies. Applying is release.yml's job, behind a
# GitHub Environment approval, because saga-agents-staging is a SHARED project:
# a plan that would delete another team's cluster must be read by a person
# before anyone can approve it.
#
# Authentication is Workload Identity Federation. There are no downloadable
# service account keys in this repository, and none should ever be added -- a key
# is a credential with no expiry, no rotation and no record of where it was
# copied. See terraform/bootstrap/wif.tf, where the attribute condition pins both
# the repository and the allowed refs.

name: terraform

on:
  # Also on main, so a direct push is tested too. Without this the suite only
  # ever ran on pull requests, and a repository whose history landed straight
  # on main had never run its own tests once.
  push:
    branches: [main]
  pull_request:
    paths:
      - "terraform/**"
      - "tests/terraform/**"
      - "scripts/lib/plan-guard.sh"
      - "scripts/lib/destroy-guard.jq"
      - "scripts/lib/unlabelable-types.json"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write        # required to mint the WIF token
  # No `pull-requests: write`. It was granted "to post the plan summary" by a
  # step that could never run (see the `plan` job), so every run carried a
  # write token nothing used.

concurrency:
  # Terraform takes a state lock. Two runs of the same environment would have one
  # of them waiting on a lock for its whole timeout.
  group: terraform-${{ github.event.inputs.environment || 'dev' }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.2"
  TFLINT_VERSION: "v0.64.0"
  CHECKOV_VERSION: "3.3.17"
  TF_ROOT: terraform/infra

jobs:
  validate:
    name: fmt / validate / tflint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        # BOTH roots. `terraform fmt` takes one directory, and this step used to
        # name only `terraform`, so tests/terraform/ -- the 87 assertions the
        # `terraform test` job below depends on -- was the one Terraform in the
        # tree whose formatting nothing checked. `make lint` does the same two.
        run: |
          set -euo pipefail
          terraform fmt -check -recursive -diff terraform
          terraform fmt -check -recursive -diff tests/terraform

      - name: terraform init (no backend)
        # -backend=false validates configuration without touching remote state,
        # so this job needs no cloud credentials at all.
        run: terraform -chdir=${{ env.TF_ROOT }} init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir=${{ env.TF_ROOT }} validate

      - name: validate every module in isolation
        # A module that only validates through the root can hide a broken
        # variable default that a future caller would hit.
        run: |
          set -euo pipefail
          for dir in terraform/modules/*/ terraform/bootstrap/; do
            echo "==> ${dir}"
            terraform -chdir="${dir}" init -backend=false -input=false >/dev/null
            terraform -chdir="${dir}" validate
          done

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        run: |
          tflint --init --chdir=terraform
          tflint --chdir=terraform --recursive --format=compact

  test:
    name: terraform test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform test
        # 86 assertions over the promises the docs lean on -- no secret version
        # is ever written by terraform, a public accessor is refused, a plaintext
        # push endpoint is refused, a tenant can only reach its own objects, a
        # tenant id too long for a service account is refused.
        #
        # Every run block is `command = plan` against a mock_provider, so this
        # creates nothing and needs no credentials. The suite existed and was
        # wired into nothing -- not make test, not make lint, not any workflow --
        # so 86 working assertions sat outside the gate CLAUDE.md names as the
        # completeness check, and would have rotted the first time a module
        # changed. `make test` runs the same command.
        run: |
          set -euo pipefail
          terraform -chdir=tests/terraform init -input=false
          terraform -chdir=tests/terraform test

  plan-not-run:
    # NOT a no-op. A skipped job is invisible in the checks list, and this
    # repository's rule is that a bound check says what it did not cover rather
    # than going quiet -- silence has meant "did not run" here far more often
    # than "nothing to report".
    name: plan (not run on a pull request)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: say what was not checked
        run: |
          set -euo pipefail
          {
            echo "### terraform plan was not run"
            echo
            echo "A pull request's OIDC ref is \`refs/pull/${{ github.event.number }}/merge\`."
            echo "The workload identity pool is pinned to \`refs/heads/main\`, so no token"
            echo "is minted here and no plan is possible. That pin is the security boundary:"
            echo "the deployer holds \`resourcemanager.projectIamAdmin\` on a shared project."
            echo
            echo "**Checked on this pull request (offline, no credentials):**"
            echo "- \`terraform fmt -check\`, \`validate\`, \`tflint\`"
            echo "- \`checkov\`"
            echo "- \`terraform test\` over \`tests/terraform\` (86 assertions, mock provider)"
            echo
            echo "**Not checked here:** what the plan would do to the live project."
            echo "That runs on \`main\`, and \`release.yml\` applies it behind an"
            echo "environment approval with the plan attached to read first."
          } >> "$GITHUB_STEP_SUMMARY"

  checkov:
    name: checkov
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: install checkov
        run: pip install "checkov==${CHECKOV_VERSION}"

      - name: scan
        # Inline `checkov:skip=` comments in the Terraform carry the reasoning
        # for each accepted finding, so they are reviewable in a diff.
        run: checkov -d terraform --quiet --compact --framework terraform

  # WHY A PULL REQUEST DOES NOT PLAN.
  #
  # A plan needs a real cloud token. GitHub's OIDC claim for a `pull_request`
  # run is `refs/pull/<n>/merge`, and terraform/bootstrap/wif.tf pins the pool
  # to `refs/heads/main` -- deliberately, in two independent places, because
  # the deployer holds resourcemanager.projectIamAdmin on a SHARED project. A
  # pull request that could mint that token is a pull request that could grant
  # itself anything, and anyone can open a pull request. application.yml's
  # `build` job states the same rule at more length: `github_allowed_refs` MUST
  # NEVER INCLUDE refs/pull/*, and "fix CI by adding it" is the exact pressure
  # this job existing-but-red would create. It is gated off instead.
  #
  # So this job is skipped on a pull request rather than failed. Every OFFLINE
  # check still runs there and gates the merge: fmt, validate, tflint, checkov,
  # and the 86-assertion `terraform test` suite against a mock provider. What a
  # pull request cannot tell you is what the plan would do to the live project,
  # which is why release.yml applies behind an environment approval with the
  # plan attached for a person to read.
  #
  # `plan-not-run` below says all of that in the run itself, so a green
  # pull request is not mistaken for a planned one.
  plan:
    name: plan (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    needs: [validate]
    if: github.event_name != 'pull_request'
    environment: ${{ github.event.inputs.environment || 'dev' }}-plan
    env:
      # Read by scripts/lib/plan-guard.sh (through scripts/lib/common.sh) to
      # decide which project a resource is allowed to live in.
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          terraform -chdir=${{ env.TF_ROOT }} init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=infra/${ENVIRONMENT}"

      - name: pin the images terraform last applied
        # terraform/infra takes every image by digest (`image_refs`) and
        # refuses to plan an image with none. A plan of main is a plan of the
        # infrastructure, not a deploy, so it pins exactly what is applied --
        # the `image_refs` output in state, or what the channel points at when
        # the state predates that output -- and shows no image churn at all.
        # (It used to plan with the tfvars alone, i.e. every service and job
        # onto `image_tag = "bootstrap"`, which does not exist.)
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: ./scripts/lib/image-refs.sh --applied --out "${GITHUB_WORKSPACE}/build/image-refs.tfvars.json"

      - name: terraform plan
        id: plan
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
        run: |
          set -euo pipefail
          # -out is relative to -chdir, but a shell redirection is not, so both
          # derived files are written explicitly under the root.
          terraform -chdir=${{ env.TF_ROOT }} plan -input=false -lock-timeout=120s \
            -var-file="../environments/${ENVIRONMENT}/${ENVIRONMENT}.tfvars" \
            -var-file="${GITHUB_WORKSPACE}/build/image-refs.tfvars.json" \
            -out=plan.tfplan -no-color | tee "${TF_ROOT}/plan.txt"
          terraform -chdir=${{ env.TF_ROOT }} show -json plan.tfplan > "${TF_ROOT}/plan.json"

      - name: shared-project guard
        # The same assertion make destroy makes, applied to a CREATE plan: no
        # change may target a resource owned by another team, and everything we
        # create must carry managed-by=swarm-terraform so it can be safely
        # destroyed later. An unlabelled resource is one nobody can clean up.
        #
        # Both halves are now actually enforced, by the same implementation
        # `make destroy` uses. This step used to state both in its comment and
        # implement only the first: the jq body was a single `select($deny |
        # index($name))` with no label predicate anywhere in it, so the
        # forward-looking half -- the half that matters later, because an
        # unlabelled resource merging into a shared project is permanently
        # undestroyable -- was documented as enforced and was not.
        #
        # The deny-list is also no longer a six-entry copy of SHARED_DENY_LIST
        # pasted into the workflow. plan-guard.sh sources the real one from
        # scripts/lib/common.sh, so the twelve service accounts the copy omitted
        # are covered too, and a resource added to the list is protected here the
        # same day. Names are matched across both halves of a change, so an IAM
        # binding CREATED on another team's bucket is caught -- a create deletes
        # nothing and the old before-only scan could not see it.
        run: ./scripts/lib/plan-guard.sh --plan terraform/infra/plan.json --mode apply

      - name: summarise
        run: |
          {
            echo "### Terraform plan (${{ github.event.inputs.environment || 'dev' }})"
            echo
            echo '```'
            tail -c 60000 terraform/infra/plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # NO "COMMENT ON THE PR" STEP, and none should be added back to this job.
      # One sat here, gated `github.event_name == 'pull_request'` inside a job
      # gated `!= 'pull_request'`: it could never run, on any event, and it was
      # the only reason this workflow asked for `pull-requests: write`. The plan
      # is in the run summary (above) and the text artifact (below). A pull
      # request has no plan to post -- see "WHY A PULL REQUEST DOES NOT PLAN".
      # tests/unit/scripts/test_workflow_step_reachability.py fails on a step
      # its own job can never reach.
      - name: upload the human-readable plan
        # Only the text plan, which Terraform already renders with sensitive
        # attributes masked. The binary plan and plan.json are NOT uploaded:
        # both can contain sensitive attribute values in cleartext, and an
        # artifact is readable by everyone with repository access. release.yml
        # re-plans immediately before applying rather than trusting an artifact,
        # which is also the only way an apply reflects the state as it is now.
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-text-${{ github.event.inputs.environment || 'dev' }}
          path: terraform/infra/plan.txt
          retention-days: 5
