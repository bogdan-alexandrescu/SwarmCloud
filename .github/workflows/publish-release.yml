name: publish-release

# CI PUBLISHES A SWARMCLOUD RELEASE (DAYONE-RELEASE-CI; part of #2688). BGD,
# 2026-10-30: "Move publishing into CI now". Until then a person ran
# scripts/release/assemble.sh and scripts/release/publish.sh on a laptop
# (DAYONE-RELEASE-1), because D22 kept CI without IAM in the release home.
#
# A person dispatches this with a release name and a main commit whose
# `release` run succeeded; `check` refuses anything else before anybody is
# asked to approve. `publish` then waits in the GitHub environment `release`:
# its reviewer's approval is the person's confirmation, and the version they
# typed into the dispatch form reaches publish.sh as SWARM_PUBLISH_VERSION,
# which `--ci` takes in place of the typed version (and refuses unless it is
# exactly the bundle's). It publishes under gs://swarmcloud/releases/<version>/
# and us-docker.pkg.dev/swarmcloud-prod/swarmcloud, signed with the KMS key
# swarmcloud-release/cosign. It NEVER promotes: channels/stable, the root
# marketplace.json and install.sh move only by `publish.sh --promote`, typed
# by a person after the manual test (docs/runbooks/release.md).
#
# The identity is release.yml's own (vars.GCP_DEPLOY_SA through
# vars.GCP_WIF_PROVIDER). In swarmcloud-prod it holds exactly what
# `scripts/release-home.sh --ci-publisher` grants: roles/artifactregistry.writer
# on the repository, roles/storage.objectAdmin on the bucket and
# roles/cloudkms.signerVerifier on the cosign key; no project-level role.
run-name: ${{ format('publish-release {0} from {1}', inputs.version, inputs.commit) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release name: YYYY.MM.N, or a candidate YYYY.MM.N-rc.N"
        type: string
        required: true
      commit:
        description: "The main commit to release (full 40-character SHA); its release run must have succeeded"
        type: string
        required: true

# A job-level `permissions:` block REPLACES this one.
permissions:
  contents: read

concurrency:
  # One publish at a time: two runs of the same version would race for
  # releases/<version>/, which publish.sh refuses to overwrite.
  group: publish-release
  cancel-in-progress: false

# RUNNERS (owner decision 2026-10-14). A job that holds no cloud identity
# (id-token) runs on the self-hosted `bogdan-ci` VMs through the one guarded
# `runs-on` expression: a fork's pull request, or the repo variable
# SELF_HOSTED_CI set to `off` (the capacity escape hatch), sends it to
# GitHub-hosted ubuntu-24.04 instead. A dispatch on main resolves it to
# ubuntu-24.04 too. `publish` holds the deployer's identity, so it stays
# hosted, listed with why in tests/unit/scripts/test_fork_prs_off_self_hosted.py.
jobs:
  # -------------------------------------------------------------------------
  # Before the approval: the inputs are a release name and a commit on main
  # whose release run succeeded and still holds its scanned build record. No
  # Google identity here.
  # -------------------------------------------------------------------------
  check:
    name: check the version and the commit
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
    steps:
      - name: the inputs are a release name and a commit on main
        env:
          GH_TOKEN: ${{ github.token }}
          # Inputs reach the shell as environment, never interpolated into it.
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          # The workflow as main holds it, not a branch's edit of it.
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error title=not main::publish-release is dispatched from main only"
            exit 1
          fi
          if ! [[ "${VERSION}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error title=bad version::the version input is not a release name (YYYY.MM.N or YYYY.MM.N-rc.N)"
            exit 1
          fi
          if ! [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=bad commit::the commit input is not a full 40-character lowercase SHA"
            exit 1
          fi
          # `ahead`: main holds this commit and more; `identical`: it is main.
          # Anything else (diverged, behind, unknown) is not a main commit.
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${COMMIT}...main" --jq '.status')"
          case "${status}" in
            ahead|identical) echo "${COMMIT} is on main (${status})" ;;
            *)
              echo "::error title=not on main::${COMMIT} is not a commit on main (compare: ${status})"
              exit 1 ;;
          esac

      - name: the commit's successful release run, with its scanned record
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          # Newest first. A successful run can still hold no record (one
          # superseded before its images stage) or an expired one (30 days):
          # take the newest that holds a live `scanned-images-dev`.
          runs="${RUNNER_TEMP}/release-runs.txt"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?head_sha=${COMMIT}&branch=main&status=success&per_page=100" \
            --jq '.workflow_runs | sort_by(.run_started_at) | reverse | .[].id' >"${runs}"
          visited=0
          while read -r id; do
            [ -n "${id}" ] || continue
            visited=$((visited + 1))
            live="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?name=scanned-images-dev" \
              --jq '[.artifacts[] | select(.expired == false)] | length')"
            if [ "${live}" -gt 0 ]; then
              echo "release run ${id} of ${COMMIT} holds scanned-images-dev"
              echo "run_id=${id}" >> "$GITHUB_OUTPUT"
              {
                echo "### Publishing \`${COMMIT}\`"
                echo
                echo "From the scanned build record of release run [${id}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${id})."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done <"${runs}"
          echo "::error title=no scanned record::of ${visited} successful release run(s) of ${COMMIT} on main, none holds a live scanned-images-dev artifact; release that commit (or a newer one) first"
          exit 1

  # -------------------------------------------------------------------------
  # THE APPROVAL, then the publish. The `release` environment's required
  # reviewer is the person's confirmation.
  # -------------------------------------------------------------------------
  publish:
    name: publish ${{ inputs.version }} to the release home
    needs: [check]
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      # publish.sh --ci takes this, under GITHUB_ACTIONS=true only, as the
      # typed version, and refuses unless it is exactly the bundle's.
      SWARM_PUBLISH_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: the record that commit's release run scanned
        uses: actions/download-artifact@v7
        with:
          name: scanned-images-dev
          path: build/
          run-id: ${{ needs.check.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: astral-sh/setup-uv@v7

      - name: cosign and gcrane, pinned and sha-checked (swarm_install.tools.ensure)
        # The fetcher every customer's install uses: a pinned version, and a
        # download whose SHA-256 is not the pinned one is refused before it is
        # written. No third-party action.
        run: |
          set -euo pipefail
          tools="${RUNNER_TEMP}/release-tools"
          mkdir -p "${tools}"
          uv run --frozen python - "${tools}" <<'PY'
          import sys
          from pathlib import Path

          from swarm_install.tools import ensure

          tools = Path(sys.argv[1])
          for name in ("cosign", "gcrane"):
              path = ensure(name, directory=tools / "pinned")
              link = tools / name
              link.unlink(missing_ok=True)
              link.symlink_to(path)
              print(f"{name}: {path}")
          PY
          echo "${tools}" >> "$GITHUB_PATH"

      - id: auth
        # Pinned by SHA: v3.0.0, the v3 release.yml authenticates with.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      # Pinned by SHA: v3.0.1, the v3 release.yml uses.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: assemble the release from that commit
        run: |
          set -euo pipefail
          ./scripts/release/assemble.sh --version "${SWARM_PUBLISH_VERSION}" \
            --images build/images-dev.json --out "${RUNNER_TEMP}/bundle"

      - name: publish (the release environment's approval is the confirmation)
        run: |
          set -euo pipefail
          ./scripts/release/publish.sh --bundle "${RUNNER_TEMP}/bundle" \
            --source-images build/images-dev.json --ci
          {
            echo "### Published ${SWARM_PUBLISH_VERSION}"
            echo
            echo "gs://swarmcloud/releases/${SWARM_PUBLISH_VERSION}/ and us-docker.pkg.dev/swarmcloud-prod/swarmcloud, signed."
            echo "Not promoted: run the manual test (docs/runbooks/release.md), then, typed:"
            echo "\`scripts/release/publish.sh --record-test ${SWARM_PUBLISH_VERSION} --record <file>\` and \`scripts/release/publish.sh --promote ${SWARM_PUBLISH_VERSION}\`."
          } >> "$GITHUB_STEP_SUMMARY"
