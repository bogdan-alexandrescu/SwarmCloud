# Build, apply and deploy.
#
# The only workflow that changes a real environment. Its shape:
#
#   the digests application.yml BUILT for this commit (or, dispatched by hand
#   for a commit CI never built, a build here through the same script)
#         -> scan every one, moving nothing
#         -> APPROVAL: the one job that names an environment. prod waits here
#            for its required reviewer; dev has none and passes straight on
#         -> promote those DIGESTS, all or nothing (scanning them again)
#         -> plan, apply, deploy, smoke
#
# ONE BUILD PER COMMIT (owner decision, 2026-09-24; docs/ci.md). This workflow
# used to build all eight images itself while application.yml built them too,
# the two competing for Cloud Build in a shared project, and the release
# waiting behind the duplicate: on 94ee043 application.yml finished its build
# at 16:41:51 and the release spent 16:39:24-16:48:17 building the same commit
# again. Now application.yml builds once per commit on main and records the
# digests, and this workflow waits for that job and promotes what it built.
#
# Two properties this workflow exists to guarantee:
#
#   1. Everything deployed is an immutable sha256 DIGEST that was built from a
#      known commit and scanned. `:dev` and `:prod` tags exist for humans.
#      terraform/infra takes `image_refs` and refuses to plan an image with no
#      digest, so no service, job or worker image can be deployed at a tag.
#      The one place a tag is read is a redeploy without a build, which
#      resolves `:<channel>` ONCE, writes the digests down, and deploys and
#      verifies exactly those -- so "what is running" is always answerable.
#   2. NOTHING PROD-FACING HAPPENS BEFORE A HUMAN APPROVES IT (owner decision,
#      2026-09-24; docs/ci.md). saga-agents-staging is shared with other teams,
#      so an unattended apply is an unattended change to somebody else's blast
#      radius -- and moving :prod is prod-facing too: a `skip_build` redeploy
#      of prod deploys whatever :prod points at. This workflow used to move
#      :prod in the images job and ask for approval only at the apply, so a
#      rejected or abandoned prod release had already repointed :prod.
#
#      The gate is the `approval` job, the ONLY job that names an environment.
#      `promote`, `infrastructure` and `deploy` need it and run only if it
#      SUCCEEDED -- which has to be said in their `if:`, because a job that
#      must run past a SKIPPED job (a `skip_build` redeploy skips `promote`)
#      would otherwise run past a rejected approval too. Before it, a prod
#      release only reads: it obtains (for prod, builds) the images and scans
#      them. ONE approval, not one per job: GitHub holds every job that names
#      a protected environment for its own approval, so naming prod on the
#      apply and the deploy as well would ask the reviewer three times.
#
#      A PROD APPROVAL CLEARS ONE ATTEMPT, NOT THE RUN. A partial re-run --
#      "Re-run failed jobs", "Re-run this job" -- starts a job and its
#      dependants again and keeps every other job's result, so re-running a
#      failed prod apply leaves `approval` out, keeps its old 'success', and
#      (naming no environment) nobody is asked: up to 30 days later, a fresh
#      plan of the shared project, applied. So `approval` outputs the attempt
#      it ran in, and on prod `promote`, `infrastructure` and `deploy` run
#      only in THAT attempt. A partial re-run of prod skips them and
#      `stale-approval` fails the run saying so; "Re-run all jobs" runs the
#      approval again, which waits for its reviewer. dev has no reviewer, so
#      its re-runs are not tied (owner: keep dev un-gated).
#
#      A CANCEL IS A "NO" TOO, after the approval as well as before it. So
#      nothing here that promotes, applies or deploys is conditioned on
#      `always()`: GitHub still starts an `always()` job after the run is
#      cancelled, and still runs an `always()` step in a job being cancelled.
#      `!cancelled()` runs past a skipped job exactly as `always()` does and
#      stops on a cancel. Only the read-only `status` and `report` steps keep
#      `always()`.
#
#      The approval is a repository setting this file cannot check. GitHub
#      CREATES an environment a workflow names if it does not exist, with no
#      protection at all, so a missing `prod` would mean no wait. Measured
#      2026-09-24: `prod` has required reviewer bogdan-alexandrescu and a
#      deployment branch policy allowing only main; `dev` has no rule.
#      tests/unit/scripts/test_release_prod_gate.py holds the ordering.

name: release

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "images/**"
      - "terraform/**"
      - "kubernetes/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: dev
      skip_build:
        description: "Deploy the digests already promoted, without promoting new ones"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  # Never two releases to the same environment at once: they would contend for
  # the Terraform state lock and could interleave two different digests.
  group: release-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.2"
  PYTHON_VERSION: "3.11"
  TF_ROOT: terraform/infra
  # PINNED, AND THE SAME PIN security.yml USES. `push-images.sh --scan` refuses
  # to attach a channel tag to an image with fixable HIGH/CRITICAL findings, so
  # the scanner is part of the promotion gate rather than a report -- and a
  # scanner whose version floats is a gate that can change its mind between two
  # runs of the same commit.
  TRIVY_VERSION: "0.74.0"

jobs:
  # -------------------------------------------------------------------------
  # Gate. Nothing is built or applied until the cheap checks pass -- a release
  # that fails its unit tests after deploying is a rollback, not a release.
  # -------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --frozen --all-extras --dev
      - run: uv run pytest tests/unit -q
      - run: shellcheck -x scripts/*.sh scripts/lib/*.sh
      - name: destroy-guard self-test
        run: ./scripts/destroy.sh --self-test

  # -------------------------------------------------------------------------
  # The images, and their scan. application.yml's `build images` job builds
  # every image once per commit on main and uploads the digests it built; this
  # job waits for that job, fetches that record and scans every digest in it.
  # It MOVES NOTHING: it runs before the approval, so everything it does is
  # read-only toward the environment. The promotion is the `promote` job,
  # after the approval.
  # -------------------------------------------------------------------------
  build:
    name: images and scan (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    needs: [verify]
    if: github.event.inputs.skip_build != 'true'
    # actions: read is what lets this job see application.yml's run of the
    # same commit and download its record (scripts/lib/ci-built-images.sh).
    # A job-level block REPLACES the workflow's, so the other two are restated.
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      tag: ${{ steps.images.outputs.tag }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: the images CI built for this commit
        id: images
        # NO SECOND CLOUD BUILD ON A PUSH. `--reuse-ci only` waits for
        # application.yml's `build images` job for this exact commit (up to 45
        # minutes -- it is usually ~11 behind the push) and fetches the manifest
        # it recorded. That run exists and is not stopped by later pushes:
        # application.yml gives each commit on main a concurrency group of its
        # own, because GitHub cancels a PENDING run when a newer one joins its
        # group, and this workflow's path filter means the newer push may start
        # no release to take this one's place. If that job FAILED, or never
        # built this commit (someone cancelled it), this step fails and says
        # which, with the URL and the re-runs that would ship THIS commit; it
        # does not quietly build instead.
        #
        # DISPATCHED BY HAND it is `--reuse-ci or-build`: a commit CI never
        # built for this environment is built here, by the same script with
        # the same tag -- one path, not a second copy of it. That includes
        # every prod release, because application.yml builds for dev and
        # swarm-ui bakes its environment into the bundle when it is compiled.
        # A build CI tried and FAILED is still a failure, dispatched or not.
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_CI: ${{ github.event_name == 'workflow_dispatch' && 'or-build' || 'only' }}
        run: |
          set -euo pipefail
          ./scripts/build-images.sh --reuse-ci "${REUSE_CI}"
          echo "tag=$(jq -r '.tag' "build/images-${ENVIRONMENT}.json")" >> "$GITHUB_OUTPUT"

      # INSTALLED BECAUSE THE PROMOTION GATE NEEDS IT, and it was not.
      #
      # `push-images.sh --scan` runs trivy against each digest and refuses to
      # attach a channel tag to an image with fixable HIGH/CRITICAL findings.
      # This job, when it still built its own images, authenticated, built
      # every image through Cloud Build -- about eighteen minutes of work --
      # and then failed on:
      #
      #     fail trivy not found but scanning is on; install it or pass --no-scan
      #
      # measured on run 35954830712, the first release run that ever got past
      # authentication. The script's message is exactly right and names both
      # remedies; `--no-scan` is the wrong one, because the scan is what stands
      # between a fixable CRITICAL and a channel tag pointing at it.
      #
      # security.yml reaches trivy through `aquasecurity/trivy-action`, which is
      # the right shape there -- it scans and uploads SARIF. Here a SCRIPT needs
      # the binary on PATH, so it is installed with the project's own installer
      # at the same pinned version rather than by a second action whose output
      # nothing would read.
      - name: install trivy
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          trivy --version

      - name: scan the recorded digests (nothing is promoted yet)
        # BEFORE THE APPROVAL, AND ONLY READING. `--scan-only` makes every
        # check the promotion makes -- each recorded digest confirmed in
        # Artifact Registry, a record built for another environment refused,
        # every digest trivy-scanned, one refusal failing the lot -- and then
        # stops: no channel tag moves and no deploy manifest is written
        # (tests/unit/scripts/test_push_images_scan_only.py). So a prod
        # reviewer approves a set that has already passed, instead of one the
        # promotion refuses a minute after the approval.
        run: ./scripts/push-images.sh --manifest "build/images-${ENVIRONMENT}.json" --channel "${ENVIRONMENT}" --scan-only

      - name: hand the scanned record to the promotion
        # The record the step above scanned, uploaded only once it passed, so
        # the promotion after the approval promotes exactly these digests and
        # not a second reading of anything.
        uses: actions/upload-artifact@v6
        with:
          name: scanned-images-${{ github.event.inputs.environment || 'dev' }}
          path: build/images-${{ github.event.inputs.environment || 'dev' }}.json
          retention-days: 30

      - name: what the approval would release
        # Written BEFORE the approval, so a prod reviewer can read it on the
        # run's summary page while the run waits.
        #
        # The prose below never names the apply by its command: the gate test
        # (test_release_prod_gate.py) reads every `run:` as text and errs
        # toward calling a step prod-facing, so an echoed "terraform apply"
        # made this pre-approval step count as an apply.
        run: |
          set -euo pipefail
          record="build/images-${ENVIRONMENT}.json"
          {
            echo "### Scanned, not promoted: $(jq -r '.tag' "${record}") for ${ENVIRONMENT}"
            echo
            echo "Nothing has moved yet. Once \`approval (${ENVIRONMENT})\` succeeds -- for prod, once its"
            echo "required reviewer approves -- \`promote\` scans these digests again and moves"
            echo "\`:${ENVIRONMENT}\` to exactly them, and the apply job after it deploys them."
            echo
            echo "| image | digest |"
            echo "|---|---|"
            jq -r '.images[] | "| \(.name) | `\(.digest)` |"' "${record}"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # THE APPROVAL. The only job in this workflow that names an environment,
  # so the only place a release waits for a human (see the header). For prod
  # that is the required reviewer, and nothing that promotes, applies or
  # deploys runs until this job has SUCCEEDED: a rejected approval fails it,
  # and every later job's `if:` asks for success, not just for completion.
  # For dev the environment has no protection rule and this passes straight
  # on (owner: keep dev un-gated).
  #
  # A `skip_build` redeploy skips `build` and still comes through here: a
  # prod redeploy of what :prod already holds is still a prod change.
  # -------------------------------------------------------------------------
  approval:
    name: approval (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    needs: [verify, build]
    # !cancelled(), not always(): it runs past a `build` that skip_build
    # skipped, and a cancelled run asks nobody to approve anything.
    if: ${{ !cancelled() && needs.verify.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && github.event.inputs.skip_build == 'true')) }}
    environment: ${{ github.event.inputs.environment || 'dev' }}
    # THE ATTEMPT THIS APPROVAL CLEARED. A partial re-run keeps this job, and
    # this output with it, from the attempt it ran in; every prod job after
    # it compares the output with the attempt now running and does not start
    # on a mismatch (see the header). Rendered by GitHub at the end of the
    # job, from `github`, so no step can write the wrong number.
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: record what was cleared
        # Nothing to do but exist: GitHub held this job, before this step,
        # until the environment's protection rules were satisfied. Who
        # approved is on the run's page; this records what they cleared.
        run: |
          {
            echo "### ${ENVIRONMENT}: cleared to promote, apply and deploy"
            echo
            echo "Images: ${RELEASE_TAG:-none built -- a redeploy of the digests :${ENVIRONMENT} holds}."
            echo "Commit \`${GITHUB_SHA}\`, started by ${GITHUB_TRIGGERING_ACTOR}, attempt ${GITHUB_RUN_ATTEMPT}."
            if [ "${ENVIRONMENT}" = prod ]; then
              echo
              echo "This clears attempt ${GITHUB_RUN_ATTEMPT} only. A partial re-run of this release does not ask"
              echo "again and so changes nothing in prod; \"Re-run all jobs\" asks again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # The promotion, after the approval. Fetches the record `build` scanned and
  # attaches the channel tag to exactly those digests.
  # -------------------------------------------------------------------------
  promote:
    name: promote (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    needs: [build, approval]
    # No status function, so GitHub also requires every job upstream to have
    # succeeded; the explicit test is what a reader checks. A `skip_build`
    # redeploy skips `build`, and with it this job: it promotes nothing. On
    # prod, only in the attempt the approval cleared (see the header).
    if: needs.build.result == 'success' && needs.approval.result == 'success' && (github.event.inputs.environment != 'prod' || needs.approval.outputs.attempt == github.run_attempt)
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: fetch the record `build` scanned
        uses: actions/download-artifact@v7
        with:
          name: scanned-images-${{ github.event.inputs.environment || 'dev' }}
          path: build/

      # The promotion scans again, so it needs trivy here too -- see `build`'s
      # install step for why it is installed this way and pinned.
      - name: install trivy
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
            | sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"
          trivy --version

      - name: scan and promote the recorded digests
        # THOSE DIGESTS, NOT A TAG. `--manifest` promotes the digest each image
        # was built as, from the record `build` obtained and scanned; each is
        # confirmed in Artifact Registry first, and a record built for another
        # environment is refused. `:<tag>` is not read at all, so a later build
        # of the same commit cannot change what this release promotes.
        #
        # SCANNED AGAIN, deliberately. `--scan` is the promotion's own gate,
        # and the approval may come hours after `build`'s scan, against a
        # vulnerability database that has learned something since. Measured on
        # release 36059484794: scanning and promoting all eight images took
        # 75 seconds (21:29:50-21:31:05), so the second scan costs about a
        # minute.
        #
        # ALL OR NOTHING. push-images.sh scans EVERY digest before any channel
        # tag moves, and one image with fixable HIGH/CRITICAL findings promotes
        # none of them. Run 35969538707 scanned and tagged one image at a time,
        # so seven images were already on :dev when swarm-ui was refused, and
        # :dev described a release nobody built. A tag that fails to move
        # part-way is put back, and the manifest below is written only after
        # every tag has moved -- so on failure there is no artifact to upload.
        # If the put-back itself fails, the step's last line says the channel
        # is MIXED and names the images; a `skip_build` redeploy reads the
        # channel, so put those back (the commands are in the log) first.
        run: ./scripts/push-images.sh --manifest "build/images-${ENVIRONMENT}.json" --channel "${ENVIRONMENT}" --scan

      - uses: actions/upload-artifact@v6
        with:
          name: deployed-images-${{ github.event.inputs.environment || 'dev' }}
          path: build/deployed-images-*.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # Infrastructure. Plans immediately before applying rather than trusting an
  # artifact from an earlier job: an apply must reflect the state as it is now,
  # and in a shared project "as it was ten minutes ago" is not the same thing.
  # -------------------------------------------------------------------------
  infrastructure:
    name: terraform apply (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    needs: [verify, approval, promote]
    # A status function because a `skip_build` redeploy skips `promote` and
    # must still apply. That is exactly why `needs.approval.result ==
    # 'success'` is spelled out: without it this apply would run past a
    # REJECTED approval. `promote` may be skipped only on a skip_build run --
    # skipped for any other reason, nothing new was promoted and nothing is
    # applied.
    #
    # !cancelled(), NOT always(). This used to be always(), and GitHub starts
    # an always() job after the run is cancelled: on a skip_build prod
    # redeploy `promote` is skipped the moment `approval` succeeds, so a
    # reviewer who approved and cancelled a second later still got a prod
    # apply (tests/unit/scripts/test_release_prod_gate.py, the cancellation
    # tests).
    #
    # NO `environment:` HERE, deliberately: `approval` holds this release's
    # one approval, and naming prod again would make GitHub ask again. The
    # price is that GitHub no longer asks on a RE-RUN of this job, so on prod
    # it runs only in the attempt the approval cleared: "Re-run failed jobs"
    # after a lock timeout skips it, and `stale-approval` says to re-run all
    # jobs (see the header).
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.approval.result == 'success' && (needs.promote.result == 'success' || (needs.promote.result == 'skipped' && github.event.inputs.skip_build == 'true')) && (github.event.inputs.environment != 'prod' || needs.approval.outputs.attempt == github.run_attempt) }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: init
        run: |
          terraform -chdir=${{ env.TF_ROOT }} init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=infra/${ENVIRONMENT}"

      # THE APPLY IS THE DEPLOY, AND IT DEPLOYS DIGESTS.
      #
      # terraform/infra takes `image_refs` -- one sha256 digest per image -- and
      # refuses to plan while any image has none. This job used to plan with the
      # tfvars alone, which meant `image_tag = "bootstrap"`: every service and
      # every worker job planned onto a tag that does not exist. It never got
      # that far only because no release had yet passed its build.
      - name: fetch the promotion manifest
        if: needs.promote.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: deployed-images-${{ github.event.inputs.environment || 'dev' }}
          path: build/

      - name: pin every image by digest
        # From this run's promotion when it built; otherwise from what the
        # channel tag points at NOW, written down as a manifest so the deploy
        # job verifies exactly what this apply pinned even if someone moves
        # the tag in between. scripts/lib/image-refs.sh refuses a tag.
        run: |
          set -euo pipefail
          manifest="build/deployed-images-${ENVIRONMENT}.json"
          if [ -f "${manifest}" ]; then
            ./scripts/lib/image-refs.sh --manifest "${manifest}" \
              --out "build/image-refs-${ENVIRONMENT}.tfvars.json"
          else
            ./scripts/lib/image-refs.sh --channel "${ENVIRONMENT}" --write-manifest "${manifest}" \
              --out "build/image-refs-${ENVIRONMENT}.tfvars.json"
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: pinned-images-${{ github.event.inputs.environment || 'dev' }}
          path: build/deployed-images-*.json
          retention-days: 30

      - name: plan
        run: |
          set -euo pipefail
          terraform -chdir=${{ env.TF_ROOT }} plan -input=false -lock-timeout=180s \
            -var-file="../environments/${ENVIRONMENT}/${ENVIRONMENT}.tfvars" \
            -var-file="${GITHUB_WORKSPACE}/build/image-refs-${ENVIRONMENT}.tfvars.json" \
            -out=plan.tfplan -no-color | tee "${TF_ROOT}/plan.txt"
          terraform -chdir=${{ env.TF_ROOT }} show -json plan.tfplan > "${TF_ROOT}/plan.json"

      - name: shared-project guard
        # The SAME implementation `make destroy` uses -- scripts/lib/plan-guard.sh
        # over scripts/lib/destroy-guard.jq -- not a restatement of it.
        #
        # This step used to re-implement the rule as an awk type regex, and the
        # two drifted. destroy-guard.jq exempts IAM edges by SHAPE
        # (`_iam_(member|binding|policy)$`); the awk exempted only
        # `google_project_iam`, so a plan deleting any of
        # google_storage_bucket_iam_member, google_pubsub_topic_iam_member,
        # google_secret_manager_secret_iam_binding,
        # google_artifact_registry_repository_iam_member,
        # google_cloud_run_v2_service_iam_member or
        # google_pubsub_subscription_iam_member was blocked from production.
        # Those are exactly the resources that disappear when a tenant is
        # removed or a tenant's provider list changes -- routine applies.
        # (The awk also exempted `google_firestore_` while destroy.sh's own list
        # did not, so the two Track D guards disagreed in both directions.)
        #
        # It also now enforces the forward half of the rule: everything the plan
        # CREATES must carry managed-by=swarm-terraform, because `make destroy`
        # refuses to delete anything that does not.
        run: ./scripts/lib/plan-guard.sh --plan "${TF_ROOT}/plan.json" --mode apply

      - name: apply
        run: terraform -chdir=${{ env.TF_ROOT }} apply -input=false -lock-timeout=180s plan.tfplan

  # -------------------------------------------------------------------------
  # Deploy and prove it works.
  # -------------------------------------------------------------------------
  deploy:
    name: deploy and smoke (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    needs: [build, approval, infrastructure]
    # Runs only after the apply succeeded, and the apply runs only after the
    # approval succeeded -- so this is behind the same one approval. No
    # `environment:` of its own, for the reason given on `infrastructure`: it
    # used to name prod as well, which asked the reviewer a second time AFTER
    # the apply had already changed prod.
    #
    # Tied to the approved attempt on its own, not only through the apply:
    # "Re-run this job" on a deploy whose smoke test failed keeps the apply's
    # old 'success', and would otherwise run the in-VPC smoke suite and the
    # GKE dispatch against prod with nobody asked. `approval` is in `needs`
    # only so this condition can read its output.
    #
    # !cancelled() rather than always(), for the reason on `infrastructure`:
    # it runs past a `build` that skip_build skipped, and a cancel stops it.
    if: ${{ !cancelled() && needs.infrastructure.result == 'success' && (github.event.inputs.environment != 'prod' || needs.approval.outputs.attempt == github.run_attempt) }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          # NO ID TOKEN. This step used to mint one for vars.API_AUDIENCE so the
          # smoke test could call the API from this runner. Release 36027980448
          # (2026-09-24) failed right here -- "input required and not supplied:
          # id_token_audience", the variable was never set -- and setting it
          # would not have helped: swarm-api's ingress is
          # internal-and-cloud-load-balancing, so a runner cannot reach its
          # run.app address, and the IAP front door refuses ID tokens
          # (scripts/lib/common.sh, api_credential). The suites now run INSIDE
          # the VPC as the swarm-verify job, which gets its own token from the
          # metadata server; this job only needs gcloud's access token.

      - uses: google-github-actions/setup-gcloud@v3

      - name: fetch the digests the apply pinned
        # The manifest the infrastructure job pinned and applied, not a second
        # resolution of the channel: the two would differ if the tag moved in
        # between, and then this job would be verifying something that was
        # never applied. (This step used to reconstruct the manifest itself,
        # from a hand-kept list of six images that omitted swarm-ui and
        # swarm-verify.)
        uses: actions/download-artifact@v7
        with:
          name: pinned-images-${{ github.event.inputs.environment || 'dev' }}
          path: build/

      - name: verify every service, job and worker image runs the pinned digests
        id: verify
        # The apply above IS the deploy; this proves it. A service serving an
        # older digest reported healthy through every check the pipeline had
        # (docs/audits/2026-09-20/tag-vs-digest.md). --verify-only compares
        # every service's template, every terraform-managed job, and the
        # scheduler's WORKER_IMAGE_REFS against the manifest, digest to digest.
        #
        # --no-health: the /readyz probe cannot run from this runner. It needs an
        # ID token (the auth step no longer mints one -- see its comment) and the
        # services' ingress refuses a runner anyway, which deploy.sh already
        # records as "not reachable from here". Release 36036058352 failed right
        # here with "no ID token available" once #36 dropped the token. Health is
        # proven by the next step, which runs the smoke suite INSIDE the VPC.
        run: ./scripts/lib/deploy.sh --verify-only --no-health --wait 600 --manifest "build/deployed-images-${ENVIRONMENT}.json"

      - name: smoke test (inside the VPC)
        # The `mock` profile needs no provider key, so this proves the whole
        # path -- submit, admit, dispatch, run, release -- without depending on
        # any tenant's credential. verify-remote.sh executes scripts/smoke-test.sh
        # in the swarm-verify Cloud Run job, which IS in the VPC, and exits with
        # the job's exit code.
        run: ./scripts/verify-remote.sh smoke-test

      - name: prove GKE dispatch with one browser task
        # docs/incidents/2026-09-24-gke-dispatch.md section 5: every browser
        # task this platform ever accepted failed, through seven stacked
        # causes, and "the cheapest proof is one task". This is that task,
        # after every deploy: dispatched to GKE_AUTOPILOT, SUCCEEDED, an
        # artifact under the tenant's own prefix, and its lease released.
        #
        # The browser profile needs an anthropic credential on the calling
        # identity's tenant. Without one the task PARKS on CREDENTIAL_MISSING,
        # which proves nothing about GKE -- and the script fails saying exactly
        # that, rather than passing on a task that never reached a backend.
        #
        # Runs even when the smoke test failed, provided the deployment itself
        # verified: a smoke failure on the Cloud Run path is exactly when the
        # GKE path's own diagnosis is worth having, and the two share nothing
        # below the API. But NOT after a cancel: this dispatches a task into
        # the environment, and always() here ran it after a cancel that landed
        # on the smoke test. !cancelled() runs past the failed smoke test and
        # stops on a cancel.
        #
        # SWITCHED BY vars.PROVE_GKE_DISPATCH, and off until the owner turns it on.
        # On 2026-09-24 browser admission was deliberately paused
        # (pools/resource:browser hard_limit 0) because every GKE pod died before
        # the worker lifecycle ran (docs/incidents, wf_ebb3ab2d65664707a559).
        # With admission paused this proof cannot pass, and a step that is red on
        # every release teaches everyone to ignore the release. Set the repository
        # variable PROVE_GKE_DISPATCH=true in the same change that restores the
        # browser limit. When it is off the step still runs and SAYS it skipped.
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        run: |
          if [ "${{ vars.PROVE_GKE_DISPATCH }}" != "true" ]; then
            echo "::notice title=GKE proof skipped::vars.PROVE_GKE_DISPATCH is not 'true' -- browser admission is paused; nothing about GKE was proven by this release."
            exit 0
          fi
          ./scripts/verify-remote.sh prove-gke-dispatch

      - name: status
        if: always()
        run: ./scripts/status.sh || true

      - name: report
        if: always()
        run: |
          {
            echo "### Release ${{ needs.build.outputs.tag || 'existing digests' }} -> ${ENVIRONMENT}"
            echo
            echo "| image | digest |"
            echo "|---|---|"
            jq -r '.images[] | "| \(.name) | `\(.digest)` |"' \
              "build/deployed-images-${ENVIRONMENT}.json" 2>/dev/null || echo "| (no manifest) | |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # A PARTIAL RE-RUN OF PROD GOES RED, AND SAYS WHY. On prod, `promote`,
  # `infrastructure` and `deploy` run only in the attempt `approval` cleared
  # (see the header), so "Re-run failed jobs" or "Re-run this job" skips
  # them. A run whose re-run jobs are all skipped ends GREEN, and an operator
  # who re-ran a failed prod apply would read success for a release that
  # changed nothing. This job needs all of them, so any partial re-run of
  # them re-runs it too, and it fails the run with what to do instead.
  #
  # It never runs on a first attempt, on "Re-run all jobs" (the approval runs
  # again and outputs the new attempt), on dev, or after a cancel.
  # tests/unit/scripts/test_release_prod_gate.py holds all of that.
  # -------------------------------------------------------------------------
  stale-approval:
    name: prod approval is from an earlier attempt
    runs-on: ubuntu-24.04
    needs: [approval, promote, infrastructure, deploy]
    if: ${{ !cancelled() && github.event.inputs.environment == 'prod' && needs.approval.result == 'success' && needs.approval.outputs.attempt != github.run_attempt }}
    env:
      APPROVED_ATTEMPT: ${{ needs.approval.outputs.attempt }}
    steps:
      - name: say what to do instead
        # The message never names the apply by its command, for the reason on
        # `build`'s summary step: the gate test reads every run: as text.
        run: |
          echo "::error title=Nothing was released -- re-run ALL jobs::The prod approval was given in attempt ${APPROVED_ATTEMPT}; this is attempt ${GITHUB_RUN_ATTEMPT}, a partial re-run, which GitHub does not ask anyone to approve. So promote, the apply and the deploy were skipped and this attempt changed nothing in prod. Use 'Re-run all jobs': the approval runs again and waits for its reviewer."
          {
            echo "### Nothing was released"
            echo
            echo "The prod approval cleared attempt ${APPROVED_ATTEMPT}. This is attempt ${GITHUB_RUN_ATTEMPT}, a partial"
            echo "re-run, which GitHub does not ask anyone to approve, so promote, the apply and the deploy"
            echo "were skipped and this attempt changed nothing in prod. **Re-run all jobs** to release: the"
            echo "approval runs again and waits for its reviewer."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
