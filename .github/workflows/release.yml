# Build, apply and deploy.
#
# The only workflow that changes a real environment. Its shape:
#
#   the digests application.yml BUILT for this commit (or, dispatched by hand
#   for a commit CI never built, a build here through the same script)
#         -> scan every one, moving nothing
#         -> APPROVAL: the one job that names an environment. prod waits here
#            for its required reviewer; dev has none and passes straight on
#         -> promote those DIGESTS, all or nothing (scanning them again)
#         -> plan, apply, deploy (prod: and warm, smoke, the GKE proof)
#
# ON DEV THE RELEASE ENDS AT THE DEPLOY (owner decision 2026-10-08, cuts A, B
# and C of the release timing report; docs/ci.md, "The release timeline").
# Warming the worker jobs, the smoke test, the GKE proof and acceptance run in
# .github/workflows/accept.yml, which starts when this run completes and
# judges whatever dev runs then -- the SHA in releases/dev/applied.json
# (scripts/lib/release-order.sh). They used to hold this workflow's
# `release-dev` lock for 70 of its 100 min p50 (deploy and smoke 23.6,
# acceptance 45.4, measured over 22 runs), and every later push queued behind
# them. A red acceptance now opens an issue; it no longer stands between the
# next commit and dev. PROD IS UNCHANGED: it never ran acceptance, and its
# deploy still warms, smokes and proves GKE inside this run.
#
# THE STEPS OF EACH STAGE ARE IN .github/actions/release-*, composite actions
# this file and hotfix.yml -- the hotfix lane, owner decision 2026-10-08,
# observer proposal H -- both run, so the two lanes cannot drift. Composite
# actions and not a reusable workflow, because the deployer trusts workflow
# FILES by `job_workflow_ref`, which for a reusable workflow names the called
# file (terraform/bootstrap/wif.tf, #457). Every gate stays HERE: the
# approval, the dev-iam job, each job's `if:`, each job's checkout and
# authentication. On dev the stages share one release lock with the hotfix
# lane and never move dev backwards (scripts/lib/release-order.sh): a release
# whose commit is older than what the hotfix lane already shipped stops,
# green, "superseded" (docs/ci.md, "Hotfix releases").
#
# ONE BUILD PER COMMIT (owner decision, 2026-09-24; docs/ci.md). This workflow
# used to build all eight images itself while application.yml built them too,
# the two competing for Cloud Build in a shared project, and the release
# waiting behind the duplicate: on 94ee043 application.yml finished its build
# at 16:41:51 and the release spent 16:39:24-16:48:17 building the same commit
# again. Now application.yml builds once per commit on main and records the
# digests, and this workflow waits for that job and promotes what it built.
#
# Two properties this workflow exists to guarantee:
#
#   1. Everything deployed is an immutable sha256 DIGEST that was built from a
#      known commit and scanned. `:dev` and `:prod` tags exist for humans.
#      terraform/infra takes `image_refs` and refuses to plan an image with no
#      digest, so no service, job or worker image can be deployed at a tag.
#      The one place a tag is read is a redeploy without a build, which
#      resolves `:<channel>` ONCE, writes the digests down, and deploys and
#      verifies exactly those -- so "what is running" is always answerable.
#   2. NOTHING PROD-FACING HAPPENS BEFORE A HUMAN APPROVES IT (owner decision,
#      2026-09-24; docs/ci.md). saga-agents-staging is shared with other teams,
#      so an unattended apply is an unattended change to somebody else's blast
#      radius -- and moving :prod is prod-facing too: a `skip_build` redeploy
#      of prod deploys whatever :prod points at. This workflow used to move
#      :prod in the images job and ask for approval only at the apply, so a
#      rejected or abandoned prod release had already repointed :prod.
#
#      The gate is the `approval` job, the ONLY job that names prod (or dev).
#      The one other environment is `dev-iam`, named by a dev-only job that
#      applies a plan changing IAM once the owner approves it (owner
#      decision, 2026-09-28, #268; docs/ci.md).
#      `promote`, `infrastructure` and `deploy` need it and run only if it
#      SUCCEEDED -- which has to be said in their `if:`, because a job that
#      must run past a SKIPPED job (a `skip_build` redeploy skips `promote`)
#      would otherwise run past a rejected approval too. Before it, a prod
#      release only reads: it obtains (for prod, builds) the images and scans
#      them. ONE approval, not one per job: GitHub holds every job that names
#      a protected environment for its own approval, so naming prod on the
#      apply and the deploy as well would ask the reviewer three times.
#
#      A PROD APPROVAL CLEARS ONE ATTEMPT, NOT THE RUN. A partial re-run --
#      "Re-run failed jobs", "Re-run this job" -- starts a job and its
#      dependants again and keeps every other job's result, so re-running a
#      failed prod apply leaves `approval` out, keeps its old 'success', and
#      (naming no environment) nobody is asked: up to 30 days later, a fresh
#      plan of the shared project, applied. So `approval` outputs the attempt
#      it ran in, and on prod `promote`, `infrastructure` and `deploy` run
#      only in THAT attempt. A partial re-run of prod skips them and
#      `stale-approval` fails the run saying so; "Re-run all jobs" runs the
#      approval again, which waits for its reviewer. dev has no reviewer, so
#      its re-runs are not tied (owner: keep dev un-gated).
#
#      A CANCEL IS A "NO" TOO, after the approval as well as before it. So
#      nothing here that promotes, applies or deploys is conditioned on
#      `always()`: GitHub still starts an `always()` job after the run is
#      cancelled, and still runs an `always()` step in a job being cancelled.
#      `!cancelled()` runs past a skipped job exactly as `always()` does and
#      stops on a cancel. Only the read-only `status` and `report` steps keep
#      `always()`.
#
#      The approval is a repository setting this file cannot check. GitHub
#      CREATES an environment a workflow names if it does not exist, with no
#      protection at all, so a missing `prod` would mean no wait. Measured
#      2026-09-24: `prod` has required reviewer bogdan-alexandrescu and a
#      deployment branch policy allowing only main; `dev` has no rule.
#      tests/unit/scripts/test_release_prod_gate.py holds the ordering.

name: release

# A DISPATCH SAYS WHICH ENVIRONMENT IN ITS NAME, because the name is the only
# part of a dispatch's inputs a `workflow_run` event carries: accept.yml reads
# it so a completed PROD release cannot cancel, or start, dev's acceptance.
# A push (always dev) renders '' and keeps GitHub's own name, the commit's
# headline -- an empty run-name is the documented "use the default".
run-name: ${{ github.event_name == 'workflow_dispatch' && format('release {0} {1}', inputs.environment, github.ref_name) || '' }}

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "images/**"
      - "terraform/**"
      - "kubernetes/**"
      - "scripts/**"
      - ".github/workflows/release.yml"
      - ".github/actions/release-*/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: dev
      skip_build:
        description: "Deploy the digests already promoted, without promoting new ones"
        type: boolean
        default: false

# Least privilege at workflow level (epic #352 item 9, docs/merge-step.md M4/R4).
# `id-token: write` lets a job mint a Google identity token through workload
# identity federation, so it is declared only on the jobs that authenticate to
# Google (build, promote, infrastructure, infrastructure-iam, deploy).
# `verify` runs the merged repository's own tests and must not be
# able to mint one. A job-level `permissions:` block REPLACES this one.
permissions:
  contents: read

concurrency:
  # Never two releases to the same environment at once: they would contend for
  # the Terraform state lock and could interleave two different digests.
  group: release-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.16.2"
  PYTHON_VERSION: "3.11"
  TF_ROOT: terraform/infra
  # PINNED, AND THE SAME PIN security.yml USES. `push-images.sh --scan` refuses
  # to attach a channel tag to an image with fixable HIGH/CRITICAL findings, so
  # the scanner is part of the promotion gate rather than a report -- and a
  # scanner whose version floats is a gate that can change its mind between two
  # runs of the same commit.
  TRIVY_VERSION: "0.74.0"

jobs:
  # -------------------------------------------------------------------------
  # Gate. Nothing is built or applied until the cheap checks pass -- a release
  # that fails its unit tests after deploying is a rollback, not a release.
  #
  # ON A PUSH THIS JOB IS SKIPPED, AND THAT IS NOT A WEAKER GATE (owner
  # decision 2026-10-08, cut B of the release timing report). A push to main
  # starts application.yml on the same SHA, which runs the unit suite
  # (`python`, sharded, every file on main), shellcheck and the destroy-guard
  # self-test (`shell`, `python-checks`) and the manifests -- and its `build
  # images` job `needs: [python, shell, manifests]`. On a push `build` below
  # takes CI's image record with `--reuse-ci only` and refuses to build its
  # own, so the record this release ships CANNOT EXIST unless those checks
  # passed on this very commit. Running them again here was 26.4 min p50 of
  # the `release-dev` lock (22 successful runs, measured 2026-10-08) proving
  # what CI had already proven. On a workflow_dispatch -- every prod release,
  # and a dev dispatch that may build its own images (`or-build`), or redeploy
  # with `skip_build` and no CI record at all -- nothing upstream has proven
  # the commit, so it runs. Every job that needs it states the same rule:
  # `verify` succeeded, or it was skipped on a push.
  # -------------------------------------------------------------------------
  verify:
    name: verify
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: uv sync --frozen --all-extras --dev
      - run: uv run pytest tests/unit -q
      - run: shellcheck -x scripts/*.sh scripts/lib/*.sh
      - name: destroy-guard self-test
        run: ./scripts/destroy.sh --self-test

  # -------------------------------------------------------------------------
  # THE PLUGIN'S BRIDGE TAG (#272; docs/ci.md, "The plugin's bridge tag is
  # made by the release"). plugin/.claude-plugin/plugin.json installs the
  # swarm-mcp bridge from `@sc-v<version>`, and its `version` is the same
  # string (tests/unit/mcp/test_plugin_bridge_install.py). That tag was made
  # by hand, so it could be missing: sc-v0.5.6 did not exist while main
  # already pinned it, and every fresh install of that version failed to
  # fetch its bridge. This job creates it, on the commit being released.
  #
  # After `verify` (on a push, after `build` found CI's record), because a tag
  # is what users' installs resolve: a commit whose unit tests fail is not one
  # to hand them. On main only -- a
  # workflow_dispatch can name another branch, and a tag made from it would
  # pin users to a commit main never had.
  #
  # IT NEVER MOVES A TAG THAT EXISTS. Users' installs already resolved it, and
  # uv caches what it fetched; moving it would give two users of the same
  # version two different bridges. So nothing here forces: an existing tag is
  # reported (with the commit it points at, when that is not this one) and
  # left exactly where it is.
  #
  # `contents: write` is granted on THIS job, not the workflow, whose default
  # stays `contents: read`: the jobs that build, plan and deploy run a great
  # deal of code and none of it needs to write to the repository. This job is
  # the only one here holding it, and runs nothing but checkout, jq and git.
  #
  # A bump that touches ONLY plugin/ starts no release (plugin/** is not in
  # `on.push.paths`). It is tagged by the next release whose commit descends
  # from it -- the tag then lands on that later commit, whose plugin.json
  # says the same version. Until then application.yml's shell job warns.
  # -------------------------------------------------------------------------
  plugin-tag:
    name: tag the plugin's bridge (sc-v<version>)
    runs-on: ubuntu-24.04
    needs: [verify, build]
    # AFTER A PROVEN COMMIT. On a dispatch that is `verify`. On a push `verify`
    # is skipped (see its header) and the proof is `build`: it found CI's image
    # record for this SHA, which application.yml writes only after its unit
    # tests, shellcheck and manifests passed. `!cancelled()` only so the job
    # can run past that skip; each branch still demands a success.
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (github.event_name == 'push' && needs.verify.result == 'skipped' && needs.build.result == 'success')) }}
    # MAIN ONLY, said on each STEP rather than on the job. A job-level
    # `github.ref` is outside what tests/unit/scripts/test_release_prod_gate.py
    # can evaluate (its release contexts carry no ref), and a job-level `if:`
    # there would have to be modelled before relying on it. Off main this job
    # starts, runs nothing, and ends green. No status function on either
    # step, so neither runs unless everything before it succeeded.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        if: github.ref == 'refs/heads/main'

      - name: create sc-v<version> on this commit unless it already exists
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          manifest=plugin/.claude-plugin/plugin.json
          version="$(jq -r '.version' "$manifest")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=${manifest}::version is '${version}', not X.Y.Z; no tag created"
            exit 1
          fi
          tag="sc-v${version}"
          listing="$(mktemp)"

          # 0: it exists. 2 (--exit-code): it does not. Anything else is a
          # remote that could not be read, which is not "absent".
          remote_tag() {
            local status=0
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" > "$listing" || status=$?
            return "$status"
          }
          # The commit an existing tag points at: the peeled line of an
          # annotated tag, else the tag's own line.
          tagged_commit() {
            local peeled
            peeled="$(awk -v ref="refs/tags/${tag}^{}" '$2 == ref {print $1}' "$listing")"
            if [ -n "$peeled" ]; then echo "$peeled"; else awk -v ref="refs/tags/${tag}" '$2 == ref {print $1}' "$listing"; fi
          }
          report_existing() {
            local at
            at="$(tagged_commit)"
            if [ "$at" = "$RELEASE_SHA" ]; then
              echo "::notice title=${tag} already exists::${tag} already points at this commit (${RELEASE_SHA}); nothing to do."
            else
              echo "::notice title=${tag} already exists::${tag} points at ${at}, not this commit (${RELEASE_SHA}). It is left where it is: installs of ${version} already resolved it."
            fi
          }

          status=0
          remote_tag || status=$?
          if [ "$status" -eq 0 ]; then
            report_existing
            exit 0
          fi
          if [ "$status" -ne 2 ]; then
            echo "::error::git ls-remote could not read origin's tags (exit ${status}); not creating ${tag} blind"
            exit 1
          fi

          git -c "user.name=github-actions[bot]" \
              -c "user.email=41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$tag" "$RELEASE_SHA" -m "swarm-mcp bridge for plugin sc ${version}"
          if git push origin "refs/tags/${tag}"; then
            echo "::notice title=${tag} created::${tag} now points at ${RELEASE_SHA}."
            exit 0
          fi
          # Rejected. Another release (a dev push and a prod dispatch can run
          # at once) may have pushed it first; that is the tag existing, not
          # a failure. Anything else is.
          status=0
          remote_tag || status=$?
          if [ "$status" -eq 0 ]; then
            report_existing
            exit 0
          fi
          echo "::error::pushing ${tag} was rejected and origin does not have it"
          exit 1

  # -------------------------------------------------------------------------
  # The images, and their scan. application.yml's `build images` job builds
  # every image once per commit on main and uploads the digests it built; this
  # job waits for that job, fetches that record and scans every digest in it.
  # It MOVES NOTHING: it runs before the approval, so everything it does is
  # read-only toward the environment. The promotion is the `promote` job,
  # after the approval.
  # -------------------------------------------------------------------------
  build:
    name: images and scan (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    needs: [verify]
    # !cancelled() only to run past the `verify` a push skips (see its header):
    # on a push the CI record this job demands IS the proof of verify.
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && github.event_name == 'push')) && github.event.inputs.skip_build != 'true' }}
    # actions: read is what lets this job see application.yml's run of the
    # same commit and download its record (scripts/lib/ci-built-images.sh).
    # A job-level block REPLACES the workflow's, so the other two are restated.
    permissions:
      contents: read
      id-token: write
      actions: read
    outputs:
      tag: ${{ steps.stage.outputs.tag }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: the images CI built for this commit, scanned (nothing is promoted yet)
        id: stage
        # .github/actions/release-images, shared with hotfix.yml: the record
        # application.yml built for this commit (`--reuse-ci`: NO SECOND
        # CLOUD BUILD ON A PUSH -- `only`; dispatched by hand, `or-build`),
        # every digest scanned with `--scan-only`, the scanned record handed
        # to `promote`, and what the approval would release written to the
        # summary. It MOVES NOTHING.
        uses: ./.github/actions/release-images
        with:
          environment: ${{ env.ENVIRONMENT }}
          lane: release
          reuse_ci: ${{ github.event_name == 'workflow_dispatch' && 'or-build' || 'only' }}

  # -------------------------------------------------------------------------
  # THE APPROVAL. The only job in this workflow that names prod or dev, so
  # the only place a prod release waits for a human (see the header). For prod
  # that is the required reviewer, and nothing that promotes, applies or
  # deploys runs until this job has SUCCEEDED: a rejected approval fails it,
  # and every later job's `if:` asks for success, not just for completion.
  # For dev the environment has no protection rule and this passes straight
  # on (owner: keep dev un-gated) -- unless the plan changes IAM, which
  # `infrastructure-iam` holds for the owner in `dev-iam`.
  #
  # A `skip_build` redeploy skips `build` and still comes through here: a
  # prod redeploy of what :prod already holds is still a prod change.
  # -------------------------------------------------------------------------
  approval:
    name: approval (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    needs: [verify, build]
    # !cancelled(), not always(): it runs past a `build` that skip_build
    # skipped, and a cancelled run asks nobody to approve anything.
    # `verify` succeeded, or a push skipped it (see its header).
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && github.event_name == 'push')) && (needs.build.result == 'success' || (needs.build.result == 'skipped' && github.event.inputs.skip_build == 'true')) }}
    environment: ${{ github.event.inputs.environment || 'dev' }}
    # THE ATTEMPT THIS APPROVAL CLEARED. A partial re-run keeps this job, and
    # this output with it, from the attempt it ran in; every prod job after
    # it compares the output with the attempt now running and does not start
    # on a mismatch (see the header). Rendered by GitHub at the end of the
    # job, from `github`, so no step can write the wrong number.
    outputs:
      attempt: ${{ github.run_attempt }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: record what was cleared
        # Nothing to do but exist: GitHub held this job, before this step,
        # until the environment's protection rules were satisfied. Who
        # approved is on the run's page; this records what they cleared.
        run: |
          {
            echo "### ${ENVIRONMENT}: cleared to promote, apply and deploy"
            echo
            echo "Images: ${RELEASE_TAG:-none built -- a redeploy of the digests :${ENVIRONMENT} holds}."
            echo "Commit \`${GITHUB_SHA}\`, started by ${GITHUB_TRIGGERING_ACTOR}, attempt ${GITHUB_RUN_ATTEMPT}."
            if [ "${ENVIRONMENT}" = prod ]; then
              echo
              echo "This clears attempt ${GITHUB_RUN_ATTEMPT} only. A partial re-run of this release does not ask"
              echo "again and so changes nothing in prod; \"Re-run all jobs\" asks again."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # The promotion, after the approval. Fetches the record `build` scanned and
  # attaches the channel tag to exactly those digests.
  # -------------------------------------------------------------------------
  promote:
    name: promote (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    # Authenticates to Google through workload identity: the only reason this
    # job holds id-token (the workflow grants it to no one by default).
    permissions:
      contents: read
      id-token: write
    needs: [build, approval]
    # !cancelled() and not the default success(): success() looks at every
    # job upstream, transitively, and on a push that includes the `verify` a
    # push skips (see its header), so a bare condition never promoted on a
    # push. `build` and `approval` must each have SUCCEEDED, said explicitly,
    # and `approval` itself required `verify` (or the push skip). A
    # `skip_build` redeploy skips `build`, and with it this job: it promotes
    # nothing. On prod, only in the attempt the approval cleared (see the
    # header).
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.approval.result == 'success' && (github.event.inputs.environment != 'prod' || needs.approval.outputs.attempt == github.run_attempt) }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      # Full history: the order guard asks git whether the commit already out
      # is an ancestor of this one, which a depth-1 clone cannot answer.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: scan and promote the recorded digests
        # .github/actions/release-promote, shared with hotfix.yml: fetch the
        # record `build` scanned, scan it AGAIN and promote THOSE DIGESTS, ALL
        # OR NOTHING (push-images.sh --manifest --scan), and hand the deploy
        # manifest on. On dev, under the release lock and only FORWARDS: if a
        # newer commit is already promoted or applied (the hotfix lane), it
        # moves nothing and ends green (scripts/lib/release-order.sh).
        uses: ./.github/actions/release-promote
        with:
          environment: ${{ env.ENVIRONMENT }}

  # -------------------------------------------------------------------------
  # Infrastructure. Plans immediately before applying rather than trusting an
  # artifact from an earlier job: an apply must reflect the state as it is now,
  # and in a shared project "as it was ten minutes ago" is not the same thing.
  #
  # The one exception is a dev plan that changes IAM (owner decision,
  # 2026-09-28, #268): this job classifies it, holds it, and does not apply
  # it; `infrastructure-iam` applies that same saved plan once the owner has
  # approved it. Terraform refuses a saved plan whose state has moved on, so
  # the wait cannot turn it into an apply of stale intent.
  # -------------------------------------------------------------------------
  infrastructure:
    name: terraform apply (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    # Authenticates to Google through workload identity: the only reason this
    # job holds id-token (the workflow grants it to no one by default).
    permissions:
      contents: read
      id-token: write
    needs: [verify, approval, promote]
    # A status function because a `skip_build` redeploy skips `promote` and
    # must still apply. That is exactly why `needs.approval.result ==
    # 'success'` is spelled out: without it this apply would run past a
    # REJECTED approval. `promote` may be skipped only on a skip_build run --
    # skipped for any other reason, nothing new was promoted and nothing is
    # applied.
    #
    # !cancelled(), NOT always(). This used to be always(), and GitHub starts
    # an always() job after the run is cancelled: on a skip_build prod
    # redeploy `promote` is skipped the moment `approval` succeeds, so a
    # reviewer who approved and cancelled a second later still got a prod
    # apply (tests/unit/scripts/test_release_prod_gate.py, the cancellation
    # tests).
    #
    # NO `environment:` HERE, deliberately: `approval` holds this release's
    # one approval, and naming prod again would make GitHub ask again. The
    # price is that GitHub no longer asks on a RE-RUN of this job, so on prod
    # it runs only in the attempt the approval cleared: "Re-run failed jobs"
    # after a lock timeout skips it, and `stale-approval` says to re-run all
    # jobs (see the header).
    # `verify` succeeded, or a push skipped it (see its header).
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && github.event_name == 'push')) && needs.approval.result == 'success' && (needs.promote.result == 'success' || (needs.promote.result == 'skipped' && github.event.inputs.skip_build == 'true')) && (github.event.inputs.environment != 'prod' || needs.approval.outputs.attempt == github.run_attempt) }}
    # Read by `infrastructure-iam` and `deploy`. On prod the classification
    # does not run and all three are empty.
    outputs:
      iam: ${{ steps.stage.outputs.iam }}
      plan_uri: ${{ steps.stage.outputs.plan_uri }}
      plan_sha256: ${{ steps.stage.outputs.plan_sha256 }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      # Full history, for the order guard (see `promote`).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: pin, plan, guard, classify and apply
        id: stage
        # .github/actions/release-apply, shared with hotfix.yml:
        #
        #   * THE APPLY IS THE DEPLOY, AND IT DEPLOYS DIGESTS: every image is
        #     pinned by digest (scripts/lib/image-refs.sh) from this run's
        #     promotion, or -- a `skip_build` redeploy -- from what the channel
        #     holds now, written down so `deploy` verifies exactly that;
        #   * plan, then the shared-project guard (scripts/lib/plan-guard.sh,
        #     the SAME implementation `make destroy` uses);
        #   * on dev, does this plan change IAM (owner decision 2026-09-28,
        #     #268; scripts/lib/iam-plan.jq): 'false' applies here; 'true' is
        #     HELD -- the saved plan's sha256 recorded and the plan copied to
        #     the state bucket, never a workflow artifact -- for
        #     `infrastructure-iam`; an empty answer is applied nowhere;
        #   * prod: applied, as before, behind `approval (prod)`;
        #   * on dev, all of it under the release lock, and only FORWARDS: a
        #     commit older than what the hotfix lane already shipped applies
        #     nothing and ends green (scripts/lib/release-order.sh).
        uses: ./.github/actions/release-apply
        with:
          environment: ${{ env.ENVIRONMENT }}
          lane: release
          # A `skip_build` redeploy promoted nothing: pin the channel instead.
          promoted: ${{ needs.promote.result == 'success' && 'true' || 'false' }}
          lock_timeout: 180s

  # -------------------------------------------------------------------------
  # A DEV PLAN THAT CHANGES IAM, APPLIED AFTER THE OWNER APPROVES IT (owner
  # decision, 2026-09-28, #268). The one job that names `dev-iam`, whose
  # required reviewer is the owner, so GitHub holds it before its first step.
  # It applies the saved plan `terraform apply` classified and held, checked
  # by sha256, and never plans: a new plan would be one nobody reviewed.
  #
  # Never on prod, whatever the classification said: prod's approval is
  # `approval (prod)`. Named in GitHub's settings, not here -- a missing
  # `dev-iam` is created with no protection at all, so the command that sets
  # its reviewer is in docs/ci.md.
  #
  # A re-run of this job alone asks again (it names the environment), and
  # re-applies the same held plan; if the state moved on since, Terraform
  # refuses it as stale, and re-running `terraform apply` plans afresh.
  # -------------------------------------------------------------------------
  infrastructure-iam:
    name: terraform apply, IAM (dev-iam)
    runs-on: ubuntu-24.04
    # Authenticates to Google through workload identity: the only reason this
    # job holds id-token (the workflow grants it to no one by default).
    permissions:
      contents: read
      id-token: write
    needs: [infrastructure]
    # !cancelled(), NOT the default (bare success()). success() is not scoped
    # to `needs: [infrastructure]` -- it is false when ANY job upstream,
    # transitively, is not a plain success, and on a `skip_build` dispatch
    # `build` and `promote` (both upstream of `infrastructure`) are skipped.
    # `infrastructure`'s own `if:` already runs past that skip explicitly, but
    # a bare `needs.infrastructure.result == 'success'` here does not stop
    # GitHub inserting success() in front of it: this job used to skip anyway,
    # every time, on a skip_build dev dispatch -- the IAM plan held but never
    # applied, and the run still ended green (tests/unit/scripts/
    # test_release_dev_iam_gate.py, test_a_skip_build_dev_release_with_an_iam_
    # plan_still_reaches_dev_iam). `needs.infrastructure.result == 'success'`
    # stays: `needs.*` reads only a job's direct result, which success() does
    # not give us once a status function is spelled out.
    if: ${{ !cancelled() && github.event.inputs.environment != 'prod' && needs.infrastructure.result == 'success' && needs.infrastructure.outputs.iam == 'true' }}
    environment: dev-iam
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      PLAN_URI: ${{ needs.infrastructure.outputs.plan_uri }}
      PLAN_SHA256: ${{ needs.infrastructure.outputs.plan_sha256 }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      # Full history for the order guard (scripts/lib/release-order.sh): this
      # job takes the same release lock as `terraform apply` -- an IAM apply is
      # an apply, and the hotfix lane must not interleave with it.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: take the release lock
        id: lock
        run: ./scripts/lib/release-order.sh lock --environment "${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: is a newer commit already out
        # The owner may approve hours later. If a newer commit has been
        # applied since (the hotfix lane), this plan would roll dev back: it
        # is not applied, the job ends green, and `deploy` finds the
        # same answer.
        id: order
        run: ./scripts/lib/release-order.sh check --environment "${ENVIRONMENT}"

      - name: init
        # The same backend and the same commit as the job that planned, so the
        # same providers from the same lock file: a saved plan applies only in
        # a working directory initialised like the one that made it.
        run: |
          terraform -chdir=${{ env.TF_ROOT }} init -input=false -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=infra/${ENVIRONMENT}"

      - name: fetch the plan the owner reviewed
        if: steps.order.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          if [ -z "${PLAN_URI}" ] || [ -z "${PLAN_SHA256}" ]; then
            echo "::error::the planning job recorded no held plan, so there is nothing to apply"
            exit 1
          fi
          gcloud storage cp --no-user-output-enabled "${PLAN_URI}" "${TF_ROOT}/plan.tfplan"
          echo "${PLAN_SHA256}  ${TF_ROOT}/plan.tfplan" | sha256sum -c -

      - name: apply the reviewed plan
        id: apply
        if: steps.order.outputs.superseded != 'true'
        run: terraform -chdir=${{ env.TF_ROOT }} apply -input=false -lock-timeout=180s plan.tfplan

      - name: record what dev now runs
        if: steps.apply.outcome == 'success'
        run: ./scripts/lib/release-order.sh record --environment "${ENVIRONMENT}" --what applied

      - name: drop the held plan
        run: gcloud storage rm --no-user-output-enabled "${PLAN_URI}"

      - name: release the release lock
        # always(): a failed or cancelled apply must not leave dev locked until
        # the lock goes stale. It deletes only THIS job's lock (by generation).
        if: always() && steps.lock.outputs.generation != ''
        env:
          GENERATION: ${{ steps.lock.outputs.generation }}
        run: ./scripts/lib/release-order.sh unlock --environment "${ENVIRONMENT}" --generation "${GENERATION}"

  # -------------------------------------------------------------------------
  # Deploy and prove it is what was promoted. On prod, also prove it works:
  # warm, smoke and the GKE proof, as before. On dev those three moved to
  # .github/workflows/accept.yml with acceptance (see the header), so this
  # job ends once the digests are verified and the tenant namespaces applied,
  # and the `release-dev` lock goes with it.
  # -------------------------------------------------------------------------
  deploy:
    name: deploy (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-24.04
    # Authenticates to Google through workload identity: the only reason this
    # job holds id-token (the workflow grants it to no one by default).
    permissions:
      contents: read
      id-token: write
    needs: [build, approval, infrastructure, infrastructure-iam]
    # Runs only after the apply succeeded, and the apply runs only after the
    # approval succeeded -- so this is behind the same one approval. On dev
    # "the apply" is `terraform apply`'s own when its plan changed no IAM
    # (`iam` is 'false'), and otherwise `infrastructure-iam`'s, which must have
    # succeeded: a plan the owner rejected, or one never classified, deploys
    # nothing. Prod never classifies, so this reads as it did before. No
    # `environment:` of its own, for the reason given on `infrastructure`: it
    # used to name prod as well, which asked the reviewer a second time AFTER
    # the apply had already changed prod.
    #
    # Tied to the approved attempt on its own, not only through the apply:
    # "Re-run this job" on a deploy whose smoke test failed keeps the apply's
    # old 'success', and would otherwise run the in-VPC smoke suite and the
    # GKE dispatch against prod with nobody asked. `approval` is in `needs`
    # only so this condition can read its output.
    #
    # !cancelled() rather than always(), for the reason on `infrastructure`:
    # it runs past a `build` that skip_build skipped, and a cancel stops it.
    if: ${{ !cancelled() && needs.infrastructure.result == 'success' && (github.event.inputs.environment == 'prod' || needs.infrastructure.outputs.iam == 'false' || needs.infrastructure-iam.result == 'success') && (github.event.inputs.environment != 'prod' || needs.approval.outputs.attempt == github.run_attempt) }}
    # Whether a newer commit reached dev during this job (the hotfix lane). No
    # job here reads it now that acceptance is accept.yml's, which asks
    # releases/dev/applied.json instead; it stays for the run's own record.
    outputs:
      superseded: ${{ steps.verify.outputs.superseded == 'true' || steps.smoke.outputs.superseded == 'true' }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
    steps:
      # Full history, for the order guard (see `promote`).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          # NO ID TOKEN. This step used to mint one for vars.API_AUDIENCE so the
          # smoke test could call the API from this runner. Release 36027980448
          # (2026-09-24) failed right here -- "input required and not supplied:
          # id_token_audience", the variable was never set -- and setting it
          # would not have helped: swarm-api's ingress is
          # internal-and-cloud-load-balancing, so a runner cannot reach its
          # run.app address, and the IAP front door refuses ID tokens
          # (scripts/lib/common.sh, api_credential). The suites now run INSIDE
          # the VPC as the swarm-verify job, which gets its own token from the
          # metadata server; this job only needs gcloud's access token.

      - uses: google-github-actions/setup-gcloud@v3

      - name: verify every service, job and worker image runs the pinned digests
        id: verify
        # .github/actions/release-verify, shared with hotfix.yml. The apply IS
        # the deploy; this proves it, digest to digest, against the manifest
        # the apply pinned (`deploy.sh --verify-only --no-health`: the /readyz
        # probe cannot run from this runner -- the smoke test proves health
        # INSIDE the VPC: below on prod, in accept.yml on dev). On dev it first asks whether a newer commit
        # has reached dev since, and a verification that fails because one
        # arrived meanwhile ends green with superseded=true, which stops every
        # step below: the newer release proves itself.
        uses: ./.github/actions/release-verify
        with:
          environment: ${{ env.ENVIRONMENT }}

      - name: warm each Cloud Run worker job once on its new digest
        # #363, measured 2026-10-07: the first execution of each Cloud Run job
        # after a new image digest spends 30-59 s importing the image; every
        # later start pays 1-3 s. One `--self-test` execution per per-tenant
        # worker job pays that import here, before the smoke test and before
        # acceptance, instead of in the first tenant task. The worker exits 0
        # on that flag before reading its configuration: no lease, no Firestore,
        # no task state (agent_worker.__main__.self_test).
        #
        # PROD ONLY HERE. On dev accept.yml warms, as its first step, the same
        # digests this run verified (see the header).
        #
        # ONLY AFTER the verify step proved every job runs the promoted digest:
        # warming the old digest would warm nothing. A failed warm run is a
        # slower first task, not a broken release, so the script warns and
        # exits 0; continue-on-error keeps even a refused name (the only
        # non-zero exit) from failing the release. !cancelled(), not always():
        # it executes jobs in the environment, and a cancel stops it.
        if: ${{ !cancelled() && github.event.inputs.environment == 'prod' && steps.verify.outcome == 'success' && steps.verify.outputs.superseded != 'true' }}
        continue-on-error: true
        timeout-minutes: 30
        run: ./scripts/warm-jobs.sh

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # kubernetes/render.py, which apply.sh runs in the step below, imports
      # quota_broker, scheduler and swarm_common from apps/. Their import chain
      # is stdlib-only today, but nothing holds it there: the first module-level
      # third-party import in any of the three would fail this apply with
      # ModuleNotFoundError on the runner's bare python3 (#346, #354 review).
      # So it runs on the project's own interpreter, synced from the lockfile
      # as `verify` syncs it, and only when the apply runs.
      - uses: astral-sh/setup-uv@v7
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.superseded != 'true' && vars.APPLY_TENANT_NAMESPACES == 'true' }}
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: sync the project's Python for kubernetes/render.py
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.superseded != 'true' && vars.APPLY_TENANT_NAMESPACES == 'true' }}
        run: uv sync --frozen --all-extras

      - name: apply each tenant namespace with its step-spec public keys
        # .github/actions/release-namespaces, shared with hotfix.yml (CONTRACT
        # REQUEST 34, #342): every tenant namespace with its
        # swarm-spec-verify-keys ConfigMap, BEFORE the smoke test and the GKE
        # proof so nothing this release dispatches runs against the previous
        # release's keys. SWITCHED BY vars.APPLY_TENANT_NAMESPACES, off until
        # the owner turns it on; when off, the step SAYS so.
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && steps.verify.outputs.superseded != 'true' }}
        uses: ./.github/actions/release-namespaces
        with:
          environment: ${{ env.ENVIRONMENT }}
          apply_tenant_namespaces: ${{ vars.APPLY_TENANT_NAMESPACES }}

      - name: smoke test (inside the VPC)
        # The `mock` profile needs no provider key, so this proves the whole
        # path -- submit, admit, dispatch, run, release -- without depending on
        # any tenant's credential. verify-remote.sh executes scripts/smoke-test.sh
        # in the swarm-verify Cloud Run job, which IS in the VPC, and exits with
        # the job's exit code. PROD ONLY HERE: on dev accept.yml runs it,
        # against the SHA releases/dev/applied.json names. On prod
        # `release-order.sh unless-superseded` is the command alone.
        id: smoke
        if: github.event.inputs.environment == 'prod' && steps.verify.outputs.superseded != 'true'
        run: ./scripts/lib/release-order.sh unless-superseded --environment "${ENVIRONMENT}" -- ./scripts/verify-remote.sh smoke-test

      - name: prove GKE dispatch with one browser task
        # docs/incidents/2026-09-24-gke-dispatch.md section 5: every browser
        # task this platform ever accepted failed, through seven stacked
        # causes, and "the cheapest proof is one task". This is that task,
        # after every deploy: dispatched to GKE_AUTOPILOT, SUCCEEDED, an
        # artifact under the tenant's own prefix, and its lease released.
        #
        # The browser profile needs an anthropic credential on the calling
        # identity's tenant. Without one the task PARKS on CREDENTIAL_MISSING,
        # which proves nothing about GKE -- and the script fails saying exactly
        # that, rather than passing on a task that never reached a backend.
        #
        # Runs even when the smoke test failed, provided the deployment itself
        # verified: a smoke failure on the Cloud Run path is exactly when the
        # GKE path's own diagnosis is worth having, and the two share nothing
        # below the API. But NOT after a cancel: this dispatches a task into
        # the environment, and always() here ran it after a cancel that landed
        # on the smoke test. !cancelled() runs past the failed smoke test and
        # stops on a cancel.
        #
        # SWITCHED BY vars.PROVE_GKE_DISPATCH, and off until the owner turns it on.
        # On 2026-09-24 browser admission was deliberately paused
        # (pools/resource:browser hard_limit 0) because every GKE pod died before
        # the worker lifecycle ran (docs/incidents, wf_ebb3ab2d65664707a559).
        # With admission paused this proof cannot pass, and a step that is red on
        # every release teaches everyone to ignore the release. Set the repository
        # variable PROVE_GKE_DISPATCH=true in the same change that restores the
        # browser limit. When it is off the step still runs and SAYS it skipped.
        #
        # PROD ONLY HERE, like the smoke test: on dev accept.yml runs it.
        if: ${{ !cancelled() && github.event.inputs.environment == 'prod' && steps.verify.outcome == 'success' && steps.verify.outputs.superseded != 'true' && steps.smoke.outputs.superseded != 'true' }}
        run: |
          if [ "${{ vars.PROVE_GKE_DISPATCH }}" != "true" ]; then
            echo "::notice title=GKE proof skipped::vars.PROVE_GKE_DISPATCH is not 'true' -- browser admission is paused; nothing about GKE was proven by this release."
            exit 0
          fi
          ./scripts/verify-remote.sh prove-gke-dispatch

      - name: status
        if: always()
        run: ./scripts/status.sh || true

      - name: report
        if: always()
        run: |
          {
            echo "### Release ${{ needs.build.outputs.tag || 'existing digests' }} -> ${ENVIRONMENT}"
            echo
            echo "| image | digest |"
            echo "|---|---|"
            jq -r '.images[] | "| \(.name) | `\(.digest)` |"' \
              "build/deployed-images-${ENVIRONMENT}.json" 2>/dev/null || echo "| (no manifest) | |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # A PARTIAL RE-RUN OF PROD GOES RED, AND SAYS WHY. On prod, `promote`,
  # `infrastructure` and `deploy` run only in the attempt `approval` cleared
  # (see the header), so "Re-run failed jobs" or "Re-run this job" skips
  # them. A run whose re-run jobs are all skipped ends GREEN, and an operator
  # who re-ran a failed prod apply would read success for a release that
  # changed nothing. This job needs all of them, so any partial re-run of
  # them re-runs it too, and it fails the run with what to do instead.
  #
  # It never runs on a first attempt, on "Re-run all jobs" (the approval runs
  # again and outputs the new attempt), on dev, or after a cancel.
  # tests/unit/scripts/test_release_prod_gate.py holds all of that.
  # -------------------------------------------------------------------------
  stale-approval:
    name: prod approval is from an earlier attempt
    runs-on: ubuntu-24.04
    needs: [approval, promote, infrastructure, deploy]
    if: ${{ !cancelled() && github.event.inputs.environment == 'prod' && needs.approval.result == 'success' && needs.approval.outputs.attempt != github.run_attempt }}
    env:
      APPROVED_ATTEMPT: ${{ needs.approval.outputs.attempt }}
    steps:
      - name: say what to do instead
        # The message never names the apply by its command, for the reason on
        # the summary step in .github/actions/release-images: the gate test
        # reads every run: as text.
        run: |
          echo "::error title=Nothing was released -- re-run ALL jobs::The prod approval was given in attempt ${APPROVED_ATTEMPT}; this is attempt ${GITHUB_RUN_ATTEMPT}, a partial re-run, which GitHub does not ask anyone to approve. So promote, the apply and the deploy were skipped and this attempt changed nothing in prod. Use 'Re-run all jobs': the approval runs again and waits for its reviewer."
          {
            echo "### Nothing was released"
            echo
            echo "The prod approval cleared attempt ${APPROVED_ATTEMPT}. This is attempt ${GITHUB_RUN_ATTEMPT}, a partial"
            echo "re-run, which GitHub does not ask anyone to approve, so promote, the apply and the deploy"
            echo "were skipped and this attempt changed nothing in prod. **Re-run all jobs** to release: the"
            echo "approval runs again and waits for its reviewer."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
