# Application checks on every pull request.
#
# Everything in this workflow runs WITHOUT cloud credentials except the image
# build, which uses Workload Identity Federation. That split is deliberate: the
# fast feedback (lint, unit tests, manifest validation) must not depend on being
# able to reach a project, so a GCP outage or a credential problem cannot block a
# code review.

name: application

on:
  # Also on main, so a direct push is tested too. Without this the suite only
  # ever ran on pull requests, and a repository whose history landed straight
  # on main had never run its own tests once.
  #
  # AND ON A LANE BRANCH (LANE CI-EARLY, part of #1694, owner decision
  # 2026-10-20). Under the integrate strategy the implement step pushes
  # `swarm/<task id>` and opens no pull request; the fix step opens one after
  # review. CI now starts on that push, the whole suite as on main, while
  # review and fix run. The merge step holds EVERY run of a required check at
  # the head, from any event (agent_worker/merge.py required_check_state), so
  # a push run is one more run that must be green and the rule is unchanged.
  # security.yml and terraform.yml (which ci-gate waits for) run on the same
  # pushes; release.yml never does. tests/unit/scripts/test_ci_early.py.
  push:
    branches: [main, "swarm/**"]
  # EVERY PULL REQUEST, WITH NO PATH FILTER (owner request 2026-10-07, docs/ci.md
  # "The merge pipeline's wall time"). The `ci-gate` job at the bottom of this
  # file is the check ruleset 24160219 requires, and GitHub holds a required
  # check whose workflow was filtered out as pending forever -- so this
  # workflow must start on every pull request. Which jobs a change reaches is
  # decided inside it, by the `changes` job: a job it does not reach is skipped
  # by its own `if:`, which reads as a pass. The list that used to be this
  # trigger's `paths:` is that job's APP_PATHS, comments and all.
  pull_request:
  # A MERGE QUEUE ENTRY (owner decision 2026-10-06, docs/ci.md "Merging
  # through the merge queue"). ci-gate is required and is a job of this
  # workflow, so it runs there with NO filter -- a run that never starts is a
  # required check that never reports, and the queue drops the entry at its
  # timeout (tests/unit/scripts/test_merge_queue_workflows.py).
  # Never raised while the queue is off.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      # `build images` rebuilds only the images a commit changed (docs/ci.md
      # "Main builds only the images a commit changed"). This rebuilds every
      # one, for when a reused digest is suspect or a base image's patch is
      # wanted before the seven-day limit brings it.
      full_build:
        description: "Rebuild every image instead of reusing the digests of unchanged ones"
        type: boolean
        default: false

# Least privilege at workflow level (#457, docs/merge-step.md M4/R4).
# `id-token: write` lets a job mint a Google identity token through workload
# identity federation, so it is declared only on the jobs that authenticate to
# Google (`build`). `python` and `integration` run the merged
# repository's own tests and must not be able to mint one.
# A job-level `permissions:` block REPLACES this one.
permissions:
  contents: read

concurrency:
  # ONE GROUP FOR ALL OF MAIN, AND THE NEWEST COMMIT WINS (owner decision,
  # BGD, 2026-10-26, #2438: "Release only the newest"). A push to main cancels
  # main's older run that has not finished, queued or in progress, and
  # release.yml ships the newest commit only.
  #
  # WHY. Main used to run one group PER COMMIT, never cancelled, so that a
  # release could always find its own commit built (the 2026-09-24 decision
  # below). On 2026-10-25/26 that stalled every deploy: nothing deployed from
  # 23:32Z to past 08:00Z. Each merge added a run of about 25 jobs to the
  # GitHub-hosted queue main's push jobs use (PR 1720), 27 to 78 of them were
  # queued at once, and every release timed out after 2700s waiting for its
  # own commit's `build images` job, which had not reached a runner. 34 merges
  # were waiting to deploy.
  #
  # WHY CANCELLING IS NOW SAFE. Main is linear, so a newer commit contains
  # every older one: a cancelled commit's change ships inside the newer
  # commit's build. That build is incremental from the newest RECORDED build
  # of an ancestor (ci-built-images.sh --previous skips a run that recorded
  # nothing) and diffs from the commit each reused digest was built from, so
  # an image a cancelled commit changed is rebuilt, not skipped. Every
  # intermediate commit was already tested on its pull request (or its
  # identical tree, docs/ci.md "Main reuses the tested tree"). And the
  # 2026-09-24 stranding -- a docs-only push cancelled a build whose release
  # then went red, because it started no release of its own -- cannot recur:
  # release.yml now runs on EVERY push to main, and a release whose commit
  # main has moved past ends green, superseded, instead of failing.
  #
  # The price: a Cloud Build a cancelled run submitted carries on (stopping
  # `gcloud builds submit` does not stop it; build-images.sh on_interrupt),
  # at most BUILD_PARALLELISM of them per cancelled run.
  #
  # Pull requests and other branches are unchanged: the group is the ref, and
  # a newer push cancels the older run.
  group: application-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  KUBECTL_VERSION: "v1.36.3"

# RUNNERS (owner decision 2026-10-14). A job that holds no cloud identity
# (id-token) runs on the self-hosted `bogdan-ci` VMs through the one guarded
# `runs-on` expression: a fork's pull request, or the repo variable
# SELF_HOSTED_CI set to `off` (the capacity escape hatch), sends it to
# GitHub-hosted ubuntu-24.04 instead. Every job that stays hosted is listed,
# with why, in tests/unit/scripts/test_fork_prs_off_self_hosted.py.
jobs:
  shell:
    name: shellcheck
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    # Skipped when the change reaches nothing in this workflow (`changes`).
    needs: changes
    if: needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'shell')
    # Job-level permissions REPLACE the workflow's, so contents: read is
    # restated. actions: read is for the plugin-tag check's `gh run list` of
    # release.yml; nothing here mints a cloud token, so no id-token.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-kubectl@v5
        with:
          # The parity checks below find kubectl >= 1.30 (scripts/lib/common.sh
          # kubectl_bin). GitHub's image carries one; the self-hosted VM does
          # not, so the check died with "no kubectl >= 1.30 found". Pinned for
          # the reason the manifests job pins it.
          version: ${{ env.KUBECTL_VERSION }}

      - name: shellcheck
        # -x follows `source` directives so lib/common.sh is analysed in context.
        # scripts/acceptance/ too (#358): its entry scripts source lib.sh and
        # every group file, so the group files are analysed in that context
        # as well as on their own.
        #
        # IN PARALLEL, AND ON A PULL REQUEST ONLY WHAT IT REACHES (LANE
        # CI-EARLY, part of #1694). The one serial call was the slowest check
        # on 19 of 65 heads (291 s median). scripts/lib/shellcheck-ci.sh runs
        # `shellcheck -x` per file over the runner's cores; on a pull request
        # over the changed scripts, what they source and what sources them
        # (`changes` hands it the diff). Everything else -- main, a lane push,
        # a queue entry, a diff that could not be read -- checks every file
        # the serial command named.
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ needs.changes.outputs.changed }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "pull_request" ] && [ -n "${CHANGED}" ]; then
            printf '%s' "${CHANGED}" | jq -r '.[]' > "${RUNNER_TEMP}/shell-changed"
            scripts/lib/shellcheck-ci.sh --changed "${RUNNER_TEMP}/shell-changed"
          else
            scripts/lib/shellcheck-ci.sh
          fi

      - name: scripts are executable and strict
        # The property is "strict mode is on before anything runs", so the check
        # is the FIRST EFFECTIVE LINE -- not a fixed window.
        #
        # This used to be `head -n 20 | grep`, which failed on five scripts whose
        # header comments are longer than twenty lines: destroy.sh (line 30),
        # purge-data.sh (24), race-test.sh (21), register-tenant.sh (26),
        # lib/validate-manifests.sh (23). All five did set it, and those long
        # headers are the house style CLAUDE.md asks for -- so the check was
        # wrong, not the scripts. Widening the window would only move the same
        # failure further out; the awk below has no window at all.
        run: |
          set -euo pipefail
          fail=0
          for f in scripts/*.sh scripts/lib/*.sh scripts/lib/guard-bin/* scripts/acceptance/*.sh scripts/acceptance/groups/*.sh; do
            [ -x "$f" ] || { echo "::error file=$f::not executable"; fail=1; }
            first="$(awk 'NR==1 && /^#!/ {next} /^[[:space:]]*#/ {next} /^[[:space:]]*$/ {next} {print; exit}' "$f")"
            [ "$first" = "set -euo pipefail" ] \
              || { echo "::error file=$f::first effective line is '$first', expected 'set -euo pipefail'"; fail=1; }
          done
          exit "$fail"

      - name: every script parses under bash 3.2
        # macOS ships bash 3.2.57 as /bin/bash, and CLAUDE.md names it as the
        # bash these scripts target. The runner's bash is 5.x, so shellcheck and
        # every other step here passed while lib/common.sh did not parse at all
        # under 3.2 (#825) -- and every script sources it. 3.2 scans the body of
        # a heredoc inside $( ) for quotes, so one apostrophe in an awk program
        # there swallowed the rest of the file. Only the parser can catch that,
        # so this runs the real 3.2 parser over every script and lists them all
        # rather than stopping at the first.
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w bash:3.2.57 bash -c '
            n=0; fail=0
            for f in scripts/*.sh scripts/lib/*.sh scripts/lib/guard-bin/* scripts/acceptance/*.sh scripts/acceptance/groups/*.sh; do
              n=$((n+1))
              bash -n "$f" || { echo "::error file=$f::does not parse under bash $BASH_VERSION"; fail=1; }
            done
            echo "parsed $n files under bash $BASH_VERSION"
            [ "$n" -gt 0 ] || { echo "::error::no scripts visited"; exit 1; }
            exit "$fail"'

      - name: the shell restatements of the frozen contract still match it
        # A bash script cannot import Python, so SlotPool.effective_limit and
        # Tenant.secret_name() are necessarily restated in jq and in shell. This
        # asserts the copies against the frozen module. It needs no credentials.
        run: ./scripts/lib/check-contract-parity.sh

      - name: the deployment sets every environment variable the control plane reads
        # Seven name mismatches between terraform and the apps had accumulated
        # by 2026-09-18, every one of them failing open and silently -- a reader
        # that gets "" takes its "not configured" branch, which is a quiet
        # fallback rather than a crash. Nothing here needs credentials: it is a
        # static comparison of what locals.tf writes against what the apps read.
        run: ./scripts/lib/check-env-parity.sh

      - name: applied egress policies match the live cluster's network (skipped without credentials)
        # The one parity check that needs the LIVE cluster: every applied
        # swarm-allow-worker-egress against the cluster's pod range, service
        # range, kube-dns IP and NodeLocal DNSCache address. This job has no
        # cloud credentials, so it skips -- with a ::notice on the run page, not
        # silently. It is here so that skip is visible on every PR; the real
        # comparison is `--require-live` after an apply (kubernetes/README.md).
        # Only on a GitHub-hosted runner. The self-hosted VM is a GCE
        # instance, so gcloud finds its service account from the metadata
        # server and reports an ACTIVE account on every run (an empty
        # CLOUDSDK_CONFIG did not hide it): the check then went live and died
        # on "kubectl is pointed at <none>". The live comparison is
        # `--require-live` after an apply, not this step.
        if: runner.environment == 'github-hosted'
        run: ./scripts/lib/check-cluster-network-parity.sh

      - name: the plan guard still catches offenders
        # The single implementation both `make destroy` and the two Terraform
        # workflows use to decide whether a plan may touch this shared project.
        run: ./scripts/lib/plan-guard.sh --self-test

      - name: the kubectl guard still refuses another team's cluster
        # `make test` ran this and CI did not, so the one guard standing between
        # a routine `kubectl` and another team's live cluster could be broken by
        # a pull request and merged green. It was written after a bare
        # `kubectl get runtimeclass` reached agents-staging and returned
        # resources aged 133 days; the next command in that sequence was an
        # apply. It takes no arguments and reaches no network.
        run: ./scripts/lib/kubectl-guard.sh --self-test

      - name: the workspace call guard still refuses what is not named for one workspace
        # docs/workspaces.md §2.5. The guard is code, not IAM (residual risk R1):
        # it is all that bounds swarm-workspace-deployer's project-wide account
        # IAM, so every rule's refusal and allowance is proven on every change.
        # Offline: it builds its expectation from a fixture record.
        run: ./scripts/lib/workspace-guard.sh self-test

      - name: the auth guard still tells an expired session from an absent resource
        # Same gap, same reason. This is the predicate every script uses to
        # avoid reporting "not found" when the real answer is "your session
        # expired" -- the failure mode that produced the swallowed-stderr sweep.
        run: ./scripts/lib/auth-guard.sh --self-test

      - name: the benchmark engine still fails a regression and a missed measurement
        # `make test` runs this, so CI must too -- the rule the operator-surface
        # test enforces, and the reason it exists: a guard that only one of the
        # two runs is a guard a pull request can break and merge green.
        #
        # This is the engine that decides whether a performance regression is
        # reported or swallowed. It asserts, offline and with no browser, that an
        # unchanged run passes, that a 10x regression fails, that a run which
        # measured NOTHING fails rather than setting a record, that the recorded
        # 3m09s cold start of 2026-09-22 decomposes to 189s, and that a
        # fixture-mode UI capture reports its API metrics as not measured.
        run: ./scripts/bench.sh --self-test

      - name: no TODO or stub markers in shipped code
        # A TODO in a dispatch path is an outage with a comment attached.
        run: |
          set -euo pipefail
          if grep -rnIE '\b(TODO|FIXME|XXX|NotImplementedError)\b' \
               --exclude-dir=.terraform --exclude-dir=__pycache__ --exclude-dir=.venv \
               --exclude='*.lock' --exclude='*.lock.hcl' \
               apps scripts terraform kubernetes Makefile 2>/dev/null ; then
            echo "::error::unfinished markers found"
            exit 1
          fi
          echo "none found"

      - name: documentation links resolve
        # Anchors, not just files. A broken anchor lands the reader at the top of
        # the page and looks like it worked, so seven had accumulated -- two of
        # them the deliberate hand-offs into the Preview-disk risk that CLAUDE.md
        # says must not be softened. A hand-off that silently misses IS a
        # softening, so it is checked rather than proof-read.
        run: ./scripts/lib/check-doc-links.sh

      - name: the plugin's pinned bridge tag exists, or its release has not run yet
        # #272; docs/ci.md, "The plugin's bridge tag is made by the release".
        # plugin.json pins its bridge to `sc-v<version>`, and release.yml's
        # plugin-tag job creates that tag after verify. sc-v0.5.6 was missing
        # while main pinned it, and nothing said so; this says so.
        #
        # RED only when a completed release on main whose `verify` job passed
        # already descends from the commit that bumped the version: plugin-tag
        # runs exactly when verify passed, so that release should have tagged
        # it and did not. The RUN's conclusion is deliberately not read: a
        # plugin-tag that failed (a rejected push, a ruleset on sc-v*), or any
        # later build or deploy job that failed, makes the whole run `failure`,
        # and filtering on `success` would hide precisely the release #272 is
        # about. A WARNING when no such release has run since the bump -- a
        # bump touching only plugin/ starts no release (release.yml's path
        # filter), and the next release tags it. A gh call that fails is a
        # check that could not be made, never "no releases".
        #
        # On main only: the tag is made by main's release, so a pull request
        # bumping the version is expected to have none.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          manifest=plugin/.claude-plugin/plugin.json
          version="$(jq -r '.version' "$manifest")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=${manifest}::version is '${version}', not X.Y.Z, so it pins no tag a release can make"
            exit 1
          fi
          tag="sc-v${version}"

          # 0: it exists. 2 (--exit-code): it does not. Anything else is a
          # remote that could not be read, which is not "absent".
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "${tag} exists on origin."
            exit 0
          fi
          if [ "$status" -ne 2 ]; then
            echo "::error::git ls-remote could not read origin's tags (exit ${status}); ${tag} not checked"
            exit 1
          fi

          # The checkout is shallow; the bump commit and the release heads need
          # history. Fetched only here, on the rare path, not on every run.
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --quiet --unshallow origin
          fi
          bump="$(git log -1 --format=%H -G'"version"' -- "$manifest")"
          if [ -z "$bump" ]; then
            echo "::error file=${manifest}::${tag} is missing and no commit in history changed the version line"
            exit 1
          fi

          runs="$(mktemp)"
          gh_status=0
          gh run list --workflow release.yml --branch main --status completed --limit 50 --json databaseId,headSha > "$runs" || gh_status=$?
          if [ "$gh_status" -ne 0 ]; then
            echo "::error::gh run list failed (exit ${gh_status}); cannot tell whether a release since ${bump} should have made ${tag}"
            exit 1
          fi
          pairs="$(mktemp)"
          jq -r '.[] | "\(.databaseId) \(.headSha)"' "$runs" > "$pairs"

          examined=0
          offender=""
          offender_sha=""
          offender_tagjob=""
          while read -r run_id sha; do
            [ -n "$sha" ] || continue
            examined=$((examined + 1))
            if ! git cat-file -e "${sha}^{commit}" 2> /dev/null; then
              echo "release head ${sha} (run ${run_id}) is not in this clone; counted as not descended from ${bump}"
              continue
            fi
            git merge-base --is-ancestor "$bump" "$sha" || continue
            [ -z "$offender" ] || continue
            jobs="$(mktemp)"
            view_status=0
            gh run view "$run_id" --json jobs > "$jobs" || view_status=$?
            if [ "$view_status" -ne 0 ]; then
              echo "::error::gh run view ${run_id} failed (exit ${view_status}); cannot tell whether that release should have made ${tag}"
              exit 1
            fi
            verify="$(jq -r '[.jobs[] | select(.name == "verify") | .conclusion][0] // "absent"' "$jobs")"
            if [ "$verify" = "success" ]; then
              offender="$run_id"
              offender_sha="$sha"
              offender_tagjob="$(jq -r '[.jobs[] | select(.name | startswith("tag the plugin")) | .conclusion][0] // "absent"' "$jobs")"
            else
              echo "release run ${run_id} (${sha}) descends from ${bump}, but its verify is ${verify}, so plugin-tag did not run"
            fi
          done < "$pairs"
          echo "examined ${examined} completed release runs on main"

          if [ -n "$offender" ]; then
            echo "::error title=${tag} is missing::release run ${offender} of ${offender_sha} passed verify and descends from ${bump}, the commit that set version ${version}, but origin has no ${tag}; its plugin-tag job concluded '${offender_tagjob}'. Installs of plugin ${version} cannot fetch their bridge. Read that run's plugin-tag job."
            exit 1
          fi
          echo "::warning title=${tag} not tagged yet::${bump} set version ${version}; no release on main has passed verify since it, and the next one tags ${tag}."

  workflows:
    # NAME-KEEPER (CI-FOLD, #1799): the `release workflow wiring (actionlint) · ...` steps of
    # `quick-checks` run the check; this passes only on its verdict `success`.
    name: release workflow wiring (actionlint)
    runs-on: ubuntu-24.04
    needs: [changes, quick-checks]
    if: always() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'workflows')
    # release.yml runs only on main, so NOTHING on a pull request ever parses
    # it: a mistyped `needs.` reference, a step output that does not exist or
    # an input an action does not take would first fail during a release. Now
    # that the release depends on this workflow's build job, the two are linted
    # together. actionlint reads expressions, contexts, needs and outputs; it
    # runs nothing and needs no credentials.
    #
    # Its shellcheck and pyflakes passes are OFF: scripts/ is shellchecked by
    # the job above, and the inline run: blocks of these two files were never
    # held to shellcheck -- turning that on is a separate change, not this one.
    # Pinned, like every other scanner here, so the gate cannot change its mind
    # between two runs of the same commit.
    #
    # hotfix.yml likewise runs only on main, and it and release.yml run the
    # stages in .github/actions/release-*, whose inputs actionlint checks at
    # each `uses:` (owner decision 2026-10-08, observer proposal H). So does
    # accept.yml, which runs only when a release completes on main (cuts A
    # and C of the release timing report, the same day).
    #
    # iam-refusal-probe.yml is linted here for the same reason as release.yml,
    # more so: it runs only when the owner dispatches it, once, so a broken
    # expression in its revert gate would otherwise first show on that run.
    # auto-merge.yml likewise: a pull request that changes it runs main's
    # copy, not its own, so a broken expression would first show on the first
    # `ready` label after it merged. application.yml carries `ci-gate`, the
    # check main's ruleset requires: a broken expression there holds every pull
    # request.
    steps:
      - name: the folded check passed in `quick-checks`
        env:
          CHECK: release workflow wiring (actionlint)
          VERDICT: ${{ needs.quick-checks.outputs.workflows }}
        run: |
          set -euo pipefail
          if [ "${VERDICT}" = "success" ]; then
            echo "'${CHECK}' passed in its folded job"
            exit 0
          fi
          echo "::error::'${CHECK}' did not pass: its folded job's verdict is '${VERDICT:-none}'"
          exit 1

  ruff:
    # NAME-KEEPER (CI-FOLD, #1799): the `ruff check · ...` steps of
    # `quick-checks` run the check; this passes only on its verdict `success`.
    # THE HOUSE PYTHON LINTER IN CI (owner decision 2026-10-14; docs/ci.md
    # "ruff lint is the house Python linter"). PR 1289 pinned ruff 0.17.0 in
    # the root pyproject's dev group with a lint-only rule set (E4, E7, E9, F)
    # and made the repository pass it; until this job it ran only in the
    # pre-publish gate and by hand. `--only-dev` installs the dev group alone
    # -- the pinned ruff with it -- not the project, so this takes seconds.
    # `--output-format github` turns each finding into an annotation on its
    # line. Required through ci-gate's `needs`, like every job here.
    name: ruff check
    runs-on: ubuntu-24.04
    needs: [changes, quick-checks]
    if: always() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'ruff')
    steps:
      - name: the folded check passed in `quick-checks`
        env:
          CHECK: ruff check
          VERDICT: ${{ needs.quick-checks.outputs.ruff }}
        run: |
          set -euo pipefail
          if [ "${VERDICT}" = "success" ]; then
            echo "'${CHECK}' passed in its folded job"
            exit 0
          fi
          echo "::error::'${CHECK}' did not pass: its folded job's verdict is '${VERDICT:-none}'"
          exit 1

  changes:
    # WHAT THIS CHANGE CAN REACH, decided once for every job below (owner
    # request 2026-10-07; it grew out of the swarm-ui gate of #605, which it
    # still is). On a push to main, a queue entry or a dispatch, everything:
    # main is the build release.yml promotes, so it is tested whole. On a pull
    # request it diffs `base...head` and writes four outputs:
    #
    #   app     any changed file matches APP_PATHS -- the list that was this
    #           workflow's `on.pull_request.paths` until 2026-10-07. When false,
    #           every job but this one and `ci-gate` is skipped, exactly as the
    #           whole workflow used to be filtered out.
    #   python  `all` when a changed file in APP_PATHS lies outside docs/ and
    #           apps/swarm-ui/; `subset` when every one is under those two, and
    #           then the unit shards run only the test files that read them
    #           (`areas` says which; the pick step finds the files); `none`
    #           when app is false. A docs-only change still runs the unit tests
    #           that read docs/ -- test_docs_describe_what_was_built and ~130
    #           others hold docs/ to the code, and skipping them would let a
    #           docs-only pull request break main.
    #   areas   `docs`, `swarm-ui`, or both, for `subset`.
    #   ui      the change is in apps/swarm-ui/**, the API's route surface
    #           (apps/swarm-api/swarm_api/routes/** and swarm_api/main.py, which
    #           the UI's reads are written against), or this file. #601 -- a
    #           scheduler-only change -- ran ~9 minutes of jsdom and went red on
    #           a load flake in code it never touched.
    #
    # A GATE JOB, NOT `on.pull_request.paths`: a path filter skips the WHOLE
    # workflow, and `ci-gate` below must report on every pull request. A job
    # skipped by its own `if:` reports `skipped`, which GitHub counts as
    # passing and which every aggregating job below counts as a pass. If THIS
    # job fails, every job that reads it is skipped, and the aggregators and
    # `ci-gate` fail because its own result is not `success` -- a broken gate
    # is never read as "nothing changed". Any doubt -- a base it cannot diff
    # against -- runs everything.
    #
    # tests/unit/scripts/test_ui_changes_gate.py runs this step over the
    # path-filter matrix (docs-only, UI-only, both, neither, a near miss).
    name: what this change reaches
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    # Job-level permissions REPLACE the workflow's. actions: read lists the
    # `tested-tree-<tree>` records and the runs that wrote them, and
    # pull-requests: read names the pull request a push to main merged (the
    # `reuse` step, main and same-repository pull requests). Nothing here
    # writes or mints a cloud token.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      app: ${{ steps.diff.outputs.app }}
      # `select` passes the diff's python and areas through unchanged, except
      # on a pull request with python=all, where it narrows them (B2).
      python: ${{ steps.select.outputs.python }}
      areas: ${{ steps.select.outputs.areas }}
      tests: ${{ steps.select.outputs.tests }}
      # The unit shards' matrix, sized by the measured weight of what runs.
      unit_shards: ${{ steps.shards.outputs.shards }}
      # A pull request's changed paths as a JSON list, for the shell job;
      # empty everywhere else, which checks every script.
      changed: ${{ steps.changed.outputs.changed }}
      ui: ${{ steps.diff.outputs.ui }}
      images: ${{ steps.images.outputs.images }}
      # The JSON list of job ids this run skips because a run of the
      # identical tree passed them: main's push run (B1) or a pull request's
      # run (CI-TREE-REUSE, #1798). Empty everywhere else; every job reads it
      # as `fromJSON(needs.changes.outputs.reused || '[]')`.
      reused: ${{ steps.reuse.outputs.reused }}
      # The URL of the run those jobs passed in; ci-gate cites it.
      reused_from: ${{ steps.reuse.outputs.reused_from }}
    steps:
      - uses: actions/checkout@v5
        with:
          # `base...head` needs both commits and their merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: diff the pull request against its base
        id: diff
        # Values reach the shell through env:, never through an expression in run:.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # One pattern per line: a path, or `<dir>/**` for everything under
          # it. `#` lines are the reasons, kept beside what they explain. Any
          # other glob shape is refused rather than matched with rules GitHub's
          # filter did not share. scripts/ci-gate.sh reads terraform.yml's
          # `paths:`, not this list: this workflow always runs.
          APP_PATHS: |
            apps/**
            images/**
            kubernetes/**
            scripts/**
            tests/**
            docs/**
            # test_reconciler_gke_namespaced.py holds the reconciler's log-metric
            # filters in this file to the lines repair.py writes. Without this, a PR
            # touching only alerts.tf never ran that pin. (Other unit tests read other
            # terraform files and are not triggered by them either; not widened here.)
            terraform/modules/monitoring/alerts.tf
            # The workspace-apply image copies this file in (common.sh reads the
            # platform account ids off it for the call guard), so a PR changing only
            # it must build that image. test_every_image_input_fires_application_yml_
            # on_a_pull_request holds every image input to this list.
            terraform/modules/service_account_ids/main.tf
            # tests/unit/mcp reads the plugin and the marketplace manifest -- its
            # skills, its server declaration, the version its bridge is pinned to.
            # Without these, a PR that changed only plugin.json ran none of that.
            plugin/**
            .claude-plugin/**
            pyproject.toml
            uv.lock
            Makefile
            README.md
            CLAUDE.md
            CONTRACT.md
            .github/workflows/application.yml
            # tests/unit/scripts/test_release_reuses_ci_images.py reads release.yml
            # to hold it to reusing this workflow's build. release.yml never runs on
            # a pull request, so without this a PR touching only it ran nothing.
            .github/workflows/release.yml
            # The hotfix lane, and the stages both lanes run: held to their shape
            # by tests/unit/scripts/test_hotfix_release.py and the release tests,
            # which flatten each stage into the job that runs it. Neither runs on a
            # pull request.
            .github/workflows/hotfix.yml
            .github/actions/**
            # Post-deploy acceptance runs only after a release completes on main,
            # so a pull request is the only place it is linted (actionlint below)
            # and held to its shape (tests/unit/scripts/test_release_acceptance_job.py).
            .github/workflows/accept.yml
            # tests/unit/scripts/test_issue_forms.py validates the issue forms and
            # the label declaration. Without these a PR editing only a form would run
            # nothing -- and a form GitHub rejects fails nowhere a reviewer looks.
            .github/ISSUE_TEMPLATE/**
            .github/labels.yml
            # The IAM refusal probe runs only when the owner dispatches it, so a pull
            # request is the only place it is linted (actionlint below) and held to
            # its shape (tests/unit/scripts/test_iam_refusal_probe.py).
            .github/workflows/iam-refusal-probe.yml
            # The CI fixer runs only after a red CI on a swarm branch, so a PR is the
            # only place it is linted and held to its shape (test_ci_fix.py).
            .github/workflows/ci-fix.yml
            # auto-merge.yml runs only on pull_request_target, from main's copy, so
            # a pull request changing it never runs it: this is the one place it is
            # linted and held to its shape (tests/unit/scripts/test_auto_merge_workflow.py).
            .github/workflows/auto-merge.yml
            # ci-gate is the check the ruleset requires; since 2026-10-07 it is the
            # last job of this workflow, and scripts/ci-gate.sh is what it runs for
            # terraform.yml (already under scripts/**; named for the record).
            scripts/ci-gate.sh
            # What every image build's context is filtered through, so an input of
            # every image (`build-images.sh --inputs`). Without these a pull request
            # changing only one started no run, and `build changed images without
            # pushing` never saw it (tests/unit/scripts/test_build_images_pr_check.py
            # holds every image input to this list).
            .dockerignore
            .gcloudignore
            # The swarm-verify image copies install/ in: the hourly doctor
            # (swarm-doctor, DAYONE-DOCTOR-1) runs the release's manifest probes, so a
            # pull request changing only the manifest must build that image.
            install/**
        run: |
          set -euo pipefail
          emit() {
            { echo "app=$1"; echo "python=$2"; echo "areas=$3"; echo "ui=$4"; } >> "$GITHUB_OUTPUT"
            echo "app=$1 python=$2 areas=${3:-(none)} ui=$4"
          }
          if [ "${EVENT}" != "pull_request" ]; then
            echo "${EVENT}: every job runs"
            emit true all "" true
            exit 0
          fi
          prefixes=()
          exact=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            case "$line" in ""|"#"*) continue ;; esac
            case "$line" in
              */\*\*) stem="${line%\*\*}" ;;
              *) stem="" ;;
            esac
            if [ -n "$stem" ]; then
              case "$stem" in *'*'*|*'?'*|*'['*) echo "::error::APP_PATHS: ${line} is neither a path nor <dir>/**"; exit 1 ;; esac
              prefixes+=("$stem")
            else
              case "$line" in *'*'*|*'?'*|*'['*) echo "::error::APP_PATHS: ${line} is neither a path nor <dir>/**"; exit 1 ;; esac
              exact+=("$line")
            fi
          done <<< "${APP_PATHS}"
          if [ "${#prefixes[@]}" -eq 0 ]; then
            echo "::error::APP_PATHS is empty: nothing would ever run"
            exit 1
          fi
          # Three dots: the change since the merge base, which is what the pull
          # request merges. base.sha does not move when main moves, so two dots
          # would also count everything main gained since the PR was opened.
          if ! git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed"; then
            echo "::warning::could not diff ${BASE_SHA}...${HEAD_SHA}; running every job rather than guessing"
            emit true all "" true
            exit 0
          fi
          app=0 others=0 docs=0 ui_src=0
          : > "${RUNNER_TEMP}/app"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            hit=0
            for stem in "${prefixes[@]}"; do
              case "$file" in "$stem"?*) hit=1; break ;; esac
            done
            if [ "$hit" -eq 0 ] && [ "${#exact[@]}" -gt 0 ]; then
              for name in "${exact[@]}"; do
                if [ "$file" = "$name" ]; then hit=1; break; fi
              done
            fi
            [ "$hit" -eq 1 ] || continue
            app=$((app + 1))
            printf '%s\n' "$file" >> "${RUNNER_TEMP}/app"
            case "$file" in
              docs/*) docs=1 ;;
              apps/swarm-ui/*) ui_src=1 ;;
              *) others=$((others + 1)) ;;
            esac
          done < "${RUNNER_TEMP}/changed"
          total="$(grep -c . "${RUNNER_TEMP}/changed" || true)"
          grep -E '^(apps/swarm-ui/|apps/swarm-api/swarm_api/routes/|apps/swarm-api/swarm_api/main\.py$|\.github/workflows/application\.yml$)' \
            "${RUNNER_TEMP}/app" > "${RUNNER_TEMP}/ui" || true
          hits="$(grep -c . "${RUNNER_TEMP}/ui" || true)"
          echo "${total} changed file(s): ${app} reach this workflow, ${hits} of them swarm-ui"
          sed 's/^/  /' "${RUNNER_TEMP}/app"
          ui=false
          if [ "${hits}" -gt 0 ]; then ui=true; fi
          if [ "${app}" -eq 0 ]; then
            emit false none "" false
          elif [ "${others}" -gt 0 ]; then
            emit true all "" "${ui}"
          else
            areas=""
            if [ "${docs}" -eq 1 ]; then areas="docs"; fi
            if [ "${ui_src}" -eq 1 ]; then areas="${areas:+${areas} }swarm-ui"; fi
            emit true subset "${areas}" "${ui}"
          fi

      - name: which unit tests the change reaches
        id: select
        # B2 (owner decision 2026-10-14, docs/ci.md "A pull request runs the
        # unit tests its change reaches"). On a pull request the diff step
        # says python=all for any change outside docs/ and apps/swarm-ui/,
        # and every shard ran every file. Here, for that case only, the
        # change is narrowed to the files it reaches:
        # scripts/changed-guards.sh's selection (the repository-wide guards
        # and every test naming a changed path) plus every test that imports
        # a changed module, through any chain, in scripts/lib/select_unit_tests.py,
        # which also says when it cannot vouch for a selection and keeps
        # python=all: a workflow, conftest, pyproject or uv.lock change, the
        # frozen contract, more than 40 changed paths, or a selection that
        # is half the suite anyway.
        #
        # Every other case passes the diff step's answer through: a push to
        # main, a merge-train branch, a queue entry or a dispatch runs the
        # WHOLE suite, as it always has -- that run is what catches a test
        # this selection missed, one merge later.
        env:
          EVENT: ${{ github.event_name }}
          PYTHON: ${{ steps.diff.outputs.python }}
          AREAS: ${{ steps.diff.outputs.areas }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          passthrough() {
            { echo "python=${PYTHON}"; echo "areas=${AREAS}"; echo "tests="; } >> "$GITHUB_OUTPUT"
            echo "python=${PYTHON}: $1"
          }
          if [ "${EVENT}" != "pull_request" ] || [ "${PYTHON}" != "all" ]; then
            passthrough "not narrowed here"
            exit 0
          fi
          if ! git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/select-changed"; then
            passthrough "could not diff ${BASE_SHA}...${HEAD_SHA}; running the whole suite"
            exit 0
          fi
          # changed-guards.sh's own selection, read from the same diff. Its
          # stdout lists the test files; a failure of it runs everything.
          if ! ./scripts/changed-guards.sh --files "${RUNNER_TEMP}/select-changed" --list \
               > "${RUNNER_TEMP}/select-guards"; then
            passthrough "changed-guards.sh --list failed; running the whole suite"
            exit 0
          fi
          python3 scripts/lib/select_unit_tests.py --changed "${RUNNER_TEMP}/select-changed" \
            --guards "${RUNNER_TEMP}/select-guards" \
            --github-output "${GITHUB_OUTPUT}" --summary "${GITHUB_STEP_SUMMARY}"

      - name: how many unit shards this run needs
        id: shards
        # LANE CI-EARLY (part of #1694, owner decision 2026-10-20). The count
        # follows the measured weight of the files this run will test, about
        # 600 s a shard up to eight (scripts/lib/unit_shards.py says why): a
        # fixed four left a full run's shard at ~1,750 s, a 455-501 s p90
        # against a 152-188 s median. The pick step splits with the same code.
        env:
          PYTHON_MODE: ${{ steps.select.outputs.python }}
          PYTHON_AREAS: ${{ steps.select.outputs.areas }}
          PYTHON_TESTS: ${{ steps.select.outputs.tests }}
          DURATIONS: tests/unit/scripts/unit_test_durations.json
        run: |
          set -euo pipefail
          python3 scripts/lib/unit_shards.py count

      - name: the pull request's changed paths, for shellcheck
        id: changed
        # The shell job checks only what a pull request's scripts reach
        # (scripts/lib/shellcheck-ci.sh). Empty on any other event, or when
        # the diff cannot be read: the shell job then checks every script.
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "pull_request" ] \
             || ! git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/shell-changed"; then
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "${EVENT}: shellcheck checks every script"
            exit 0
          fi
          echo "changed=$(jq -R -s -c 'split("\n") | map(select(length > 0))' "${RUNNER_TEMP}/shell-changed")" >> "$GITHUB_OUTPUT"
          echo "$(grep -c . "${RUNNER_TEMP}/shell-changed" || true) changed path(s) handed to the shell job"

      - name: reuse what a run of this exact tree already passed
        id: reuse
        # B1 (owner decision 2026-10-14, docs/ci.md "Main reuses the tested
        # tree"). Main's push run only. Every other run RECORDS what it passed
        # (the `tested-tree` job at the bottom); this looks up the record of
        # this commit's tree and lists the test jobs main may skip. Exact or
        # nothing: the same tree hash, a run of this workflow in this
        # repository tied to this commit (the merged pull request's head, or a
        # train or queue commit with this tree), every reused job `success` in
        # the API -- and the unit shards only from a run of the WHOLE suite.
        # Any doubt, any API error: `[]`, and every job runs.
        # `build images` still needs `python`, `shell` and `manifests`; a
        # reused job is skipped by its own `if:`, so the build starts as soon
        # as what was not reused has passed.
        #
        # AND A PULL REQUEST FROM THIS REPOSITORY (CI-TREE-REUSE, #1798, owner
        # approval 2026-10-21). Since CI-EARLY a lane's `swarm/**` push runs
        # this workflow, and its pull request ran it again on the same tree:
        # 18% of all VM hours. `--event pull_request` reuses only a completed,
        # green push run of a `swarm/**` branch whose commit has the tree this
        # run checked out (refs/pull/N/merge) -- trees, never shas, so once
        # main moves nothing is reused. Never a fork's pull request. ci-gate's
        # `ci_reuse.py gate` step then passes a skip only when this step
        # listed it, and names the run.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/lib/ci_reuse.py find --repo "${REPO}" --sha "${SHA}" --event "${EVENT}" \
            --github-output "${GITHUB_OUTPUT}" --summary "${GITHUB_STEP_SUMMARY}"

      - name: does the change reach an image
        id: images
        # `images`: `true` when `build changed images without pushing` has
        # something to build, so on `false` that job is skipped by its own
        # `if:` and takes no runner (2026-10-09; runners were the largest
        # share of pull-request wall time, docs/ci.md "Where pull-request CI
        # time goes"). The answer is the one that job's plan step reads,
        # `build-images.sh --affected-by` over the same diff -- from the
        # Dockerfiles, never a list here. A separate step from the diff above,
        # which test_ui_changes_gate.py runs in a scratch repository with no
        # scripts/ in it.
        #
        # Doubt builds: on anything but a pull request (where the job does not
        # run at all), and when the diff cannot be read, it says `true` and the
        # job's own plan decides. If the script fails, this job fails, and
        # every gate fails with it -- never "nothing to build".
        env:
          EVENT: ${{ github.event_name }}
          APP: ${{ steps.diff.outputs.app }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != "pull_request" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            echo "${EVENT}: not a pull request, so not decided here"
            exit 0
          fi
          if [ "${APP}" != "true" ]; then
            echo "images=false" >> "$GITHUB_OUTPUT"
            echo "nothing reaches this workflow, so no image"
            exit 0
          fi
          if ! git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/image-changed"; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            echo "::warning::could not diff ${BASE_SHA}...${HEAD_SHA}; leaving the image decision to the build job"
            exit 0
          fi
          ./scripts/build-images.sh --affected-by "${RUNNER_TEMP}/image-changed" > "${RUNNER_TEMP}/image-list"
          count="$(grep -c . "${RUNNER_TEMP}/image-list" || true)"
          images=false
          if [ "${count:-0}" -gt 0 ]; then images=true; fi
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "the change reaches ${count:-0} image(s): $(paste -sd' ' "${RUNNER_TEMP}/image-list")"

  python-checks:
    # NAME-KEEPER (CI-FOLD, #1799): the `lock / contract / format / bridge install · ...` steps of
    # `quick-checks` run the check; this passes only on its verdict `success`.
    # Everything `format / unit tests` checked besides the unit suite: the lock,
    # the frozen contract, the format pass, the plugin bridge's install from
    # git, the destroy-guard self-test. Its own job so it runs BESIDE the
    # shards instead of in front of them; it never ran longer than ~2 minutes.
    # None of it can be reached by a change confined to docs/ or
    # apps/swarm-ui/, so it runs only when `changes` says python=all.
    name: lock / contract / format / bridge install
    runs-on: ubuntu-24.04
    needs: [changes, quick-checks]
    if: always() && (needs.changes.outputs.python == 'all' || needs.changes.outputs.python == 'selected') && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-checks')
    steps:
      - name: the folded check passed in `quick-checks`
        env:
          CHECK: lock / contract / format / bridge install
          VERDICT: ${{ needs.quick-checks.outputs.python-checks }}
        run: |
          set -euo pipefail
          if [ "${VERDICT}" = "success" ]; then
            echo "'${CHECK}' passed in its folded job"
            exit 0
          fi
          echo "::error::'${CHECK}' did not pass: its folded job's verdict is '${VERDICT:-none}'"
          exit 1

  quick-checks:
    # SUB-MINUTE CHECKS SHARE A JOB (CI-FOLD, #1799; owner approval
    # 2026-10-21; docs/ci.md "Sub-minute checks share a job"). Four checks
    # that each paid a VM create and boot (~52 s) for under a minute of work
    # run here as steps, each named `<the old job's name> · <what it does>`
    # and carrying its old job's `if:` -- its reach and its reuse clause -- so
    # a check the change does not reach, or a run of the identical tree
    # already passed, is skipped here exactly as its job was. Every check step
    # runs `!cancelled()`: one check failing never hides another's answer,
    # and any failed step fails this job, and ci-gate with it. The `verdict`
    # step gives each check one result, and its old job id -- `workflows`,
    # `ruff`, `manifests`, `python-checks` -- stays as a name-keeper on
    # ubuntu-24.04 that reports it under the old name.
    #
    # Step ids are the contract: `setup-*` is the shared setup, every step of
    # a check is `<old job id>-*`, and the last is `verdict`
    # (tests/unit/scripts/test_ci_fold.py). A step with neither prefix would
    # fail the job with no name-keeper saying which check it was.
    name: sub-minute checks (actionlint, ruff, manifests, python checks)
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    needs: changes
    # Runs when any one of its checks would have run.
    if: (needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'workflows')) || (needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'ruff')) || (needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'manifests')) || ((needs.changes.outputs.python == 'all' || needs.changes.outputs.python == 'selected') && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-checks'))
    outputs:
      workflows: ${{ steps.verdict.outputs.workflows }}
      ruff: ${{ steps.verdict.outputs.ruff }}
      manifests: ${{ steps.verdict.outputs.manifests }}
      python-checks: ${{ steps.verdict.outputs.python-checks }}
    env:
      ACTIONLINT_VERSION: "1.7.7"
      # actionlint_1.7.7_linux_amd64.tar.gz in the release's
      # actionlint_1.7.7_checksums.txt. A version bump changes both lines.
      ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
    steps:
      # The shared setup: every check here needed some of it, and none of it
      # carries an `if:`, so a skipped setup step can never read as a failed
      # one in the verdict.
      - name: setup · checkout
        id: setup-checkout
        uses: actions/checkout@v5

      - name: setup · uv
        id: setup-uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: setup · python
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: setup · kubectl
        id: setup-kubectl
        uses: azure/setup-kubectl@v5
        with:
          # Pinned. An old client silently drops fields it does not understand,
          # so a manifest can "validate" while losing its security context.
          version: ${{ env.KUBECTL_VERSION }}

      # --- release workflow wiring (actionlint) ------------------------------
      # Why these seven files: the `workflows` name-keeper's comment.
      #
      # THE BINARY IS PINNED BY DIGEST AND CACHED (2026-10-14). This step
      # used to fetch rhysd's download-actionlint.bash and let it curl the
      # release tarball into tar. That curl has no -f and no retry, so when
      # GitHub's release download answered an error page -- 92 bytes on
      # run 38261213312, 1,812 bytes after 19 s on run 38205803599 -- tar
      # read it as the archive ("gzip: stdin: not in gzip format") and the
      # job failed; both passed on a rerun at the same commit. Now the tarball
      # comes from the release URL directly, with -f and retries on any
      # error, its sha256 must equal the one rhysd's checksums file lists for
      # this version, and the cache below means most runs download nothing.
      - name: release workflow wiring (actionlint) · restore the pinned actionlint
        id: workflows-cache
        if: ${{ !cancelled() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'workflows') }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/actionlint-bin
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-${{ env.ACTIONLINT_SHA256 }}

      - name: release workflow wiring (actionlint) · download the pinned actionlint
        id: workflows-download
        if: ${{ !cancelled() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'workflows') && steps.workflows-cache.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 --max-time 120 \
            -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/actionlint-bin"
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}/actionlint-bin" actionlint

      - name: release workflow wiring (actionlint) · actionlint release.yml, hotfix.yml, accept.yml, application.yml, iam-refusal-probe.yml, ci-fix.yml and auto-merge.yml
        id: workflows-actionlint
        if: ${{ !cancelled() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'workflows') }}
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/actionlint-bin/actionlint" -version
          # `environment: {deployment: false}` is valid GitHub syntax (jobs that read
          # repo-secrets without creating a deployment, REPO-SECRETS-ENV) that
          # actionlint 1.7.7 does not know yet; ignore exactly that one message.
          "${RUNNER_TEMP}/actionlint-bin/actionlint" -shellcheck= -pyflakes= \
            -ignore 'unexpected key "deployment" for "environment" section' \
            .github/workflows/release.yml .github/workflows/hotfix.yml \
            .github/workflows/accept.yml .github/workflows/application.yml \
            .github/workflows/iam-refusal-probe.yml .github/workflows/ci-fix.yml \
            .github/workflows/auto-merge.yml

      # --- ruff check ----------------------------------------------------------
      # Why: the `ruff` name-keeper's comment.
      - name: ruff check · ruff check
        id: ruff-check
        if: ${{ !cancelled() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'ruff') }}
        run: uv run --frozen --only-dev ruff check --output-format github .

      # --- kubernetes manifests ----------------------------------------------
      # The offline manifest validator parses YAML; the runner's system python
      # has no PyYAML. Installing it here keeps the validator free of a cluster
      # AND free of the repo's virtualenv.
      - name: kubernetes manifests · install PyYAML
        id: manifests-pyyaml
        if: ${{ !cancelled() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'manifests') }}
        run: python3 -m pip install --quiet pyyaml

      - name: kubernetes manifests · render and validate
        # The repository's own validator, not a second implementation.
        #
        # The files in kubernetes/ are TEMPLATES with __TOKEN__ placeholders, and
        # `kubectl apply --dry-run` over them reports errors that are not errors
        # -- which, as scripts/lib/validate-manifests.sh's own header says, is
        # worse than not checking at all, because it trains people to ignore the
        # output. CI validated the raw templates while `make lint` validated the
        # rendered ones, so the correct validator existed and was not the one CI
        # ran. This renders with kubernetes/render.py first, exactly as an
        # operator does, and additionally fails on any placeholder that survives.
        #
        # The posture assertions live once, in that script, which is also what
        # `make lint` runs: "every rule that got restated in a second place
        # here has since drifted."
        id: manifests-validate
        if: ${{ !cancelled() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'manifests') }}
        run: ./scripts/lib/validate-manifests.sh

      # --- lock / contract / format / bridge install -------------------------
      # What and why: the `python-checks` name-keeper's comment.
      - name: lock / contract / format / bridge install · the lock agrees with every pyproject.toml
        # `uv sync --frozen` installs what uv.lock says without checking it
        # against the pyproject files, so a stale or hand-edited lock passed
        # every job here (#76). One check is enough: every job reads this one
        # lock. tests/unit/scripts/test_uv_lock_check_step.py holds it here.
        id: python-checks-lock
        if: ${{ !cancelled() && (needs.changes.outputs.python == 'all' || needs.changes.outputs.python == 'selected') && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-checks') }}
        run: uv lock --check

      - name: lock / contract / format / bridge install · sync
        id: python-checks-sync
        if: ${{ !cancelled() && (needs.changes.outputs.python == 'all' || needs.changes.outputs.python == 'selected') && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-checks') }}
        run: uv sync --frozen --all-extras --dev

      - name: lock / contract / format / bridge install · the frozen contract is unchanged, or its change is recorded as accepted
        id: python-checks-contract
        # apps/common/swarm_common is frozen by CONTRACT.md. Every other
        # component was written against those exact types, so a change there
        # breaks all of them at once and must be a deliberate, discussed act.
        #
        # THIS STEP COULD NOT FAIL UNTIL 2026-09-24. It diffed `base...HEAD`
        # -- three dots, which needs a merge base -- in a depth-1 checkout of
        # the PR's merge commit, which has none. git exited 128 ("no merge
        # base"), the pipe into `grep -q` failed, the `if` read that as "no
        # change", and the step printed "frozen contract untouched" on every
        # PR, including #1, which edited models.py and profiles.py. Measured
        # in run 36036034784, job 107756241218.
        #
        # AND THEN IT COMPARED THE WRONG COMMITS. The first repair diffed
        # `pull_request.base.sha` against the merge commit. GitHub does not
        # move base.sha when main moves, so that diff was everything main had
        # gained since the PR was opened, plus the PR (run 36039462416:
        # "Merge 9c56167 into d45b1d69" compared against 0fac6d6). The script
        # now compares the merge commit's FIRST PARENT -- main as this run
        # merged into it -- with the merge commit, which is exactly the PR's
        # change as it would merge. It fetches that parent itself, so the
        # checkout above stays depth 1.
        #
        # A CHANGE PASSES ONLY WHEN THE PR RECORDS ITS ACCEPTANCE. Updated
        # deliberately for contract requests 17 and 18, which the owner
        # accepted in session on 2026-09-24 (PR #44). The logic lives in the
        # script so that what it compares against is tested
        # (tests/unit/scripts/test_frozen_contract_check.py).
        if: ${{ !cancelled() && (needs.changes.outputs.python == 'all' || needs.changes.outputs.python == 'selected') && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-checks') && github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/lib/check-frozen-contract.sh --pr-base "${PR_BASE_SHA}" --pr-head "${PR_HEAD_SHA}"

      - name: lock / contract / format / bridge install · format check
        id: python-checks-format
        if: ${{ !cancelled() && (needs.changes.outputs.python == 'all' || needs.changes.outputs.python == 'selected') && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-checks') }}
        run: |
          uv run python -m compileall -q apps tests
          # Fail on syntax-level problems and obviously dead imports without
          # imposing a formatter this repository has not adopted.
          uv run python - <<'PY'
          import pathlib, ast, sys
          bad = []
          for path in pathlib.Path("apps").rglob("*.py"):
              src = path.read_text()
              try:
                  ast.parse(src)
              except SyntaxError as exc:
                  bad.append(f"{path}: {exc}")
              if "\t" in src:
                  bad.append(f"{path}: literal tab in source")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("ok")
          PY

      - name: lock / contract / format / bridge install · the plugin's bridge installs from git, the way the plugin fetches it
        id: python-checks-bridge
        # A marketplace install copies ONLY plugin/, so the bridge reaches a
        # user one way: plugin.json's `uv tool run --from 'swarm-mcp @
        # git+https://github.com/...#subdirectory=apps/swarm-mcp'`, with
        # swarm-common arriving because uv rewrites swarm-mcp's relative path
        # source into the same commit. The unit run above holds the
        # declaration's shape offline and skips this; here the same file
        # installs it -- at THIS commit, since the release tag it pins does not
        # exist until the merge is tagged -- from a cold uv cache, outside the
        # checkout, and talks MCP to it. Network: github.com and pypi.org.
        #
        # RUN EVEN WHEN THE UNIT STEP FAILED. It is an independent answer --
        # "does a marketplace install start" -- and skipping it behind any
        # unrelated unit failure hid that answer in the one run that proved a
        # test red (#62, run 36091955032).
        #
        # THE MERGE COMMIT, NOT THE PR HEAD. The test compares what it installs
        # with the checkout's TOOLS, and a pull_request checkout is
        # refs/pull/<n>/merge, which carries main. Installing the head instead
        # compared a branch behind main with main merged into it: #775 went red
        # on `swarm_tenants`, which main's #770 added and the head predates.
        # github.sha is the commit this job checked out; GitHub serves it by
        # sha while the pull request's merge ref exists.
        if: ${{ !cancelled() && (needs.changes.outputs.python == 'all' || needs.changes.outputs.python == 'selected') && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-checks') }}
        env:
          SWARM_BRIDGE_INSTALL_REF: ${{ github.sha }}
        run: uv run pytest tests/unit/mcp/test_plugin_bridge_install.py -q -s

      - name: lock / contract / format / bridge install · destroy-guard self-test
        id: python-checks-destroy-guard
        if: ${{ !cancelled() && (needs.changes.outputs.python == 'all' || needs.changes.outputs.python == 'selected') && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-checks') }}
        # The guard is the only thing between `make destroy` and another team's
        # production cluster, so it is verified on every run, not before use.
        run: ./scripts/destroy.sh --self-test

      - name: verdict · each folded check's own result, for its name-keeper
        # One result per check, by step id: `success` only when every shared
        # `setup-*` step succeeded, none of the check's own `<old job id>-*`
        # steps failed or was cancelled, and at least one of them ran;
        # `skipped` when none ran; `failure` otherwise. Each name-keeper
        # passes on `success` alone (docs/ci.md "Sub-minute checks share a
        # job"). The same text in application.yml, security.yml and
        # terraform.yml; tests/unit/scripts/test_ci_fold.py holds them equal.
        id: verdict
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          CHECKS: workflows ruff manifests python-checks
        run: |
          set -euo pipefail
          read -r -a checks <<< "${CHECKS}"
          for check in "${checks[@]}"; do
            result="$(printf '%s\n' "${STEPS}" | jq -r --arg check "${check}" '
              [to_entries[] | select(.key | startswith("setup-")) | .value.outcome] as $setup
              | [to_entries[] | select(.key | startswith($check + "-")) | .value.outcome] as $own
              | if ($setup | length) == 0 or any($setup[]; . != "success") then "failure"
                elif any($own[]; . == "failure" or . == "cancelled") then "failure"
                elif any($own[]; . == "success") then "success"
                else "skipped" end')"
            echo "${check}: ${result}"
            echo "${check}=${result}" >> "${GITHUB_OUTPUT}"
          done

  python-unit:
    # THE UNIT SUITE, SHARDED BY FILE (owner request 2026-10-07). As one job it
    # was the longest required job at ~673 s, and with strict up-to-date
    # merging every merge waits for a full CI run at main+PR, so its wall time
    # was most of the time between merges (82 % on the night of 2026-10-07).
    # The `pick` step splits tests/unit's files into `strategy.job-total`
    # shards: longest-first onto the lightest shard (LPT), weighted by
    # tests/unit/scripts/unit_test_durations.json, a file it has no weight for
    # at the median. Deterministic, so every shard computes the same split and
    # takes its own part: every file runs exactly once
    # (tests/unit/scripts/test_unit_shards.py runs the step for every shard).
    #
    # HOW MANY SHARDS: as many as the run's measured weight needs, ~600 s a
    # shard, at most eight (LANE CI-EARLY, part of #1694, 2026-10-20). The
    # fixed four were sized for ~2,950 s; by 2026-10-20 the weights summed to
    # ~7,000 s and a full run's shard took a 455-501 s p90 against a 152-188 s
    # median. The `changes` job computes the list (scripts/lib/unit_shards.py
    # count) and the matrix reads it; the pick step reads `strategy.job-total`.
    name: unit tests (${{ matrix.shard }}/${{ strategy.job-total }})
    # A HUNG SHARD MUST FAIL, NOT HOLD ITS RUNNER FOR SIX HOURS. On 2026-10-14
    # eight shards sat "in progress" for 51-306 minutes (self-hosted and hosted
    # alike); `build images` needs this job, so release.yml timed out waiting for
    # a build that never started. A shard runs ~12 minutes; 30 is the ceiling.
    # faulthandler_timeout on the pytest steps dumps every thread of a test past
    # 5 minutes, so the run that times out names the test that hung.
    timeout-minutes: 30
    # SELF-HOSTED (owner decision 2026-10-12, sagaxyz/ai-studio#336): the ephemeral
    # bogdan-ci VMs, with fork PRs kept on a GitHub-hosted image. The expression is
    # the one tests/unit/scripts/test_fork_prs_off_self_hosted.py enforces, and
    # SELF_HOSTED_CI=off (a repo variable) sends it to ubuntu-24.04 as well.
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    needs: changes
    if: needs.changes.outputs.python != 'none' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'python-unit')
    strategy:
      # One red shard must not cancel the others: the next push wants every
      # failure, not the first.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.unit_shards) }}
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: read the platform's Node major for the WHATWG URL table
        id: node
        # tests/unit/control_plane/test_url_refusal_whatwg.py drives Node's own
        # `URL` class to measure which host a browser opens for each URL the
        # browser profile's `url_refusal` judges (contract request 32, #345),
        # and it FAILS under CI without `node` rather than skipping. This job
        # never installed Node; it passed on the runner image's own, which is
        # someone else's choice. The major comes from the one place the
        # platform states it, `ARG NODE_IMAGE` in images/swarm-ui/Dockerfile,
        # read exactly as the ui job reads it -- not a third literal here.
        # Unlike the ui job there is no step comparing the running Node with
        # it: nothing here is built or bundled, and WHATWG `URL` is the same
        # on every supported line, so a fallback to the runner's Node (what an
        # empty version would mean) changes no result. The table's own
        # fail-under-CI is the guard that matters.
        # tests/unit/scripts/test_python_job_node.py holds this step here.
        run: |
          set -euo pipefail
          dockerfile=images/swarm-ui/Dockerfile
          majors="$(sed -nE 's/^ARG NODE_IMAGE=node:([0-9]+)[^0-9].*/\1/p' "$dockerfile")"
          count="$(printf '%s' "$majors" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error file=${dockerfile}::expected exactly one 'ARG NODE_IMAGE=node:<major>-...' line, found ${count}"
            exit 1
          fi
          echo "major=${majors}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node.outputs.major }}

      - name: sync
        run: uv sync --frozen --all-extras --dev

      - name: allow unprivileged user namespaces, so the real-kill reap test runs
        # tests/unit/worker/test_procman_reap.py runs the worker's REAL
        # `os.kill(-1, SIGKILL)` -- the pre-publish reap (procman.py) -- inside
        # `unshare --user --pid`, the only place it can run without killing
        # the test runner itself. ubuntu-24.04 restricts unprivileged user
        # namespaces through AppArmor: measured in run 36214178409, `unshare:
        # write failed /proc/self/uid_map: Operation not permitted`. Before
        # that the test SKIPPED unnoticed (run 36213792704); under CI it now
        # fails instead. This relaxes the restriction on this job's VM only,
        # which GitHub discards when the job ends. Guarded, so an image that
        # does not have the setting simply skips the step.
        #
        # ON THE bogdan-ci RUNNERS (PR 1184) the job runs as the image's
        # `runner` user, and in run 38267927535 all four shards stopped here on
        # `sudo: a password is required`. The image now grants that user
        # passwordless sudo (sagaxyz/ai-studio deploy/ci-runners/vm/
        # provision-image.sh, as GitHub's own image does), and `sudo -n` makes
        # an image without it fail HERE, by name, instead of waiting on a
        # password prompt. A knob already at 0 needs no sudo at all.
        run: |
          set -euo pipefail
          knob=/proc/sys/kernel/apparmor_restrict_unprivileged_userns
          if [ ! -e "$knob" ]; then
            echo "no $knob on this image; nothing to relax"
          elif [ "$(cat "$knob")" = 0 ]; then
            echo "$knob is already 0 on this runner; nothing to relax"
          elif sudo -n true 2>/dev/null; then
            sudo -n sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "::error::$knob is $(cat "$knob") and user $(id -un) on runner ${RUNNER_NAME:-?} has no passwordless sudo to relax it; the real-kill reap test (tests/unit/worker/test_procman_reap.py) cannot run here"
            exit 1
          fi

      - name: pick this shard's test files
        id: pick
        # The selection (all, selected, or a docs/ or swarm-ui subset) and the
        # longest-first split by measured weight live in
        # scripts/lib/unit_shards.py, which the `changes` job's count shares,
        # so the matrix and the split never disagree on what runs.
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          PYTHON_MODE: ${{ needs.changes.outputs.python }}
          PYTHON_AREAS: ${{ needs.changes.outputs.areas }}
          # python=selected: the test files the change reaches (B2), space-separated.
          PYTHON_TESTS: ${{ needs.changes.outputs.tests }}
          DURATIONS: tests/unit/scripts/unit_test_durations.json
          SHARD_FILES: ${{ runner.temp }}/shard-files
        run: |
          set -euo pipefail
          python3 scripts/lib/unit_shards.py pick

      - name: unit tests
        # No emulator, no credentials. The admission logic is pure so the
        # concurrency invariant can be tested exhaustively and fast.
        # -n auto, for the reason the integration step below gives at length.
        # SWARM_REQUIRE_REAL_REAP: the step above made private PID namespaces
        # possible, so the real-kill test must run here, never skip
        # (tests/unit/worker/test_procman_reap.py says why).
        #
        # AN EMPTY SHARD RUNS NOTHING. `pytest` with no file arguments runs its
        # testpaths -- the whole suite -- so a subset that left this shard no
        # file must not reach it.
        #
        # xunit1 puts each test's `file` in the report, which the next step
        # sums into this shard's measured weights.
        #
        # `--dist worksteal`, NOT xdist's default `load` (measured 2026-10-09,
        # docs/ci.md "Where pull-request CI time goes"). Shard 3 of 4 was the
        # last job to finish in 8 of 17 pull-request runs: ~347 s of tests
        # against ~145-235 s for the others, although the pick step gives every
        # shard the same measured test time. The weights were right; the
        # schedule inside the shard was not. `load` hands each worker a fixed
        # block up front, and shard 3's long tests -- six in
        # test_startup_is_loud.py that wait out real DNS and network back-offs,
        # 30-67 s each -- sit together and land on one worker. `worksteal` lets
        # an idle worker take half of a busy one's queue. Shard 3 alone, 4
        # workers, same files: 404 s under `load`, 287 s under `worksteal`,
        # against a floor of 276 s (its summed test time / 4).
        if: steps.pick.outputs.count != '0'
        env:
          SWARM_REQUIRE_REAL_REAP: "1"
          SHARD_FILES: ${{ runner.temp }}/shard-files
          JUNIT: ${{ runner.temp }}/unit.xml
        run: |
          set -euo pipefail
          mapfile -t files < "${SHARD_FILES}"
          uv run pytest -q -n auto --dist worksteal -o faulthandler_timeout=300 -m "not flaky" -o junit_family=xunit1 --junitxml="${JUNIT}" "${files[@]}"

      - name: quarantined unit tests (report only, never fail the gate)
        # THE FLAKY-TEST QUARANTINE (owner decision 2026-10-14, docs/ci.md
        # "Flaky tests and the quarantine"). tests/flaky.txt lists tests that
        # failed and passed at the same commit and whose cause is not fixed
        # yet; tests/unit/conftest.py marks each `flaky`, the step above
        # deselects them (`-m "not flaky"`), and this one still runs them, so
        # the day one starts failing every time is visible here rather than
        # hidden by a skip. It never fails the job: a failure is a warning
        # annotation and a line in the step summary. Exit 5 is pytest's "no
        # test selected": this shard holds no quarantined test.
        # Not `--junitxml`: the shard weights are the gating run's.
        if: ${{ !cancelled() && steps.pick.outputs.count != '0' }}
        continue-on-error: true
        env:
          SWARM_REQUIRE_REAL_REAP: "1"
          SHARD_FILES: ${{ runner.temp }}/shard-files
        run: |
          set -euo pipefail
          mapfile -t files < "${SHARD_FILES}"
          rc=0
          uv run pytest -q -n auto --dist worksteal -o faulthandler_timeout=300 -m flaky "${files[@]}" || rc=$?
          case "${rc}" in
            0) line="every quarantined test in this shard passed" ;;
            5) line="no quarantined test in this shard" ;;
            *) line="a quarantined test failed (pytest exit ${rc}); see this step's log and tests/flaky.txt"
               echo "::warning title=quarantined test failed::${line}" ;;
          esac
          echo "${line}"
          echo "quarantined unit tests: ${line}" >> "${GITHUB_STEP_SUMMARY}"

      - name: record this shard's measured durations
        # The weights the pick step splits by go stale as tests are added and
        # change. Every shard on main uploads what it measured, per file, so a
        # refresh is a download and a merge (docs/ci.md, "Refreshing the shard
        # weights"), never a full local run.
        if: ${{ !cancelled() && steps.pick.outputs.count != '0' && github.ref == 'refs/heads/main' }}
        env:
          JUNIT: ${{ runner.temp }}/unit.xml
          OUT: ${{ runner.temp }}/durations/unit-durations.json
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${OUT}")"
          python3 - <<'PY'
          import collections, json, os
          import xml.etree.ElementTree as ET
          weights = collections.Counter()
          for case in ET.parse(os.environ["JUNIT"]).iter("testcase"):
              if case.get("file"):
                  weights[case.get("file")] += float(case.get("time") or 0)
          with open(os.environ["OUT"], "w") as out:
              json.dump({k: round(max(v, 0.1), 1) for k, v in sorted(weights.items())}, out, indent=1, sort_keys=True)
              out.write("\n")
          print(f"{len(weights)} file(s), {sum(weights.values()):.0f} s")
          PY

      - name: upload this shard's measured durations
        if: ${{ !cancelled() && steps.pick.outputs.count != '0' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/durations/unit-durations.json
          retention-days: 30
          if-no-files-found: ignore

  python:
    # THE CHECK NAME `format / unit tests` IS KEPT, on a job that holds no
    # runner while the work runs: it starts when the shards and the checks
    # have finished, and passes only when each of them passed or was skipped
    # by its own `if:` and `changes` itself succeeded. Before 2026-10-07 this
    # was the one job doing all of it; auto-merge.yml's comments, ci-fix.yml's
    # log reads and every doc name it, and `build` below still needs it.
    name: format / unit tests
    # ON ubuntu-24.04 SINCE CI-FOLD (#1799): it reads `needs` and runs
    # nothing else, so a VM create and boot (~52 s) bought it nothing.
    runs-on: ubuntu-24.04
    needs: [changes, python-checks, python-unit]
    if: always()
    steps:
      - name: every job this check stands for passed, or was skipped by its own if
        # `needs.<job>.result` is success, failure, cancelled or skipped. A job
        # skipped because something it needs failed is skipped too -- but what
        # failed is in this list as well, so it fails here by its own name.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS}" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          failed="$(printf '%s\n' "${NEEDS}" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"] | join(", ")')"
          if [ -n "${failed}" ]; then
            echo "::error::not passed: ${failed}"
            exit 1
          fi
          if [ "$(printf '%s\n' "${NEEDS}" | jq -r '.changes.result // "absent"')" != "success" ]; then
            echo "::error::the changes job did not succeed, so a skip below it means nothing"
            exit 1
          fi
          echo "every job passed or was skipped by its own if"

  ui-build:
    # The half of `swarm-ui typecheck / component tests` that is one process
    # each: the typecheck, the node:test runners and the production build. It
    # runs beside the vitest shards rather than in front of them.
    name: swarm-ui typecheck / build
    # SELF-HOSTED (owner decision 2026-10-12, sagaxyz/ai-studio#336): the ephemeral
    # bogdan-ci VMs, with fork PRs kept on a GitHub-hosted image. The expression is
    # the one tests/unit/scripts/test_fork_prs_off_self_hosted.py enforces, and
    # SELF_HOSTED_CI=off (a repo variable) sends it to ubuntu-24.04 as well.
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    needs: changes
    if: needs.changes.outputs.ui == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'ui-build')
    steps:
      - uses: actions/checkout@v5

      - name: read the Node major the swarm-ui image builds with
        id: node
        # ONE PLACE STATES IT: `ARG NODE_IMAGE` in images/swarm-ui/Dockerfile,
        # the Node that compiles the bundle that ships. This job used to pin
        # `node-version: "20"` on its own -- a second copy, and by 2026-09 a copy
        # of a line that reached end of life in April 2026 (docs/versions.md).
        # Reading it from the Dockerfile means the typecheck, the tests and the
        # build below run on the line the image uses, and a bump there moves
        # this job with it. tests/unit/scripts/test_ui_node_line.py fails if a
        # literal comes back.
        run: |
          set -euo pipefail
          dockerfile=images/swarm-ui/Dockerfile
          majors="$(sed -nE 's/^ARG NODE_IMAGE=node:([0-9]+)[^0-9].*/\1/p' "$dockerfile")"
          count="$(printf '%s' "$majors" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error file=${dockerfile}::expected exactly one 'ARG NODE_IMAGE=node:<major>-...' line, found ${count}"
            exit 1
          fi
          echo "major=${majors}" >> "$GITHUB_OUTPUT"
          echo "swarm-ui builds with Node ${majors} (${dockerfile})"

      - uses: actions/setup-node@v5
        with:
          # From the step above, not a literal. vitest 3.2 and jsdom 25 both
          # support Node 24. `cache: npm` needs the lockfile path because the
          # package is not at the repository root.
          node-version: ${{ steps.node.outputs.major }}
          cache: npm
          cache-dependency-path: apps/swarm-ui/package-lock.json

      - name: the Node that runs is the Node the image builds with
        # setup-node@v5 treats an EMPTY node-version as "no version": its
        # src/main.ts sets Node up only `if (version)`, so it installs
        # nothing and says nothing, and every step below would run -- and go
        # green -- on the runner image's own Node. That is what happens if the
        # output name the step above writes and the one setup-node reads ever
        # drift apart. So compare the Node actually on PATH with the major
        # setup-node was asked for, through the SAME expression, and stop on a
        # mismatch or an empty value. Passed through env, not spliced into the
        # script. tests/unit/scripts/test_ui_node_line.py runs this step
        # against a stand-in `node`; keep it a step of its own for that.
        env:
          WANT_NODE_MAJOR: ${{ steps.node.outputs.major }}
        run: |
          set -euo pipefail
          got="$(node -p 'process.versions.node.split(".")[0]')"
          if [ -z "${WANT_NODE_MAJOR}" ]; then
            echo "::error::setup-node was given no Node major (steps.node.outputs.major is empty), so it installed nothing; this job would run on the runner's Node ${got}"
            exit 1
          fi
          if [ "${got}" != "${WANT_NODE_MAJOR}" ]; then
            echo "::error::the ui job runs Node ${got}, but images/swarm-ui/Dockerfile builds with Node ${WANT_NODE_MAJOR}"
            exit 1
          fi
          echo "running Node ${got}, the major images/swarm-ui/Dockerfile builds with"

      - name: install
        working-directory: apps/swarm-ui
        run: |
          set -euo pipefail
          echo "node $(node --version), npm $(npm --version)"
          npm ci --no-audit --no-fund

      - name: typecheck
        # THE FIRST THING IN THIS REPOSITORY THAT EVER COMPILES THE TYPESCRIPT.
        # Nothing ran `tsc` -- not make lint, not make test, not any workflow --
        # so a field renamed in types.ts did not fail to build. It rendered as
        # `undefined`, which this client prints as an em dash, so the visible
        # symptom was a column reading "not measured" on every row.
        working-directory: apps/swarm-ui
        run: npm run typecheck

      - name: node test runners
        # The two runners `npm test` chains after vitest: node:test over
        # tests/*.test.ts(x) and over test/*.test.mjs. Seconds, not minutes,
        # so they are not sharded; vitest is, in the job below.
        working-directory: apps/swarm-ui
        run: npm run test:node

      - name: production build
        # `npm run build` -- `tsc -b && vite build`, the command the swarm-ui
        # image runs. The typecheck above is `tsc -b --noEmit`; this is the half
        # that EMITS, through vite's bundler and plugins on this Node. Before it
        # was here, a toolchain change (Node 20 to 24 included) was proven only
        # by the image build on main, after merge, behind an approval.
        working-directory: apps/swarm-ui
        run: npm run build

  ui-tests:
    # THE VITEST SUITE, SHARDED (owner request 2026-10-07). ~520 s of jsdom in
    # one job was the other long pole beside the Python unit suite. vitest's
    # own `--shard=k/N` splits the test files; every file runs in exactly one
    # shard. Four, as for Python: ~130 s of tests and ~60 s of install each.
    #
    # WORKERS STAY AT VITEST'S DEFAULT, and that is a measured choice (#605).
    # vitest 3.2's forks pool runs `availableParallelism() - 1` workers outside
    # watch mode: 3 on this 4-vCPU runner, one core left for the main process.
    # The flakes were waits, not starvation: the tests now wait on their read
    # instead (src/__tests__/reads.ts), and setup.ts's asyncUtilTimeout is
    # 2000 ms.
    #
    # Offline by construction: setup.ts replaces the global `fetch` with one
    # that throws, so a test that forgets to stub a response fails by name
    # instead of reaching a machine.
    name: swarm-ui component tests (${{ matrix.shard }}/${{ strategy.job-total }})
    # SELF-HOSTED (owner decision 2026-10-12, sagaxyz/ai-studio#336): the ephemeral
    # bogdan-ci VMs, with fork PRs kept on a GitHub-hosted image. The expression is
    # the one tests/unit/scripts/test_fork_prs_off_self_hosted.py enforces, and
    # SELF_HOSTED_CI=off (a repo variable) sends it to ubuntu-24.04 as well.
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    needs: changes
    if: needs.changes.outputs.ui == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'ui-tests')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5

      - name: read the Node major the swarm-ui image builds with
        id: node
        # ONE PLACE STATES IT: `ARG NODE_IMAGE` in images/swarm-ui/Dockerfile,
        # the Node that compiles the bundle that ships. This job used to pin
        # `node-version: "20"` on its own -- a second copy, and by 2026-09 a copy
        # of a line that reached end of life in April 2026 (docs/versions.md).
        # Reading it from the Dockerfile means the typecheck, the tests and the
        # build below run on the line the image uses, and a bump there moves
        # this job with it. tests/unit/scripts/test_ui_node_line.py fails if a
        # literal comes back.
        run: |
          set -euo pipefail
          dockerfile=images/swarm-ui/Dockerfile
          majors="$(sed -nE 's/^ARG NODE_IMAGE=node:([0-9]+)[^0-9].*/\1/p' "$dockerfile")"
          count="$(printf '%s' "$majors" | grep -c . || true)"
          if [ "$count" -ne 1 ]; then
            echo "::error file=${dockerfile}::expected exactly one 'ARG NODE_IMAGE=node:<major>-...' line, found ${count}"
            exit 1
          fi
          echo "major=${majors}" >> "$GITHUB_OUTPUT"
          echo "swarm-ui builds with Node ${majors} (${dockerfile})"

      - uses: actions/setup-node@v5
        with:
          # From the step above, not a literal. vitest 3.2 and jsdom 25 both
          # support Node 24. `cache: npm` needs the lockfile path because the
          # package is not at the repository root.
          node-version: ${{ steps.node.outputs.major }}
          cache: npm
          cache-dependency-path: apps/swarm-ui/package-lock.json

      - name: the Node that runs is the Node the image builds with
        # setup-node@v5 treats an EMPTY node-version as "no version": its
        # src/main.ts sets Node up only `if (version)`, so it installs
        # nothing and says nothing, and every step below would run -- and go
        # green -- on the runner image's own Node. That is what happens if the
        # output name the step above writes and the one setup-node reads ever
        # drift apart. So compare the Node actually on PATH with the major
        # setup-node was asked for, through the SAME expression, and stop on a
        # mismatch or an empty value. Passed through env, not spliced into the
        # script. tests/unit/scripts/test_ui_node_line.py runs this step
        # against a stand-in `node`; keep it a step of its own for that.
        env:
          WANT_NODE_MAJOR: ${{ steps.node.outputs.major }}
        run: |
          set -euo pipefail
          got="$(node -p 'process.versions.node.split(".")[0]')"
          if [ -z "${WANT_NODE_MAJOR}" ]; then
            echo "::error::setup-node was given no Node major (steps.node.outputs.major is empty), so it installed nothing; this job would run on the runner's Node ${got}"
            exit 1
          fi
          if [ "${got}" != "${WANT_NODE_MAJOR}" ]; then
            echo "::error::the ui job runs Node ${got}, but images/swarm-ui/Dockerfile builds with Node ${WANT_NODE_MAJOR}"
            exit 1
          fi
          echo "running Node ${got}, the major images/swarm-ui/Dockerfile builds with"

      - name: install
        working-directory: apps/swarm-ui
        run: |
          set -euo pipefail
          echo "node $(node --version), npm $(npm --version)"
          npm ci --no-audit --no-fund

      - name: component tests
        # `npm run test:components` is `vitest run`; the arguments after `--`
        # reach vitest because it is the only command in that script (`npm
        # test` chains three, and a trailing argument would reach the last).
        working-directory: apps/swarm-ui
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: npm run test:components -- --shard="${SHARD}/${SHARDS}"

  ui:
    # THE CHECK NAME `swarm-ui typecheck / component tests` IS KEPT, on a job
    # that only reads the others' results, as `format / unit tests` is above.
    name: swarm-ui typecheck / component tests
    # ON ubuntu-24.04 SINCE CI-FOLD (#1799): it reads `needs` and runs
    # nothing else, so a VM create and boot (~52 s) bought it nothing.
    runs-on: ubuntu-24.04
    needs: [changes, ui-build, ui-tests]
    if: always()
    steps:
      - name: every job this check stands for passed, or was skipped by its own if
        # `needs.<job>.result` is success, failure, cancelled or skipped. A job
        # skipped because something it needs failed is skipped too -- but what
        # failed is in this list as well, so it fails here by its own name.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS}" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          failed="$(printf '%s\n' "${NEEDS}" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"] | join(", ")')"
          if [ -n "${failed}" ]; then
            echo "::error::not passed: ${failed}"
            exit 1
          fi
          if [ "$(printf '%s\n' "${NEEDS}" | jq -r '.changes.result // "absent"')" != "success" ]; then
            echo "::error::the changes job did not succeed, so a skip below it means nothing"
            exit 1
          fi
          echo "every job passed or was skipped by its own if"

  integration:
    name: integration tests (emulator)
    # SELF-HOSTED (owner decision 2026-10-12, sagaxyz/ai-studio#336): the ephemeral
    # bogdan-ci VMs, with fork PRs kept on a GitHub-hosted image. The expression is
    # the one tests/unit/scripts/test_fork_prs_off_self_hosted.py enforces, and
    # SELF_HOSTED_CI=off (a repo variable) sends it to ubuntu-24.04 as well.
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    # Skipped when the change reaches nothing in this workflow (`changes`).
    needs: changes
    if: needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'integration')
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v5
        with:
          # The Firestore emulator is a Java program, and it now REQUIRES a
          # Java 21+ JRE: on 17 it refuses to start with "The java executable on
          # your PATH is not a Java 21+ JRE", which is why the integration job
          # sat retrying a connection for two minutes and never said why.
          distribution: temurin
          java-version: "21"

      - uses: google-github-actions/setup-gcloud@v3

      - name: install the emulator
        # RETRIED, BOUNDED (2026-10-14, the flake PR 1281 measured in run
        # 38124880207: the component download failed once and the job went
        # red on a fetch, not on a test). Four tries, 10, 20 and 40 s apart:
        # at most 70 s of waiting before the last failure is reported as
        # itself. Nothing but the download is retried.
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if gcloud components install cloud-firestore-emulator --quiet; then
              exit 0
            fi
            if [ "${attempt}" -eq 4 ]; then
              echo "::error::the Firestore emulator did not install in 4 tries"
              exit 1
            fi
            delay=$((10 * (1 << (attempt - 1))))
            echo "::warning::the emulator download failed (try ${attempt} of 4); retrying in ${delay} s"
            sleep "${delay}"
          done

      - name: sync
        run: uv sync --frozen --all-extras --dev

      - name: run integration tests against the emulator
        # The emulator rather than a mock: the admission path depends on real
        # transaction semantics -- the last-slot race resolves the way it does
        # because Firestore aborts a transaction whose read set changed.
        env:
          PROJECT_ID: swarm-ci
          # The emulator serves the (default) database; the named `swarm`
          # database is a property of the real project, not of the emulator.
          FIRESTORE_DATABASE: "(default)"
          ENVIRONMENT: ci
          # No REQUIRE_AUTH here: the API refuses that setting rather than
          # ignoring it, and integration tests build the app directly with a
          # test principal instead of asking the process to weaken itself.
        run: |
          set -euo pipefail
          gcloud emulators firestore start --host-port=127.0.0.1:8080 \
            --database-mode=firestore-native >/tmp/emulator.log 2>&1 &
          # Wait on the PORT, not on an HTTP response: the emulator does not
          # serve a useful document at "/", and curl's exit 7 was the only signal
          # the old loop ever saw. 120s because a cold JVM start on a CI runner
          # is routinely slower than 60s.
          ready=0
          for _ in $(seq 1 120); do
            if (echo >/dev/tcp/127.0.0.1/8080) >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          # ALWAYS show the log on failure. The old version piped it to a file and
          # then exited on the curl, so CI reported "connection refused" 60 times
          # and never once printed why the emulator had not started.
          if [ "$ready" -ne 1 ]; then
            echo "::error::Firestore emulator did not bind 127.0.0.1:8080 within 120s"
            cat /tmp/emulator.log || true
            exit 1
          fi
          export FIRESTORE_EMULATOR_HOST=127.0.0.1:8080
          # NO "if the directory exists" GUARD. This job is the only place in the
          # repository where the emulator-backed tests run -- `make test` is
          # offline by design and never touches tests/integration -- so a guard
          # that turns "I could not find them" into a green step is a gate that
          # reports success having looked at nothing. Renaming the directory, or
          # a checkout that lands short, used to print "no integration tests
          # present" and exit 0, and the last-slot admission race (the one thing
          # that needs REAL transaction semantics rather than a mock) would merge
          # with CI green. docs/audits/2026-09-18/01-github-workflows.md, #1.
          #
          # pytest fails this step by itself in each of the three ways that
          # matter: exit 4 if the path does not exist, exit 5 if it collects
          # nothing, exit 1 if a test fails.
          # PARALLEL, then the timing-sensitive few on their own.
          #
          # These cases drive the real shell scripts against a fake `curl` that
          # is a Python script, so each of the ~600 requests a suite run makes
          # pays ~42ms of interpreter startup -- ~31s per run, and this suite
          # was 700 of `make test`'s 790 seconds before it was parallelised.
          # The cases are independent and each works in its own tmp_path.
          #
          # The `serial` mark is not a flaky-test quarantine. It is two files
          # whose assertions are ABOUT elapsed time -- one injects a 400ms delay
          # and requires the gate to notice it, the other requires a process to
          # still be running when it is looked at. Under -n they measure the
          # runner's load instead of the thing they were written to measure.
          uv run pytest tests/integration -q -n auto -m "not serial"
          uv run pytest tests/integration -q -m serial

  manifests:
    # NAME-KEEPER (CI-FOLD, #1799): the `kubernetes manifests · ...` steps of
    # `quick-checks` run the check; this passes only on its verdict `success`.
    name: kubernetes manifests
    runs-on: ubuntu-24.04
    needs: [changes, quick-checks]
    if: always() && needs.changes.outputs.app == 'true' && !contains(fromJSON(needs.changes.outputs.reused || '[]'), 'manifests')
    steps:
      - name: the folded check passed in `quick-checks`
        env:
          CHECK: kubernetes manifests
          VERDICT: ${{ needs.quick-checks.outputs.manifests }}
        run: |
          set -euo pipefail
          if [ "${VERDICT}" = "success" ]; then
            echo "'${CHECK}' passed in its folded job"
            exit 0
          fi
          echo "::error::'${CHECK}' did not pass: its folded job's verdict is '${VERDICT:-none}'"
          exit 1

  build-check:
    # A PULL REQUEST BUILDS THE IMAGES IT CHANGES, AND PUSHES NOTHING (#650,
    # owner decision 2026-10-05). Until then images were built only on main, so
    # #641 -- which changed agent-runtime-base's Dockerfile and its repo-index
    # LSP package -- was green here and broke main after merge, when
    # `swarm-repo-index --lsp-self-test` failed in the first build of it.
    #
    # WHICH IMAGES: `build-images.sh --affected-by` reads the pull request's
    # changed paths against every image's inputs -- its recipe's directory,
    # every COPY/ADD source its Dockerfile names, .dockerignore and
    # .gcloudignore -- and adds every image built FROM one it reached. Read
    # from the Dockerfiles, never listed here: a list here is a second copy,
    # and the second copy is the one that drifts.
    #
    # WHERE: ON THIS RUNNER, with `docker buildx`, and with NO Google identity.
    # The owner chose not to create one for pull requests: a pull request's
    # checkout chooses what runs, so whatever that identity could do -- run
    # Cloud Build in the shared project -- anyone able to push a branch could
    # do. So this job authenticates to nothing, logs in to no registry, reads
    # no secret and holds no id-token, and `build-images.sh --build-only
    # --local` exports to the build cache or a local OCI layout only. The
    # configs it builds are the ones --build-only would submit to Cloud Build
    # -- main's Dockerfiles, main's build args -- so the Dockerfiles' RUN
    # self-tests run here as they run on main, and the script reads the list
    # of them from the Dockerfiles into this job's summary. Nothing here names
    # one. Main's `build images` below is unchanged.
    #
    # SKIPPED BY ITS OWN `if:` WHEN NO IMAGE INPUT CHANGED (2026-10-09): the
    # `changes` job runs the same `--affected-by` over the same diff and says
    # `images=false`, so a pull request that reaches no image takes no runner
    # for this. Skipped by its own `if:` reads as a pass to ci-gate only while
    # `changes` succeeded. Otherwise it runs, ci-gate sees it and fails when
    # it fails. It still concludes `success` in seconds, with skipped steps,
    # when its own plan finds nothing to build, and on a pull request from a
    # fork, which the owner's brief (2026-10-05) says skips. A maintainer who
    # wants a fork's images built pushes its branch here. Either way the
    # summary says why.
    name: build changed images without pushing
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    # Not after the other checks, as `build` is: this spends no cloud money,
    # and the image build is the slowest check, so it starts at once.
    timeout-minutes: 120
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.images == 'true'
    permissions:
      contents: read
    env:
      # As main builds it: swarm-ui bakes its environment in at build time.
      ENVIRONMENT: dev
      # The scanner the release's promotion runs, at the SAME pin
      # (release.yml's TRIVY_VERSION; tests/unit/scripts/test_pr_image_scan.py
      # holds the two equal): a pull request's scan that could disagree with
      # the release's would say nothing about whether the release will pass.
      TRIVY_VERSION: "0.74.0"
    steps:
      # Before the checkout, so a fork's pull request is done in seconds.
      - name: is this pull request built here
        id: scope
        # Values reach the shell through env:, never through an expression in run:.
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${HEAD_REPO}" != "${REPOSITORY}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Images built without pushing"
              echo
              echo "**Not built:** a pull request from a fork (${HEAD_REPO}) is not built here; push the branch to ${REPOSITORY} to build its images."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "a pull request from a fork: no image is built"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.scope.outputs.build == 'true'
        with:
          # `base...head` needs both commits and their merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: which images does this pull request reach
        id: plan
        if: steps.scope.outputs.build == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Three dots: the change since the merge base, which is what the pull
          # request merges.
          if git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed"; then
            ./scripts/build-images.sh --affected-by "${RUNNER_TEMP}/changed" > "${RUNNER_TEMP}/images"
          else
            echo "::warning::could not diff ${BASE_SHA}...${HEAD_SHA}; building every image rather than guessing"
            ./scripts/build-images.sh --inputs | cut -f1 | uniq > "${RUNNER_TEMP}/images"
          fi
          total="$(grep -c . "${RUNNER_TEMP}/changed" || true)"
          count="$(grep -c . "${RUNNER_TEMP}/images" || true)"
          images="$(paste -sd' ' "${RUNNER_TEMP}/images")"
          echo "${total:-0} changed file(s) reach ${count} image(s): ${images:-none}"
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          build=true
          [ "${count}" -gt 0 ] || build=false
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          # Only the agent-runtime family needs the disk freed (the step below
          # says why); a service image or swarm-ui builds in what the runner has.
          free_disk=false
          if grep -q '^agent-runtime-' "${RUNNER_TEMP}/images"; then free_disk=true; fi
          echo "free_disk=${free_disk}" >> "$GITHUB_OUTPUT"
          {
            echo "### Images built without pushing"
            echo
            echo "Changed files reach: \`${images:-none}\`."
            echo
            if [ "${build}" = true ]; then
              echo "Each is built on this runner with docker buildx, uncached, with its Dockerfile's self-tests, and nothing is pushed."
            else
              echo "**Not built:** no image input changed, so there is nothing to build."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # agent-runtime-base is ~900 MB compressed and several GB unpacked, and
      # BuildKit holds its builder stage, its runtime and the exported OCI
      # layout at once, before the browser and the indexer (a Go toolchain and
      # two compiled language servers) are built on it. The runner's free disk
      # before and after is written to the summary, so the first run records
      # what was there and what this freed.
      #
      # ONLY FOR THAT FAMILY (2026-10-09). Deleting these trees took a median
      # 92 s and up to 261 s -- three times the median build itself -- on every
      # pull request that built any image, a service image alone included
      # (docs/ci.md "Where pull-request CI time goes"). Every agent-runtime-*
      # image is either the base or built FROM it, so the plan step asks for
      # this whenever one of them is in the list.
      - name: free runner disk
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.free_disk == 'true'
        run: |
          set -euo pipefail
          before="$(df -h --output=avail / | tail -n 1 | tr -d ' ')"
          # Toolchains this job never uses.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune --all --force > /dev/null
          after="$(df -h --output=avail / | tail -n 1 | tr -d ' ')"
          echo "free disk on /: ${before} before, ${after} after"
          echo "Free disk on \`/\`: ${before} before freeing, ${after} after." >> "$GITHUB_STEP_SUMMARY"

      # build-images.sh reads each build config with PyYAML to replay it.
      - uses: actions/setup-python@v6
        if: steps.plan.outputs.build == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: install PyYAML
        if: steps.plan.outputs.build == 'true'
        run: python3 -m pip install --quiet pyyaml

      - name: the tool mirror holds what this pull request pins
        # C3 (owner decision 2026-10-14). PR 1276 added a row to
        # images/agent-runtime-base/tool-mirror.sha256 and merged before the
        # operator had uploaded its object, so main's Cloud Build failed at
        # its `tool-mirror` step. `refresh-build-mirror.sh --check` reads the
        # bucket, which this job cannot: it holds no Google identity (owner
        # decision 2026-10-05). So, offline: the manifest and the
        # Dockerfiles' pins agree (test_build_mirror_switch.py, the check that
        # holds them), and every row this pull request ADDS is named here as the
        # object the operator must upload before merging -- a warning
        # annotation on the pull request and a line in this job's summary.
        if: steps.plan.outputs.build == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          manifest=images/agent-runtime-base/tool-mirror.sha256
          git diff "${BASE_SHA}...${HEAD_SHA}" -- "${manifest}" \
            | sed -nE 's/^\+([0-9a-f]{64})[[:space:]]+(.+)$/\2/p' > "${RUNNER_TEMP}/mirror-added"
          python3 -m pip install --quiet pytest pyyaml
          python3 -m pytest -q -p no:cacheprovider \
            'tests/unit/scripts/test_build_mirror_switch.py::test_the_manifest_is_every_file_the_base_reads_at_its_pinned_sha256'
          count="$(grep -c . "${RUNNER_TEMP}/mirror-added" || true)"
          if [ "${count:-0}" -gt 0 ]; then
            {
              echo "### New tool-mirror objects"
              echo
              echo "This pull request adds ${count} row(s) to \`${manifest}\`. Main's \`build images\` uploads each missing one from upstream, sha256-checked, before it builds (\`scripts/refresh-build-mirror.sh --tools-only\`); an upstream that is down or a sha256 that does not match then fails main's build, so check the URLs below are reachable (docs/runbooks/build-mirror.md):"
              echo
              sed 's/^/- `/; s/$/`/' "${RUNNER_TEMP}/mirror-added"
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r obj; do
              echo "::warning file=${manifest},title=new tool-mirror object::${obj} is new: main's build uploads it from https://${obj} after checking its sha256 (refresh-build-mirror.sh --tools-only)"
            done < "${RUNNER_TEMP}/mirror-added"
          else
            echo "no tool-mirror row added; the manifest and the Dockerfiles' pins agree"
          fi

      - name: install trivy, at the release's pin
        if: steps.plan.outputs.build == 'true'
        # The release installs it the same way (.github/actions/release-images),
        # with bounded retries here because a failed download is not a finding.
        # Into a directory this job owns, put on PATH for the steps after it:
        # run 38663457125 (2026-10-15) was refused `/usr/local/bin` on this
        # hosted runner ("install: cannot create regular file
        # '/usr/local/bin/trivy': Permission denied") three times over.
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/trivy-bin"
          mkdir -p "${bin}"
          curl -sSfL --retry 5 --retry-all-errors -o "${RUNNER_TEMP}/trivy-install.sh" \
            "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh"
          for attempt in 1 2 3; do
            if sh "${RUNNER_TEMP}/trivy-install.sh" -b "${bin}" "v${TRIVY_VERSION}"; then break; fi
            [ "${attempt}" -lt 3 ] || exit 1
            sleep $((10 * attempt))
          done
          echo "${bin}" >> "$GITHUB_PATH"
          "${bin}/trivy" --version

      - name: build with docker buildx, pushing nothing
        if: steps.plan.outputs.build == 'true'
        env:
          IMAGES: ${{ steps.plan.outputs.images }}
          # C3: each image is scanned as soon as it is built, with the
          # release's policy (scripts/lib/image-scan.sh); a fixable HIGH or
          # CRITICAL finding fails this job, as it would fail the release.
          BUILD_ONLY_SCAN: scripts/scan-image-layout.sh
        run: |
          set -euo pipefail
          read -r -a images <<<"${IMAGES}"
          ./scripts/build-images.sh --build-only --local "${images[@]}"

      - name: what each build ran
        if: always() && steps.plan.outputs.build == 'true'
        run: |
          set -euo pipefail
          if [ -f build/build-only/local-report.md ]; then
            cat build/build-only/local-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          df -h /

  build:
    name: build images
    runs-on: ubuntu-24.04
    needs: [python, shell, manifests]
    # THE ONE BUILD OF A COMMIT. Owner decision, 2026-09-24 (docs/ci.md): this
    # job builds every image once per commit on main -- each commit main has
    # not moved past by the time it runs, since 2026-10-26 (the workflow's
    # `concurrency:`) -- and uploads the manifest it writes -- each image's digest, the tag, the commit and the environment --
    # as the artifact `images-dev`. release.yml waits for THIS job for the same
    # commit and promotes exactly those digests; it no longer builds its own.
    # Until then every push to main built all eight images twice, the two
    # builds competing for Cloud Build in a shared project and the release
    # waiting behind the duplicate (94ee043: this job 16:33:09-16:41:51, the
    # release's copy 16:39:24-16:48:17).
    #
    # So the job's NAME is part of an interface: scripts/lib/ci-built-images.sh
    # finds it by name, and tests/unit/scripts/test_ci_built_images.py fails if
    # the two disagree.
    #
    # A build costs money and needs cloud credentials, so it runs only after the
    # free checks have passed.
    #
    # THE REF PIN IS THE CONTROL.
    #
    # This job authenticates as vars.GCP_DEPLOY_SA and then runs
    # ./scripts/build-images.sh from its own checkout. build-images.sh executes
    # any checked-in images/<t>/cloudbuild.yaml or apps/<t>/cloudbuild.yaml as a
    # Cloud Build config, so whoever wrote the checkout chooses what runs. The
    # deployer holds roles/secretmanager.admin, roles/datastore.owner,
    # roles/storage.admin and roles/resourcemanager.projectIamAdmin
    # (terraform/bootstrap/variables.tf) -- enough to read every tenant's
    # provider key, read and write the whole swarm Firestore database, and
    # self-escalate to owner.
    #
    # `github_allowed_refs` is ['refs/heads/main'], so a pull_request ref --
    # `refs/pull/<n>/merge` -- is rejected by the pool's attribute condition and
    # the auth step fails with:
    #
    #     unauthorized_client: The given credential is rejected by the
    #     attribute condition.
    #
    # Measured on 2026-09-24, the first run after WIF was applied. That is the
    # boundary doing its job. A pull request that could mint this identity is a
    # pull request that owns a SHARED project, and anyone can open a pull
    # request.
    #
    # The `build-pr` environment below is NOT a second control: measured on
    # 2026-09-24 it has no protection rules and no deployment-branch policy.
    # The ref pin is the whole of it.
    #
    # SO THE JOB IS SKIPPED ON A PULL REQUEST RATHER THAN LEFT TO FAIL. It could
    # never go green there, and a permanently red required check is precisely the
    # standing pressure to "fix CI" by adding refs/pull/* to github_allowed_refs
    # -- which is the one change that must never be made. Leaving it red does not
    # protect anything; it only makes the protection look like a bug.
    # A pull request builds the images it changes in `build-check` above, on
    # the runner, with no identity at all, and pushes nothing.
    #
    # NOR ON A MERGE QUEUE ENTRY, for the same reason: its OIDC ref is
    # `refs/heads/gh-readonly-queue/main/...`, which the pool rejects as it
    # rejects refs/pull/*. Left to run, it would fail every entry's run and so
    # ci-gate on every entry. The commit is built once it is on main, by the
    # push run, as every commit is.
    # A needed check skipped by its paths (shell, manifests) is not a failure:
    # without this guard GitHub skips the build too, and the release then
    # refuses the unbuilt commit (adc51c0f, 2026-10-14).
    # Main's push and a dispatch only: a lane push (`swarm/**`, LANE CI-EARLY)
    # is tested here but never builds or pushes an image. A disjunction, not
    # parentheses: `&&` binds tighter than `||`, and the workflow models in
    # tests/unit/scripts read this shape (test_workflow_step_reachability.py).
    if: ${{ !cancelled() && !failure() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && github.ref == 'refs/heads/main' || !cancelled() && !failure() && github.event_name == 'workflow_dispatch' }}
    environment: build-pr
    # Authenticates to Google through workload identity: the only reason this
    # job holds id-token (the workflow grants it to no one by default).
    # actions: read lists this workflow's earlier runs on main and downloads
    # the newest ancestor's `images-dev` record (ci-built-images.sh --previous).
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      # dev, and only dev: swarm-ui bakes its environment into the bundle when
      # it is compiled, so this build is a DEV build. A prod release finds no
      # `images-prod` record here and builds its own, through the same script.
      ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: --incremental diffs this commit against the
          # one each reused digest was built from, and --previous tells an
          # ancestor's run from a later merge's by git. A one-commit clone can
          # do neither, and would rebuild everything every time.
          fetch-depth: 0

      # uv.lock precision: a Python image is rebuilt on a uv.lock change only
      # if its own pruned `uv export` exports something different. Without uv
      # the script cannot tell, and rebuilds it.
      - uses: astral-sh/setup-uv@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: fill the tool mirror with what this commit pins
        # OWNER DECISION 2026-10-14 (PR 1298; docs/ci.md "A pull request scans
        # the images it builds"). PR 1276 merged a new tool-mirror row before
        # anyone uploaded its object, and this build failed at its
        # `tool-mirror` step. A pull request cannot see the bucket (it has no
        # Google identity), so it only warns; this job can, so it fills it.
        # `--tools-only` uploads every manifest object the bucket lacks, each
        # downloaded from upstream and checked against its pinned sha256
        # first (a mismatch is refused and fails the step, naming it); an
        # object already there is left alone; nothing is ever deleted; no
        # image is pulled through. Main only: this job never runs on a pull
        # request or a queue entry (its `if:` above).
        run: ./scripts/refresh-build-mirror.sh --tools-only

      - name: build with Cloud Build
        # Never a local docker build: the targets are amd64 and Cloud Build is
        # also where the build service account lives.
        #
        # NO --tag. The tag is the commit's (git_sha, scripts/lib/common.sh),
        # derived in one place, so a release that has to build a commit itself
        # tags it exactly as this job would have. This used to be
        # `pr-<run>-<sha>` -- a pull-request name for a build that only ever
        # runs on main.
        #
        # ONLY WHAT THE COMMIT CHANGED (owner decision 2026-10-08, observer
        # proposal H; docs/ci.md). Measured that day: this job rebuilt all 9
        # images on every push, 9.0-10.4 min (the base 5m04, then the
        # browser 3m21; a service image 2m09-2m42), and a uv.lock change
        # alone reached 7 of 9. --previous finds the newest record this job
        # made for an ancestor of this commit; --incremental rebuilds the
        # images a diff from it reaches and gives every other image's
        # previous digest this commit's tag. The record it uploads below
        # still names all 9 digests, so the release, both scans and the
        # deploy see a whole build. Exit 3 (nothing to build on) and exit 1
        # (the API could not be read) both mean a full build, said in the
        # log and in the summary.
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_build && 'true' || 'false' }}
        run: |
          set -euo pipefail
          previous="build/previous-images-${ENVIRONMENT}.json"
          if [ "${FULL_BUILD}" = "true" ]; then
            ./scripts/build-images.sh --incremental none --full-build "the full_build input was set on this dispatch"
            exit 0
          fi
          rc=0
          ./scripts/lib/ci-built-images.sh --previous --sha "${GITHUB_SHA}" \
            --environment "${ENVIRONMENT}" --out "${previous}" || rc=$?
          if [ "${rc}" -eq 0 ]; then
            ./scripts/build-images.sh --incremental "${previous}"
          elif [ "${rc}" -eq 3 ]; then
            ./scripts/build-images.sh --incremental none
          else
            ./scripts/build-images.sh --incremental none --full-build "the previous build could not be read from the GitHub API (exit ${rc})"
          fi

      - name: say which images were rebuilt and which reused
        # After a failed build there is no manifest, and nothing to say.
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          manifest="build/images-${ENVIRONMENT}.json"
          [ -f "${manifest}" ] || exit 0
          {
            echo "### Images for \`$(jq -r .tag "${manifest}")\`"
            echo
            jq -r '
              if (.incremental.full_build // null) != null then "Every image rebuilt: \(.incremental.full_build)."
              elif (.incremental.previous // null) != null then "Unchanged images reuse the digests built for an ancestor; the previous build was of `\(.incremental.previous[0:12])`."
              else "Every image rebuilt." end' "${manifest}"
            echo
            echo "| image | | digest | built from |"
            echo "|---|---|---|---|"
            jq -r '.images[] | "| \(.name) | \(if .reused then "reused" else "**rebuilt**" end) | `\(.digest[7:19])` | `\((.built_from // "")[0:12])` |"' "${manifest}"
            echo
            echo "$(jq '[.images[] | select(.reused | not)] | length' "${manifest}") rebuilt, $(jq '[.images[] | select(.reused)] | length' "${manifest}") reused, of $(jq '.images | length' "${manifest}")."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: record the digests for the release
        uses: actions/upload-artifact@v6
        with:
          # scripts/lib/ci-built-images.sh downloads `images-<environment>`
          # and reads `images-<environment>.json` out of it.
          name: images-${{ env.ENVIRONMENT }}
          path: build/images-${{ env.ENVIRONMENT }}.json
          if-no-files-found: error
          # A re-run of this job rebuilds the commit; its record must replace
          # the first one, or a release would promote the older build.
          overwrite: true
          # 30 days, as long as the promotion manifests release.yml keeps: a
          # release dispatched later for this commit can still reuse it. Past
          # that a dispatched release builds the commit again.
          retention-days: 30

  tested-tree:
    # WHAT THIS RUN PROVED, KEYED BY THE TREE IT TESTED (B1, owner decision
    # 2026-10-14; docs/ci.md "Main reuses the tested tree"). Every run but
    # main's own -- a pull request, a merge-train branch, a queue entry --
    # uploads `tested-tree-<tree>`: the tree hash of the commit it checked
    # out (a pull request's merge commit, which is the tree its squash merge
    # commits to main when it is up to date), the event, the `changes` job's
    # python mode and every test job that concluded success.
    # scripts/lib/ci_reuse.py writes it, and on main -- or, for a lane
    # push's record, on that lane's pull request (CI-TREE-REUSE, #1798) --
    # reads it back and checks every fact against the GitHub API and git
    # before skipping anything (the `changes` job's `reuse` step).
    #
    # IN CI-GATE'S `needs`, so the record exists before the pull request can
    # merge: a record uploaded after the merge would race main's lookup.
    # Writing it is strict -- a broken record is a bug to see -- but its
    # upload is not: a failed upload costs main one full run, never a merge.
    name: record the tested tree
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    needs: [changes, shell, workflows, ruff, python-checks, python-unit, ui-build, ui-tests, integration, manifests]
    if: always() && needs.changes.result == 'success' && github.ref != 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: write the record
        id: record
        env:
          NEEDS: ${{ toJSON(needs) }}
          PYTHON: ${{ needs.changes.outputs.python }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/lib/ci_reuse.py record --needs "${NEEDS}" --python "${PYTHON}" \
            --event "${EVENT}" --sha "${SHA}" --out-dir "${RUNNER_TEMP}/tested-tree" \
            --github-output "${GITHUB_OUTPUT}"

      - name: upload the record
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: tested-tree-${{ steps.record.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree/
          if-no-files-found: error
          # A re-run of a failed job writes the record again; it replaces this one.
          overwrite: true
          retention-days: 7

  ci-gate:
    # THE ONE CHECK MAIN'S RULESET REQUIRES FOR THIS WORKFLOW AND terraform.yml
    # (ruleset main-protection, id 24160219; owner decision 2026-09-29). Its
    # context is this job's name, so it stays exactly `ci-gate`: a rename
    # un-requires the gate without a word.
    #
    # A JOB THAT `needs:` EVERY OTHER JOB, NOT A WORKFLOW THAT POLLS (owner
    # request 2026-10-07). Until then ci-gate was its own workflow,
    # ci-gate.yml, whose one job started with the pull request and polled the
    # Actions API every 60 s until this workflow's run finished -- a runner held
    # for the whole ~12 minutes of CI, on every pull request, while twelve pull
    # requests opened together queued their jobs 400-600 s for runners. Now
    # GitHub starts it when the last job here has finished, and it holds a
    # runner for seconds.
    #
    # WHAT IT MEANS IS UNCHANGED: pass only when everything this workflow and
    # terraform.yml ran for the commit passed.
    #   * this workflow: every job in `needs` concluded success, or skipped by
    #     its own `if:` (a job skipped because something it needs failed is
    #     skipped too, but what failed is in the list and fails it by name),
    #     and `changes` itself succeeded;
    #   * terraform.yml, still path-filtered, still its own run:
    #     scripts/ci-gate.sh waits for it at this commit -- told to gate only
    #     terraform.yml (CI_GATE_WORKFLOWS), since waiting here for this
    #     workflow's own run would wait for itself.
    #
    # `if: ${{ !cancelled() }}` so it reports when something it needs failed
    # -- skipped would read as passed -- and does NOT run in a run that was
    # cancelled (#2582, BGD 2026-10-28). Under `always()` it ran inside push
    # runs concurrency cancelled and concluded `failure` over needs that were
    # only cancelled ("not passed: shell (cancelled), ..."), and the merge
    # step refused PR #2565 `checks_failed` on it while the newer push run
    # was still running. `!cancelled()` is still true after a failed need --
    # a failure does not cancel the run -- so the step below still runs and
    # fails naming it. If this workflow fails to start at all, no `ci-gate`
    # check exists and the ruleset holds the pull request: closed, not open.
    #
    # EVERY JOB BUT THE TWO NAME-KEEPERS, `python` (`format / unit tests`) and
    # `ui` (`swarm-ui typecheck / component tests`) (2026-10-09). They run no
    # check of their own: each judges its `needs` exactly as the first step
    # below does, and every job they need is in this list, so the gate already
    # reads every result they read. Waiting for them was one more runner to
    # queue for between the last shard and the gate: a median 40 s and up to
    # 311 s on the pull-request critical path, measured over the 17 runs in
    # docs/ci.md "Where pull-request CI time goes (2026-10-09)". They still
    # run and still report their names. test_ci_gate.py holds both halves:
    # the gate needs every other job, and each name-keeper's `needs` is inside
    # the gate's.
    name: ci-gate
    runs-on: ${{ (vars.SELF_HOSTED_CI == 'off' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main') || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-24.04' || fromJSON(format('["self-hosted","linux","x64","{0}"]', vars.SWARM_CI_RUNNER_LABEL || 'swarm-ci')) }}
    needs: [shell, workflows, ruff, changes, quick-checks, python-checks, python-unit, ui-build, ui-tests, integration, manifests, build-check, build, tested-tree]
    if: ${{ !cancelled() }}
    # The script gives up at 90 minutes (CI_GATE_WAIT) and says what was still
    # pending; this is only the backstop behind it.
    timeout-minutes: 100
    # Read-only. `actions: read` lists terraform.yml's runs and their jobs;
    # `contents: read` checks out the repository to read terraform.yml's path
    # list and diff the change. Nothing here writes anything.
    permissions:
      actions: read
      contents: read
    steps:
      - name: every job of this workflow passed, or was skipped by its own if
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "${NEEDS}" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          failed="$(printf '%s\n' "${NEEDS}" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key) (\(.value.result))"] | join(", ")')"
          if [ -n "${failed}" ]; then
            echo "::error::not passed: ${failed}"
            exit 1
          fi
          if [ "$(printf '%s\n' "${NEEDS}" | jq -r '.changes.result // "absent"')" != "success" ]; then
            echo "::error::the changes job did not succeed, so a skip below it means nothing"
            exit 1
          fi
          echo "every job passed or was skipped by its own if"

      - uses: actions/checkout@v5
        if: github.event_name != 'workflow_dispatch'
        with:
          # The changed files are `git diff base...head`; a shallow clone has
          # neither the base nor the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: a job skipped by reuse passes only when the reuse step listed it
        # CI-TREE-REUSE (#1798). The step above counts every skip as a pass;
        # this one asks where each skip came from. A reusable job this change
        # reaches (its own `if:` before the reuse clause, ci_reuse.py REACH)
        # that was skipped passes only when the `changes` job's `reuse` step
        # listed it and named the run it passed in. The summary cites that
        # run, so a reader can see where the green came from.
        if: github.event_name != 'workflow_dispatch'
        # GATE_NEEDS, not NEEDS: test_ci_gate.py runs the one step reading
        # NEEDS as the gate's first judgement.
        env:
          GATE_NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/lib/ci_reuse.py gate --needs "${GATE_NEEDS}" --event "${EVENT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

      - name: wait for terraform.yml at this commit
        # A dispatch has no pull request, push or queue entry to compare, and
        # terraform.yml is not dispatched with it: there is nothing to wait for.
        if: github.event_name != 'workflow_dispatch'
        # Every value reaches the shell through env:, never through an
        # expression inside run:.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # A pull request's runs carry its HEAD sha, not the merge commit's.
          # A queue entry's carry `github.sha`, the entry's own commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The pull request's base, a queue entry's base, or a push's `before`.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          # The workflows the script waits on. Not this one: its jobs are
          # judged by the step above, and its own run cannot finish before
          # this job does.
          CI_GATE_WORKFLOWS: terraform.yml
          # NO SETTLE WINDOW. It exists to see a run the path model did not
          # predict before passing, because the gate used to start on the
          # event, often before the other runs existed. This step starts after
          # `changes` -- a job of a run created by the same event -- finished,
          # and the runs of one event are created together, so any
          # terraform.yml run for this commit already exists. A 60 s settle
          # would add 60 s to every pull request's wall time for nothing.
          CI_GATE_SETTLE: "0"
          # terraform.yml takes ~80 s and usually finished long ago; when it
          # has not, look again in 20 s rather than 60.
          CI_GATE_POLL: "20"
        run: scripts/ci-gate.sh wait --event "$EVENT" --sha "$HEAD_SHA" --base "$BASE_SHA"
