# ci-gate: the one check main's ruleset can require for application.yml and
# terraform.yml.
#
# Owner decision, 2026-09-29: the ruleset (main-protection, id 24160219)
# requires only security.yml's four checks, because application.yml and
# terraform.yml are path-filtered and GitHub holds a required check whose
# workflow was filtered out as pending FOREVER. This job has no filter of its
# own, so it reports on every pull request and every push to main; it waits
# for those two workflows' runs at the same head commit and passes only when
# every one of them that ran passed. The logic, and why each rule is what it
# is, lives in scripts/ci-gate.sh; docs/ci.md has the ruleset step.

name: ci-gate

on:
  # No paths, no branches, no types: a filtered gate is the problem this
  # exists to solve (tests/unit/scripts/test_ci_gate.py holds it).
  pull_request:
  push:
    branches: [main]
  # A merge queue entry (owner decision 2026-10-06, docs/ci.md "Main merges
  # through a merge queue"): ci-gate is a required check, so it must report
  # on the entry's ref, and application.yml and terraform.yml run there too,
  # unfiltered, so the gate waits for both. `checks_requested` is the only
  # type GitHub raises; naming it is not a filter.
  merge_group:
    types: [checks_requested]

# Read-only. `actions: read` lists the runs and their jobs; `contents: read`
# checks out the repository to read the workflow files' path lists and to
# diff the pull request. Nothing here writes anything.
permissions:
  actions: read
  contents: read

concurrency:
  # A newer push to the same pull request supersedes this commit's gate. On
  # main every commit has its own group, so nothing cancels a main gate.
  group: ci-gate-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  ci-gate:
    # The required check's context is this name. Renaming it un-requires the
    # gate without a word, so it stays exactly `ci-gate`.
    name: ci-gate
    runs-on: ubuntu-24.04
    # The script gives up at 90 minutes (CI_GATE_WAIT) and says what was still
    # pending; this is only the backstop behind it.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
        with:
          # The changed files are `git diff base...head`; a shallow clone has
          # neither the base nor the merge base.
          fetch-depth: 0
          persist-credentials: false

      - name: wait for application.yml and terraform.yml at this commit
        # Every value reaches the shell through env:, never through an
        # expression inside run:.
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          # A pull request's runs carry its HEAD sha, not the merge commit's.
          # A queue entry's carry `github.sha`, the entry's own commit.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # The pull request's base, a queue entry's base, or a push's `before`.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: scripts/ci-gate.sh wait --event "$EVENT" --sha "$HEAD_SHA" --base "$BASE_SHA"
