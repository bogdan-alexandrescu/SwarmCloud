server {
    # 8080, not 80: nginx-unprivileged cannot bind a privileged port, and the
    # cloud_run module's container_port defaults to 8080.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cloud Run needs a cheap liveness answer that does not depend on the
    # bundle being present.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Hashed asset filenames are immutable, so they may be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached: it is the only file whose name does not
    # change between releases, so a cached copy pins a browser to a dead bundle.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # WHICH ENVIRONMENT THIS DEPLOYMENT IS (DAYONE-UIENV-1). The image compiles
    # none; the entrypoint script in images/swarm-ui/Dockerfile writes this
    # file from the container's ENVIRONMENT when it starts, under /tmp because
    # uid 101 cannot write the bundle's directory. Never cached, for the same
    # reason as index.html: a cached copy would outlive the revision that
    # wrote it. A missing file is a 404, never the SPA fallback below, so the
    # console reads "declared nothing" rather than parse an HTML page.
    location = /config.json {
        alias /tmp/swarm-ui/config.json;
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback. /v1/* never reaches here -- the load balancer routes it to
    # swarm-api -- so an unmatched path is a UI route, not a missing API call.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # This service holds no secrets and no tenant data, but it is the origin the
    # browser executes, so the headers that constrain what that page may do
    # belong here rather than nowhere.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
